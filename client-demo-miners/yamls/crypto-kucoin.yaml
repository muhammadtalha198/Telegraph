version: "1"
kind: miner
id: 32010
slug: crypto-kucoin
protocol: generic
name: KuCoin Crypto Price
description: >
  KuCoin public level1 ticker. Intent CRYPTO_PRICE. Direct Request shows symbol (e.g. BTC-USDT).

base_url: https://api.kucoin.com

auth:
  type: none

rate_limit_per_sec: 2
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.kucoin.com/
  website: https://www.kucoin.com/

endpoints:
  - path: /query
    external_path: /api/v1/market/orderbook/level1
    method: GET
    description: Spot crypto price for intent CRYPTO_PRICE via KuCoin Crypto Price.
    intents: [CRYPTO_PRICE]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: KuCoin symbol like BTC-USDT

input_schema:
  type: object
  required: [symbol]
  properties:
    symbol:
      type: string
      description: KuCoin trading pair
      default: "BTC-USDT"

semantics:
  signal_mapping:
    label_field: data.price
  supported_intents:
    - CRYPTO_PRICE

on_chain:
  description: Stores crypto spot signal for CRYPTO_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

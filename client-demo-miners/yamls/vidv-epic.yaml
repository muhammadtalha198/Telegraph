version: "1"
kind: miner
id: 129001
slug: vidv-epic
protocol: generic
name: EPIC Video Frame Verify
description: >
  NASA EPIC frame sequence video proxy. Intent VIDEO_VERIFICATION.

base_url: https://epic.gsfc.nasa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://epic.gsfc.nasa.gov/about/api
  website: https://epic.gsfc.nasa.gov

endpoints:
  - path: /query
    external_path: /api/natural
    method: GET
    description: Query for intent VIDEO_VERIFICATION via EPIC Video Frame Verify.
    intents: [VIDEO_VERIFICATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - VIDEO_VERIFICATION

on_chain:
  description: Stores signal for VIDEO_VERIFICATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


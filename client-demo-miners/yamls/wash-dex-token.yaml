version: "1"
kind: miner
id: 80001
slug: wash-dex-token
protocol: generic
name: DexScreener Token Pairs
description: >
  DexScreener pairs for token wash signals. Intent WASH_TRADING_DETECTION.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com

endpoints:
  - path: /query
    external_path: /latest/dex/tokens/{token}
    method: GET
    description: Query for intent WASH_TRADING_DETECTION via DexScreener Token Pairs.
    intents: [WASH_TRADING_DETECTION]
    params:
      path:
        required:
          - name: token
            type: string
            intents: ["*"]
            description: Token address

input_schema:
  type: object
  required: [token]
  properties:
    token: {type: string, description: Token address, default: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"}

semantics:
  signal_mapping:
    label_field: pairs
  supported_intents:
    - WASH_TRADING_DETECTION

on_chain:
  description: Stores signal for WASH_TRADING_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


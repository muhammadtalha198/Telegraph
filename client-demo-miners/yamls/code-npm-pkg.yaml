version: "1"
kind: miner
id: 60010
slug: code-npm-pkg
protocol: generic
name: NPM Package Metadata
description: >
  NPM package metadata for dependency review. Intent CODE_REVIEW.

base_url: https://registry.npmjs.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/npm/registry/blob/main/docs/responses/package-metadata.md
  website: https://www.npmjs.com/

endpoints:
  - path: /query
    external_path: /{pkg}/latest
    method: GET
    description: Query for intent CODE_REVIEW via NPM Package Metadata.
    intents: [CODE_REVIEW]
    params:
      path:
        required:
          - name: pkg
            type: string
            intents: ["*"]
            description: Package name

input_schema:
  type: object
  required: [pkg]
  properties:
    pkg: {type: string, description: Package name, default: "react"}

semantics:
  signal_mapping:
    label_field: version
  supported_intents:
    - CODE_REVIEW

on_chain:
  description: Stores signal for CODE_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

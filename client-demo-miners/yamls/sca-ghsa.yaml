version: "1"
kind: miner
id: 151007
slug: sca-ghsa
protocol: generic
name: GHSA Audit Advisories
description: >
  GitHub security advisories audit. Intent SMART_CONTRACT_AUDIT.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest
  website: https://github.com

endpoints:
  - path: /query
    external_path: /advisories
    method: GET
    description: Query for intent SMART_CONTRACT_AUDIT via GHSA Audit Advisories.
    intents: [SMART_CONTRACT_AUDIT]
    params:
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page

input_schema:
  type: object
  required: [per_page]
  properties:
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - SMART_CONTRACT_AUDIT

on_chain:
  description: Stores signal for SMART_CONTRACT_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


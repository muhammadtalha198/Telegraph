version: "1"
kind: miner
id: 87021
slug: ven-ofac-entity
protocol: generic
name: OFAC Vendor Screen
description: >
  OFAC SDN name screen → sanctioned (1/0).
  Intent VENDOR_VERIFY — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/ofac-screen
    method: GET
    description: Query for intent VENDOR_VERIFY via OFAC Vendor Screen.
    intents: [VENDOR_VERIFY]
    params:
      query:
        required:
          - name: entity
            type: string
            intents: ["*"]
            description: Company or person name

input_schema:
  type: object
  required: [entity]
  properties:
    entity: {type: string, description: "Company or person name", default: "PUTIN"}

semantics:
  signal_mapping:
    label_field: sanctioned
  supported_intents:
    - VENDOR_VERIFY

on_chain:
  description: Stores signal for VENDOR_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

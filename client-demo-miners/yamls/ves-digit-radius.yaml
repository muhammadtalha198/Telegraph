version: "1"
kind: miner
id: 93003
slug: ves-digit-radius
protocol: generic
name: Digitraffic AIS by MMSI
description: >
  Digitraffic AIS location by MMSI (sog). Intent VESSEL_TELEMETRY_VERIFY.
  Formerly radius-keyed; remapped to mmsi so the pinned question is askable.

base_url: https://meri.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/marine-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/ais/v1/locations
    method: GET
    description: Query for intent VESSEL_TELEMETRY_VERIFY via Digitraffic AIS by MMSI.
    intents: [VESSEL_TELEMETRY_VERIFY]
    params:
      query:
        required:
          - name: mmsi
            type: string
            intents: ["*"]
            description: Vessel MMSI

input_schema:
  type: object
  required: [mmsi]
  properties:
    mmsi: {type: string, description: Vessel MMSI, default: "230992000"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - VESSEL_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for VESSEL_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 118009
slug: po-binance
protocol: generic
name: Binance PO Ticker
description: >
  Binance ticker PO value verify. Intent PURCHASE_ORDER_VERIFY.

base_url: https://api.binance.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://binance-docs.github.io/apidocs/spot/en/
  website: https://www.binance.com

endpoints:
  - path: /query
    external_path: /api/v3/ticker/price
    method: GET
    description: Query for intent PURCHASE_ORDER_VERIFY via Binance PO Ticker.
    intents: [PURCHASE_ORDER_VERIFY]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: Symbol

input_schema:
  type: object
  required: [symbol]
  properties:
    symbol: {type: string, description: Symbol, default: "ETHUSDT"}

semantics:
  signal_mapping:
    label_field: price
  supported_intents:
    - PURCHASE_ORDER_VERIFY

on_chain:
  description: Stores signal for PURCHASE_ORDER_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


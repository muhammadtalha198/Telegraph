version: "1"
kind: miner
id: 74008
slug: patch-gh-commits-list
protocol: generic
name: GitHub Commits List
description: >
  GitHub recent commits list. Intent CODE_PATCH_VERIFY.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/commits/commits
  website: https://github.com/

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/commits
    method: GET
    description: Query for intent CODE_PATCH_VERIFY via GitHub Commits List.
    intents: [CODE_PATCH_VERIFY]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [owner, repo, per_page]
  properties:
    owner: {type: string, description: Owner, default: "facebook"}
    repo: {type: string, description: Repo, default: "react"}
    per_page: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CODE_PATCH_VERIFY

on_chain:
  description: Stores signal for CODE_PATCH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

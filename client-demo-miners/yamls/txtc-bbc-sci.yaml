version: "1"
kind: miner
id: 110004
slug: txtc-bbc-sci
protocol: generic
name: BBC Science Category
description: >
  BBC science RSS classification. Intent TEXT_CLASSIFICATION.

base_url: https://feeds.bbci.co.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.bbc.co.uk/news
  website: https://www.bbc.co.uk

endpoints:
  - path: /query
    external_path: /news/science_and_environment/rss.xml
    method: GET
    description: Query for intent TEXT_CLASSIFICATION via BBC Science Category.
    intents: [TEXT_CLASSIFICATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: rss
  supported_intents:
    - TEXT_CLASSIFICATION

on_chain:
  description: Stores signal for TEXT_CLASSIFICATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


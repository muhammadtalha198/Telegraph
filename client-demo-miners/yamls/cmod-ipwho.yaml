version: "1"
kind: miner
id: 123010
slug: cmod-ipwho
protocol: generic
name: IPWho Moderation Geo
description: >
  IPWho geo moderation context. Intent CONTENT_MODERATION.

base_url: https://ipwho.is

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ipwho.is/
  website: https://ipwho.is

endpoints:
  - path: /query
    external_path: /{ip}
    method: GET
    description: Query for intent CONTENT_MODERATION via IPWho Moderation Geo.
    intents: [CONTENT_MODERATION]
    params:
      path:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "1.1.1.1"}

semantics:
  signal_mapping:
    label_field: country
  supported_intents:
    - CONTENT_MODERATION

on_chain:
  description: Stores signal for CONTENT_MODERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 120002
slug: fdet-cert
protocol: generic
name: CERT.PL Fraud Domains
description: >
  CERT.PL malicious domains fraud. Intent FRAUD_DETECTION.

base_url: https://hole.cert.pl

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://hole.cert.pl/
  website: https://hole.cert.pl

endpoints:
  - path: /query
    external_path: /domains/v2/domains.json
    method: GET
    description: Query for intent FRAUD_DETECTION via CERT.PL Fraud Domains.
    intents: [FRAUD_DETECTION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - FRAUD_DETECTION

on_chain:
  description: Stores signal for FRAUD_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


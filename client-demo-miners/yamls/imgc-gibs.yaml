version: "1"
kind: miner
id: 159010
slug: imgc-gibs
protocol: generic
name: GIBS Caption Capabilities
description: >
  NASA GIBS imagery caption capabilities. Intent IMAGE_CAPTIONING.

base_url: https://gibs.earthdata.nasa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://wiki.earthdata.nasa.gov/display/GIBS
  website: https://earthdata.nasa.gov

endpoints:
  - path: /query
    external_path: /wmts/epsg4326/best/wmts.cgi
    method: GET
    description: Query for intent IMAGE_CAPTIONING via GIBS Caption Capabilities.
    intents: [IMAGE_CAPTIONING]
    params:
      query:
        required:
          - name: SERVICE
            type: string
            intents: ["*"]
            description: Service
          - name: REQUEST
            type: string
            intents: ["*"]
            description: Request

input_schema:
  type: object
  required: [SERVICE, REQUEST]
  properties:
    SERVICE: {type: string, description: Service, default: "WMTS"}
    REQUEST: {type: string, description: Request, default: "GetCapabilities"}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - IMAGE_CAPTIONING

on_chain:
  description: Stores signal for IMAGE_CAPTIONING.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


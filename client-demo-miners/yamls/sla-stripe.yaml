version: "1"
kind: miner
id: 103007
slug: sla-stripe
protocol: generic
name: Stripe Status SLA
description: >
  Stripe current status SLA. Intent SLA_COMPLIANCE.

base_url: https://status.stripe.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://status.stripe.com/
  website: https://status.stripe.com

endpoints:
  - path: /query
    external_path: /current
    method: GET
    description: Query for intent SLA_COMPLIANCE via Stripe Status SLA.
    intents: [SLA_COMPLIANCE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: statuses
  supported_intents:
    - SLA_COMPLIANCE

on_chain:
  description: Stores signal for SLA_COMPLIANCE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


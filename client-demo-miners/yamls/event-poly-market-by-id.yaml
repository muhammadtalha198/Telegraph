version: "1"
kind: miner
id: 59011
slug: event-poly-market-by-id
protocol: generic
name: Polymarket Market By Id
description: >
  Polymarket gamma GET /markets/{id} for a settled/closed market.
  Intent EVENT_OUTCOME_RESOLUTION — pinned question is market id.

base_url: https://gamma-api.polymarket.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.polymarket.com/
  website: https://polymarket.com/

endpoints:
  - path: /query
    external_path: /markets/{id}
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION via Polymarket Market By Id.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      path:
        required:
          - name: id
            type: string
            intents: ["*"]
            description: Polymarket market id

input_schema:
  type: object
  required: [id]
  properties:
    id: {type: string, description: Market id, default: "12"}

semantics:
  signal_mapping:
    label_field: question
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores signal for EVENT_OUTCOME_RESOLUTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

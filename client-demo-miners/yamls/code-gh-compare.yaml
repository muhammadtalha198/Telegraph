version: "1"
kind: miner
id: 60003
slug: code-gh-compare
protocol: generic
name: GitHub Compare
description: >
  GitHub compare commits for review diff. Intent CODE_REVIEW.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/commits/commits
  website: https://github.com/

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/compare/{basehead}
    method: GET
    description: Query for intent CODE_REVIEW via GitHub Compare.
    intents: [CODE_REVIEW]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Repo owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo name
          - name: basehead
            type: string
            intents: ["*"]
            description: base...head

input_schema:
  type: object
  required: [owner, repo, basehead]
  properties:
    owner: {type: string, description: Repo owner, default: "facebook"}
    repo: {type: string, description: Repo name, default: "react"}
    basehead: {type: string, description: base...head, default: "v18.0.0...v18.2.0"}

semantics:
  signal_mapping:
    label_field: files
  supported_intents:
    - CODE_REVIEW

on_chain:
  description: Stores signal for CODE_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

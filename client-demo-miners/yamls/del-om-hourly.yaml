version: "1"
kind: miner
id: 96006
slug: del-om-hourly
protocol: generic
name: Open-Meteo Delivery Hourly
description: >
  Hourly forecast for delivery window planning. Intent DELIVERY_WINDOW_VERIFY.

base_url: https://api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/forecast
    method: GET
    description: Query for intent DELIVERY_WINDOW_VERIFY via Open-Meteo Delivery Hourly.
    intents: [DELIVERY_WINDOW_VERIFY]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Lat
          - name: longitude
            type: string
            intents: ["*"]
            description: Lon
          - name: hourly
            type: string
            intents: ["*"]
            description: Hourly
          - name: forecast_days
            type: string
            intents: ["*"]
            description: Days

input_schema:
  type: object
  required: [latitude, longitude, hourly, forecast_days]
  properties:
    latitude: {type: string, description: Lat, default: "40.71"}
    longitude: {type: string, description: Lon, default: "-74.00"}
    hourly: {type: string, description: Hourly, default: "precipitation_probability"}
    forecast_days: {type: string, description: Days, default: "1"}

semantics:
  signal_mapping:
    label_field: hourly
  supported_intents:
    - DELIVERY_WINDOW_VERIFY

on_chain:
  description: Stores signal for DELIVERY_WINDOW_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


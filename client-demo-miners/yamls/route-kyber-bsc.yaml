version: "1"
kind: miner
id: 61003
slug: route-kyber-bsc
protocol: generic
name: KyberSwap Route BSC
description: >
  KyberSwap aggregator route on BSC. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://aggregator-api.kyberswap.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.kyberswap.com/
  website: https://kyberswap.com/

endpoints:
  - path: /query
    external_path: /bsc/api/v1/routes
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via KyberSwap Route BSC.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      query:
        required:
          - name: tokenIn
            type: string
            intents: ["*"]
            description: Token in
          - name: tokenOut
            type: string
            intents: ["*"]
            description: Token out
          - name: amountIn
            type: string
            intents: ["*"]
            description: Amount in

input_schema:
  type: object
  required: [tokenIn, tokenOut, amountIn]
  properties:
    tokenIn: {type: string, description: Token in, default: "0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"}
    tokenOut: {type: string, description: Token out, default: "0x8ac76a51cc950d9822d68b83fe1ad97b32cd580d"}
    amountIn: {type: string, description: Amount in, default: "1000000000000000000"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

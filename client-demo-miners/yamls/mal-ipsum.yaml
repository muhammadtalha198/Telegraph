version: "1"
kind: miner
id: 94005
slug: mal-ipsum
protocol: generic
name: IPsum Level1
description: >
  IPsum aggregated malicious IP list level 1. Intent MALWARE_DETECTION.

base_url: https://raw.githubusercontent.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/stamparm/ipsum
  website: https://github.com/stamparm/ipsum

endpoints:
  - path: /query
    external_path: /stamparm/ipsum/master/levels/1.txt
    method: GET
    description: Query for intent MALWARE_DETECTION via IPsum Level1.
    intents: [MALWARE_DETECTION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - MALWARE_DETECTION

on_chain:
  description: Stores signal for MALWARE_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


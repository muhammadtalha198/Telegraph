version: "1"
kind: miner
id: 102009
slug: sre-rail
protocol: generic
name: Digitraffic Rail ETA
description: >
  Rail live trains for freight ETA. Intent SHIP_RATE_ETA.

base_url: https://rata.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/railway-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/v1/live-trains/station/{station}
    method: GET
    description: Query for intent SHIP_RATE_ETA via Digitraffic Rail ETA.
    intents: [SHIP_RATE_ETA]
    params:
      path:
        required:
          - name: station
            type: string
            intents: ["*"]
            description: Station
      query:
        required:
          - name: arriving_trains
            type: string
            intents: ["*"]
            description: Arriving
          - name: departing_trains
            type: string
            intents: ["*"]
            description: Departing

input_schema:
  type: object
  required: [station, arriving_trains, departing_trains]
  properties:
    station: {type: string, description: Station, default: "HKI"}
    arriving_trains: {type: string, description: Arriving, default: "5"}
    departing_trains: {type: string, description: Departing, default: "5"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - SHIP_RATE_ETA

on_chain:
  description: Stores signal for SHIP_RATE_ETA.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


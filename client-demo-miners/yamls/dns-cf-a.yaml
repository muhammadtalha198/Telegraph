version: "1"
kind: miner
id: 142006
slug: dns-cf-a
protocol: generic
name: DNS CF A
description: >
  Cloudflare DNS-over-HTTPS CF A. Intent DNS_RECORD_LOOKUP.

base_url: https://cloudflare-dns.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/
  website: https://1.1.1.1

endpoints:
  - path: /query
    external_path: /dns-query
    method: GET
    description: Query for intent DNS_RECORD_LOOKUP via DNS CF A.
    intents: [DNS_RECORD_LOOKUP]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: Name
          - name: type
            type: string
            intents: ["*"]
            description: Type

input_schema:
  type: object
  required: [name, type]
  properties:
    name: {type: string, description: Name, default: "cloudflare.com"}
    type: {type: string, description: Type, default: "A"}

semantics:
  signal_mapping:
    label_field: Answer
  supported_intents:
    - DNS_RECORD_LOOKUP

on_chain:
  description: Stores signal for DNS_RECORD_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


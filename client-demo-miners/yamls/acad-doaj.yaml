version: "1"
kind: miner
id: 48008
slug: acad-doaj
protocol: generic
name: DOAJ Article Search
description: >
  DOAJ open access article search. Intent ACADEMIC_SEARCH.

base_url: https://doaj.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://doaj.org/api/docs
  website: https://doaj.org/

endpoints:
  - path: /query
    external_path: /api/search/articles/{query}
    method: GET
    description: Query for intent ACADEMIC_SEARCH via DOAJ Article Search.
    intents: [ACADEMIC_SEARCH]
    params:
      path:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Search query
      query:
        required:
          - name: pageSize
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [query, pageSize]
  properties:
    query: {type: string, description: Query, default: "bitcoin"}
    pageSize: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - ACADEMIC_SEARCH

on_chain:
  description: Stores signal for ACADEMIC_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 79021
slug: threat-otx-ip
protocol: generic
name: OTX IP Abuse Score
description: >
  AlienVault OTX IP pulses → abuse_confidence (keyless peer of AbuseIPDB).
  Intent THREAT_INTELLIGENCE — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/otx-abuse
    method: GET
    description: Query for intent THREAT_INTELLIGENCE via OTX IP Abuse Score.
    intents: [THREAT_INTELLIGENCE]
    params:
      query:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP address

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: "IP address", default: "1.1.1.1"}

semantics:
  signal_mapping:
    label_field: abuse_confidence
  supported_intents:
    - THREAT_INTELLIGENCE

on_chain:
  description: Stores signal for THREAT_INTELLIGENCE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

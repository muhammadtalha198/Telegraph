version: "1"
kind: miner
id: 72010
slug: liq-paraswap-tokens
protocol: generic
name: ParaSwap Token List
description: >
  ParaSwap tradable tokens (liquidity venues). Intent LIQUIDITY_DEPTH_VERIFY.

base_url: https://apiv5.paraswap.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.paraswap.network/
  website: https://www.paraswap.io/

endpoints:
  - path: /query
    external_path: /tokens/{network}
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via ParaSwap Token List.
    intents: [LIQUIDITY_DEPTH_VERIFY]
    params:
      path:
        required:
          - name: network
            type: string
            intents: ["*"]
            description: Network

input_schema:
  type: object
  required: [network]
  properties:
    network: {type: string, description: Network, default: "1"}

semantics:
  signal_mapping:
    label_field: tokens
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

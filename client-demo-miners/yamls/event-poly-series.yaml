version: "1"
kind: miner
id: 59005
slug: event-poly-series
protocol: generic
name: Polymarket Series
description: >
  Polymarket series list. Intent EVENT_OUTCOME_RESOLUTION.

base_url: https://gamma-api.polymarket.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.polymarket.com/
  website: https://polymarket.com/

endpoints:
  - path: /query
    external_path: /series
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION via Polymarket Series.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      query:
        required:
          - name: limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [limit]
  properties:
    limit: {type: string, description: Limit, default: "5"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores signal for EVENT_OUTCOME_RESOLUTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 40007
slug: stock-yahoo-nvda
protocol: generic
name: Yahoo Finance NVDA
description: >
  Yahoo Finance chart quote for NVDA. Intent STOCK_PRICE.

base_url: https://query1.finance.yahoo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://finance.yahoo.com/
  website: https://finance.yahoo.com/

endpoints:
  - path: /query
    external_path: /v8/finance/chart/{symbol}
    method: GET
    description: Query for intent STOCK_PRICE via Yahoo Finance NVDA.
    intents: [STOCK_PRICE]
    params:
      path:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: Ticker symbol
      query:
        required:
          - name: interval
            type: string
            intents: ["*"]
            description: Candle interval
          - name: range
            type: string
            intents: ["*"]
            description: Chart range

input_schema:
  type: object
  required: [symbol, interval, range]
  properties:
    symbol: {type: string, description: Ticker, default: "NVDA"}
    interval: {type: string, description: Interval, default: "1d"}
    range: {type: string, description: Range, default: "1d"}

semantics:
  signal_mapping:
    label_field: chart
  supported_intents:
    - STOCK_PRICE

on_chain:
  description: Stores signal for STOCK_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 90008
slug: doc-ots-finney
protocol: generic
name: OTS Calendar Finney
description: >
  OpenTimestamps Finney calendar server status. Intent DOCUMENT_AUTHENTICITY.

base_url: https://finney.calendar.eternitywall.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://opentimestamps.org/
  website: https://opentimestamps.org

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent DOCUMENT_AUTHENTICITY via OTS Calendar Finney.
    intents: [DOCUMENT_AUTHENTICITY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: html
  supported_intents:
    - DOCUMENT_AUTHENTICITY

on_chain:
  description: Stores signal for DOCUMENT_AUTHENTICITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


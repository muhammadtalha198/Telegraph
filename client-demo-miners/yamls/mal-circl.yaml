version: "1"
kind: miner
id: 94008
slug: mal-circl
protocol: generic
name: CIRCL Last CVE
description: >
  CIRCL last CVE feed for malware context. Intent MALWARE_DETECTION.

base_url: https://cve.circl.lu

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.circl.lu/services/cve-search/
  website: https://cve.circl.lu

endpoints:
  - path: /query
    external_path: /api/last/{n}
    method: GET
    description: Query for intent MALWARE_DETECTION via CIRCL Last CVE.
    intents: [MALWARE_DETECTION]
    params:
      path:
        required:
          - name: n
            type: string
            intents: ["*"]
            description: Count

input_schema:
  type: object
  required: [n]
  properties:
    n: {type: string, description: Count, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - MALWARE_DETECTION

on_chain:
  description: Stores signal for MALWARE_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


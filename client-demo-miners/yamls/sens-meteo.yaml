version: "1"
kind: miner
id: 79007
slug: sens-meteo
protocol: generic
name: Open-Meteo Meteo Sensor
description: >
  Open-Meteo current weather sensors. Intent SENSOR_TELEMETRY_VERIFY.

base_url: https://api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/forecast
    method: GET
    description: Query for intent SENSOR_TELEMETRY_VERIFY via Open-Meteo Meteo Sensor.
    intents: [SENSOR_TELEMETRY_VERIFY]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Latitude
          - name: longitude
            type: string
            intents: ["*"]
            description: Longitude
          - name: current
            type: string
            intents: ["*"]
            description: Current vars

input_schema:
  type: object
  required: [latitude, longitude, current]
  properties:
    latitude: {type: string, description: Latitude, default: "52.52"}
    longitude: {type: string, description: Longitude, default: "13.41"}
    current: {type: string, description: Current vars, default: "temperature_2m,wind_speed_10m,relative_humidity_2m"}

semantics:
  signal_mapping:
    label_field: current
  supported_intents:
    - SENSOR_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for SENSOR_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


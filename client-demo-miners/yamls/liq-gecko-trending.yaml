version: "1"
kind: miner
id: 72004
slug: liq-gecko-trending
protocol: generic
name: GeckoTerminal Trending
description: >
  GeckoTerminal trending pools. Intent LIQUIDITY_DEPTH_VERIFY.

base_url: https://api.geckoterminal.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.geckoterminal.com/dex-api
  website: https://www.geckoterminal.com/

endpoints:
  - path: /query
    external_path: /api/v2/networks/trending_pools
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via GeckoTerminal Trending.
    intents: [LIQUIDITY_DEPTH_VERIFY]
    params:
      query:
        required:
          - name: page
            type: string
            intents: ["*"]
            description: Page

input_schema:
  type: object
  required: [page]
  properties:
    page: {type: string, description: Page, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

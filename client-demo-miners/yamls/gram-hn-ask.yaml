version: "1"
kind: miner
id: 144009
slug: gram-hn-ask
protocol: generic
name: HN Ask Grammar
description: >
  HN ask stories grammar baseline. Intent GRAMMAR_SPELL_CHECK.

base_url: https://hacker-news.firebaseio.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/HackerNews/API
  website: https://news.ycombinator.com

endpoints:
  - path: /query
    external_path: /v0/askstories.json
    method: GET
    description: Query for intent GRAMMAR_SPELL_CHECK via HN Ask Grammar.
    intents: [GRAMMAR_SPELL_CHECK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - GRAMMAR_SPELL_CHECK

on_chain:
  description: Stores signal for GRAMMAR_SPELL_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 97008
slug: fraud-urlhaus
protocol: generic
name: URLhaus Fraud URLs
description: >
  URLhaus recent malicious URLs. Intent FRAUD_RISK.

base_url: https://urlhaus.abuse.ch

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://urlhaus.abuse.ch/api/
  website: https://urlhaus.abuse.ch

endpoints:
  - path: /query
    external_path: /downloads/text_recent/
    method: GET
    description: Query for intent FRAUD_RISK via URLhaus Fraud URLs.
    intents: [FRAUD_RISK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - FRAUD_RISK

on_chain:
  description: Stores signal for FRAUD_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


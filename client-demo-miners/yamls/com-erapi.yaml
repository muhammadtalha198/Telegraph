version: "1"
kind: miner
id: 114006
slug: com-erapi
protocol: generic
name: ER-API Purchase FX
description: >
  Open ER-API FX purchase verify. Intent COMMERCE_PURCHASE_VERIFY.

base_url: https://open.er-api.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.exchangerate-api.com/docs/free
  website: https://www.exchangerate-api.com

endpoints:
  - path: /query
    external_path: /v6/latest/{base}
    method: GET
    description: Query for intent COMMERCE_PURCHASE_VERIFY via ER-API Purchase FX.
    intents: [COMMERCE_PURCHASE_VERIFY]
    params:
      path:
        required:
          - name: base
            type: string
            intents: ["*"]
            description: Base

input_schema:
  type: object
  required: [base]
  properties:
    base: {type: string, description: Base, default: "USD"}

semantics:
  signal_mapping:
    label_field: rates
  supported_intents:
    - COMMERCE_PURCHASE_VERIFY

on_chain:
  description: Stores signal for COMMERCE_PURCHASE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 86005
slug: port-digit-fitku
protocol: generic
name: Digitraffic Port Calls TKU
description: >
  Turku port calls congestion signal. Intent LIVE_PORT_CONGESTION.

base_url: https://meri.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/marine-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/port-call/v1/port-calls
    method: GET
    description: Query for intent LIVE_PORT_CONGESTION via Digitraffic Port Calls TKU.
    intents: [LIVE_PORT_CONGESTION]
    params:
      query:
        required:
          - name: locode
            type: string
            intents: ["*"]
            description: UN/LOCODE

input_schema:
  type: object
  required: [locode]
  properties:
    locode: {type: string, description: UN/LOCODE, default: "FITKU"}

semantics:
  signal_mapping:
    label_field: portCalls
  supported_intents:
    - LIVE_PORT_CONGESTION

on_chain:
  description: Stores signal for LIVE_PORT_CONGESTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


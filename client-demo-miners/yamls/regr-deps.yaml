version: "1"
kind: miner
id: 107010
slug: regr-deps
protocol: generic
name: deps.dev Regression
description: >
  deps.dev package version regression meta. Intent REGRESSION_VERIFY.

base_url: https://deps.dev

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.deps.dev/
  website: https://deps.dev

endpoints:
  - path: /query
    external_path: /_/s/npm/p/{pkg}/v/{ver}
    method: GET
    description: Query for intent REGRESSION_VERIFY via deps.dev Regression.
    intents: [REGRESSION_VERIFY]
    params:
      path:
        required:
          - name: pkg
            type: string
            intents: ["*"]
            description: Package
          - name: ver
            type: string
            intents: ["*"]
            description: Version

input_schema:
  type: object
  required: [pkg, ver]
  properties:
    pkg: {type: string, description: Package, default: "react"}
    ver: {type: string, description: Version, default: "18.2.0"}

semantics:
  signal_mapping:
    label_field: version
  supported_intents:
    - REGRESSION_VERIFY

on_chain:
  description: Stores signal for REGRESSION_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


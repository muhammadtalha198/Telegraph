version: "1"
kind: miner
id: 70008
slug: fin-oecd-cli
protocol: generic
name: OECD CLI USA
description: >
  OECD composite leading indicator USA. Intent FINANCIAL_DATA.

base_url: https://stats.oecd.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://data.oecd.org/
  website: https://www.oecd.org/

endpoints:
  - path: /query
    external_path: /SDMX-JSON/data/MEI_CLI/LOLITOAA.USA.M/all
    method: GET
    description: Query for intent FINANCIAL_DATA via OECD CLI USA.
    intents: [FINANCIAL_DATA]
    params:
      query:
        required:
          - name: startTime
            type: string
            intents: ["*"]
            description: Start

input_schema:
  type: object
  required: [startTime]
  properties:
    startTime: {type: string, description: Start, default: "2023"}

semantics:
  signal_mapping:
    label_field: meta
  supported_intents:
    - FINANCIAL_DATA

on_chain:
  description: Stores signal for FINANCIAL_DATA.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 56010
slug: email-cf-google-txt
protocol: generic
name: Cloudflare DoH Google TXT
description: >
  Cloudflare DNS-over-HTTPS TXT for google.com. Intent EMAIL_SECURITY.

base_url: https://cloudflare-dns.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/
  website: https://1.1.1.1/

endpoints:
  - path: /query
    external_path: /dns-query
    method: GET
    description: Query for intent EMAIL_SECURITY via Cloudflare DoH Google TXT.
    intents: [EMAIL_SECURITY]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: DNS name
          - name: type
            type: string
            intents: ["*"]
            description: Record type

input_schema:
  type: object
  required: [name, type]
  properties:
    name: {type: string, description: Name, default: "google.com"}
    type: {type: string, description: Type, default: "TXT"}

semantics:
  signal_mapping:
    label_field: Answer
  supported_intents:
    - EMAIL_SECURITY

on_chain:
  description: Stores signal for EMAIL_SECURITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

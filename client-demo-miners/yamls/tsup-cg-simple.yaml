version: "1"
kind: miner
id: 154004
slug: tsup-cg-simple
protocol: generic
name: CoinGecko Simple Supply
description: >
  CoinGecko simple price supply context. Intent TOKEN_TOTAL_SUPPLY_VERIFY.

base_url: https://api.coingecko.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.coingecko.com/en/api
  website: https://www.coingecko.com

endpoints:
  - path: /query
    external_path: /api/v3/simple/price
    method: GET
    description: Query for intent TOKEN_TOTAL_SUPPLY_VERIFY via CoinGecko Simple Supply.
    intents: [TOKEN_TOTAL_SUPPLY_VERIFY]
    params:
      query:
        required:
          - name: ids
            type: string
            intents: ["*"]
            description: Ids
          - name: vs_currencies
            type: string
            intents: ["*"]
            description: VS
          - name: include_market_cap
            type: string
            intents: ["*"]
            description: Mcap

input_schema:
  type: object
  required: [ids, vs_currencies, include_market_cap]
  properties:
    ids: {type: string, description: Ids, default: "bitcoin,ethereum"}
    vs_currencies: {type: string, description: VS, default: "usd"}
    include_market_cap: {type: string, description: Mcap, default: "true"}

semantics:
  signal_mapping:
    label_field: bitcoin
  supported_intents:
    - TOKEN_TOTAL_SUPPLY_VERIFY

on_chain:
  description: Stores signal for TOKEN_TOTAL_SUPPLY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 97003
slug: fraud-geojs
protocol: generic
name: GeoJS Fraud IP
description: >
  GeoJS IP risk enrichment. Intent FRAUD_RISK.

base_url: https://get.geojs.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.geojs.io/
  website: https://www.geojs.io

endpoints:
  - path: /query
    external_path: /v1/ip/geo/{ip}.json
    method: GET
    description: Query for intent FRAUD_RISK via GeoJS Fraud IP.
    intents: [FRAUD_RISK]
    params:
      path:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "1.1.1.1"}

semantics:
  signal_mapping:
    label_field: country
  supported_intents:
    - FRAUD_RISK

on_chain:
  description: Stores signal for FRAUD_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


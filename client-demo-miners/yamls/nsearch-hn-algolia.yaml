version: "1"
kind: miner
id: 43001
slug: nsearch-hn-algolia
protocol: generic
name: HN Algolia Search
description: >
  Search Hacker News via Algolia. Intent NEWS_SEARCH.

base_url: https://hn.algolia.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://hn.algolia.com/api
  website: https://hn.algolia.com/

endpoints:
  - path: /query
    external_path: /api/v1/search
    method: GET
    description: Query for intent NEWS_SEARCH via HN Algolia Search.
    intents: [NEWS_SEARCH]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Search query
          - name: tags
            type: string
            intents: ["*"]
            description: story tag

input_schema:
  type: object
  required: [query, tags]
  properties:
    query: {type: string, description: Query, default: "bitcoin"}
    tags: {type: string, description: Tags, default: "story"}

semantics:
  signal_mapping:
    label_field: hits
  supported_intents:
    - NEWS_SEARCH

on_chain:
  description: Stores signal for NEWS_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

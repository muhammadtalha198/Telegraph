version: "1"
kind: miner
id: 35003
slug: wxf-openmeteo-ens
protocol: generic
name: Open-Meteo Ensemble Forecast
description: >
  Ensemble forecast via Open-Meteo. Intent WEATHER_FORECAST.

base_url: https://ensemble-api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs/ensemble-api
  website: https://open-meteo.com/

endpoints:
  - path: /query
    external_path: /v1/ensemble
    method: GET
    description: Query for intent WEATHER_FORECAST via Open-Meteo Ensemble Forecast.
    intents: [WEATHER_FORECAST]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Latitude
          - name: longitude
            type: string
            intents: ["*"]
            description: Longitude
          - name: hourly
            type: string
            intents: ["*"]
            description: Hourly variables
          - name: models
            type: string
            intents: ["*"]
            description: Ensemble model

input_schema:
  type: object
  required: [latitude, longitude, hourly, models]
  properties:
    latitude: {type: string, description: Latitude, default: "25.7617"}
    longitude: {type: string, description: Longitude, default: "-80.1918"}
    hourly: {type: string, description: Hourly vars, default: "temperature_2m"}
    models: {type: string, description: Model, default: "icon_seamless"}

semantics:
  signal_mapping:
    label_field: hourly
  supported_intents:
    - WEATHER_FORECAST

on_chain:
  description: Stores signal for WEATHER_FORECAST.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

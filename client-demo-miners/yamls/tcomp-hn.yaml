version: "1"
kind: miner
id: 133010
slug: tcomp-hn
protocol: generic
name: HN Updates Complete
description: >
  HN updates task completion signal. Intent TASK_COMPLETION.

base_url: https://hacker-news.firebaseio.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/HackerNews/API
  website: https://news.ycombinator.com

endpoints:
  - path: /query
    external_path: /v0/updates.json
    method: GET
    description: Query for intent TASK_COMPLETION via HN Updates Complete.
    intents: [TASK_COMPLETION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: items
  supported_intents:
    - TASK_COMPLETION

on_chain:
  description: Stores signal for TASK_COMPLETION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


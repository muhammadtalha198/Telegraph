version: "1"
kind: miner
id: 85021
slug: val-beacon-eb
protocol: generic
name: Beacon Effective Balance
description: >
  ethereum-beacon-api.publicnode.com validator effective_balance_gwei.
  Intent VALIDATOR_PERFORMANCE_VERIFY — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/beacon-validator
    method: GET
    description: Query for intent VALIDATOR_PERFORMANCE_VERIFY via Beacon Effective Balance.
    intents: [VALIDATOR_PERFORMANCE_VERIFY]
    params:
      query:
        required:
          - name: index
            type: string
            intents: ["*"]
            description: Validator index
          - name: state_id
            type: string
            intents: ["*"]
            description: Beacon state id

input_schema:
  type: object
  required: [index, state_id]
  properties:
    index: {type: string, description: "Validator index", default: "1"}
    state_id: {type: string, description: "Beacon state id", default: "finalized"}

semantics:
  signal_mapping:
    label_field: effective_balance_gwei
  supported_intents:
    - VALIDATOR_PERFORMANCE_VERIFY

on_chain:
  description: Stores signal for VALIDATOR_PERFORMANCE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

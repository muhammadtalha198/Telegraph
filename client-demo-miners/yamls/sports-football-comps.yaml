version: "1"
kind: miner
id: 44007
slug: sports-football-comps
protocol: generic
name: Football-Data Competitions
description: >
  football-data competitions list. Intent SPORTS_SCORE.

base_url: https://api.football-data.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.football-data.org/documentation/api
  website: https://www.football-data.org/

endpoints:
  - path: /query
    external_path: /v4/competitions
    method: GET
    description: Query for intent SPORTS_SCORE via Football-Data Competitions.
    intents: [SPORTS_SCORE]


input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: competitions
  supported_intents:
    - SPORTS_SCORE

on_chain:
  description: Stores signal for SPORTS_SCORE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

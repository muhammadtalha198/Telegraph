version: "1"
kind: miner
id: 97005
slug: fraud-ip2loc
protocol: generic
name: IP2Location Fraud
description: >
  IP2Location.io fraud enrichment. Intent FRAUD_RISK.

base_url: https://api.ip2location.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.ip2location.io/
  website: https://www.ip2location.io

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent FRAUD_RISK via IP2Location Fraud.
    intents: [FRAUD_RISK]
    params:
      query:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "1.1.1.1"}

semantics:
  signal_mapping:
    label_field: country_name
  supported_intents:
    - FRAUD_RISK

on_chain:
  description: Stores signal for FRAUD_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


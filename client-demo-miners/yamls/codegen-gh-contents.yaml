version: "1"
kind: miner
id: 156004
slug: codegen-gh-contents
protocol: generic
name: GitHub Contents Code
description: >
  GitHub repo contents code source. Intent CODE_GENERATION.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest
  website: https://github.com

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/contents/{path}
    method: GET
    description: Query for intent CODE_GENERATION via GitHub Contents Code.
    intents: [CODE_GENERATION]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
          - name: path
            type: string
            intents: ["*"]
            description: Path

input_schema:
  type: object
  required: [owner, repo, path]
  properties:
    owner: {type: string, description: Owner, default: "vercel"}
    repo: {type: string, description: Repo, default: "next.js"}
    path: {type: string, description: Path, default: "package.json"}

semantics:
  signal_mapping:
    label_field: name
  supported_intents:
    - CODE_GENERATION

on_chain:
  description: Stores signal for CODE_GENERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 72009
slug: liq-dex-weth
protocol: generic
name: DexScreener WETH Token
description: >
  DexScreener WETH token pairs. Intent LIQUIDITY_DEPTH_VERIFY.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com/

endpoints:
  - path: /query
    external_path: /latest/dex/tokens/{tokenAddresses}
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via DexScreener WETH Token.
    intents: [LIQUIDITY_DEPTH_VERIFY]
    params:
      path:
        required:
          - name: tokenAddresses
            type: string
            intents: ["*"]
            description: Token

input_schema:
  type: object
  required: [tokenAddresses]
  properties:
    tokenAddresses: {type: string, description: Token, default: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"}

semantics:
  signal_mapping:
    label_field: pairs
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

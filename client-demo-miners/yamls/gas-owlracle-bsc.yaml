version: "1"
kind: miner
id: 41001
slug: gas-owlracle-bsc
protocol: generic
name: Owlracle BSC Gas
description: >
  Owlracle gas prices for BSC. Intent GAS_PRICE.

base_url: https://owlracle.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://owlracle.info/
  website: https://owlracle.info/

endpoints:
  - path: /query
    external_path: /bsc/gas
    method: GET
    description: Query for intent GAS_PRICE via Owlracle BSC Gas.
    intents: [GAS_PRICE]


input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: timestamp
  supported_intents:
    - GAS_PRICE

on_chain:
  description: Stores signal for GAS_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

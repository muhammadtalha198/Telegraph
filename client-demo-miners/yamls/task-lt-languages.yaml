version: "1"
kind: miner
id: 62001
slug: task-lt-languages
protocol: generic
name: LanguageTool Languages
description: >
  LanguageTool language catalog for quality checks. Intent TASK_EXECUTION_QUALITY.

base_url: https://api.languagetool.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://languagetool.org/http-api/
  website: https://languagetool.org/

endpoints:
  - path: /query
    external_path: /v2/languages
    method: GET
    description: Query for intent TASK_EXECUTION_QUALITY via LanguageTool Languages.
    intents: [TASK_EXECUTION_QUALITY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - TASK_EXECUTION_QUALITY

on_chain:
  description: Stores signal for TASK_EXECUTION_QUALITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 65004
slug: ticket-so-questions
protocol: generic
name: StackOverflow Questions
description: >
  SO recent questions as support tickets. Intent CUSTOMER_TICKET_RESOLUTION.

base_url: https://api.stackexchange.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.stackexchange.com/docs
  website: https://stackoverflow.com/

endpoints:
  - path: /query
    external_path: /2.3/questions
    method: GET
    description: Query for intent CUSTOMER_TICKET_RESOLUTION via StackOverflow Questions.
    intents: [CUSTOMER_TICKET_RESOLUTION]
    params:
      query:
        required:
          - name: order
            type: string
            intents: ["*"]
            description: Order
          - name: sort
            type: string
            intents: ["*"]
            description: Sort
          - name: site
            type: string
            intents: ["*"]
            description: Site
          - name: pagesize
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [order, sort, site, pagesize]
  properties:
    order: {type: string, description: Order, default: "desc"}
    sort: {type: string, description: Sort, default: "activity"}
    site: {type: string, description: Site, default: "stackoverflow"}
    pagesize: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: items
  supported_intents:
    - CUSTOMER_TICKET_RESOLUTION

on_chain:
  description: Stores signal for CUSTOMER_TICKET_RESOLUTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

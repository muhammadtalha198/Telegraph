version: "1"
kind: miner
id: 104007
slug: txr-certpl
protocol: generic
name: CERT.PL Tx Risk
description: >
  CERT.PL domains transaction risk. Intent TRANSACTION_RISK.

base_url: https://hole.cert.pl

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://hole.cert.pl/
  website: https://hole.cert.pl

endpoints:
  - path: /query
    external_path: /domains/v2/domains.json
    method: GET
    description: Query for intent TRANSACTION_RISK via CERT.PL Tx Risk.
    intents: [TRANSACTION_RISK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - TRANSACTION_RISK

on_chain:
  description: Stores signal for TRANSACTION_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


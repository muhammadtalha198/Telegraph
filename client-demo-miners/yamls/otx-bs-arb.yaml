version: "1"
kind: miner
id: 46004
slug: otx-bs-arb
protocol: generic
name: Blockscout Arbitrum Recent Txs
description: >
  Blockscout recent validated transactions on Arbitrum. Intent ONCHAIN_TX_LOOKUP.

base_url: https://arbitrum.blockscout.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://arbitrum.blockscout.com/api-docs
  website: https://arbitrum.blockscout.com/

endpoints:
  - path: /query
    external_path: /api/v2/transactions
    method: GET
    description: Query for intent ONCHAIN_TX_LOOKUP via Blockscout Arbitrum Recent Txs.
    intents: [ONCHAIN_TX_LOOKUP]
    params:
      query:
        required:
          - name: filter
            type: string
            intents: ["*"]
            description: Filter validated

input_schema:
  type: object
  required: [filter]
  properties:
    filter: {type: string, description: Filter, default: "validated"}

semantics:
  signal_mapping:
    label_field: items
  supported_intents:
    - ONCHAIN_TX_LOOKUP

on_chain:
  description: Stores signal for ONCHAIN_TX_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

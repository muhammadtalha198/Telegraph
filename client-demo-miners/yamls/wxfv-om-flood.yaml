version: "1"
kind: miner
id: 76006
slug: wxfv-om-flood
protocol: generic
name: Open-Meteo Flood Forecast Verify
description: >
  Flood discharge forecast for verify. Intent WEATHER_FORECAST_VERIFY.

base_url: https://flood-api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs/flood-api
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/flood
    method: GET
    description: Query for intent WEATHER_FORECAST_VERIFY via Open-Meteo Flood Forecast Verify.
    intents: [WEATHER_FORECAST_VERIFY]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Latitude
          - name: longitude
            type: string
            intents: ["*"]
            description: Longitude
          - name: daily
            type: string
            intents: ["*"]
            description: Daily vars
          - name: forecast_days
            type: string
            intents: ["*"]
            description: Days

input_schema:
  type: object
  required: [latitude, longitude, daily, forecast_days]
  properties:
    latitude: {type: string, description: Latitude, default: "25.76"}
    longitude: {type: string, description: Longitude, default: "-80.19"}
    daily: {type: string, description: Daily vars, default: "river_discharge"}
    forecast_days: {type: string, description: Days, default: "3"}

semantics:
  signal_mapping:
    label_field: daily
  supported_intents:
    - WEATHER_FORECAST_VERIFY

on_chain:
  description: Stores signal for WEATHER_FORECAST_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


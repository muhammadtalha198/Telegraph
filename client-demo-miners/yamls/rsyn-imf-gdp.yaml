version: "1"
kind: miner
id: 131005
slug: rsyn-imf-gdp
protocol: generic
name: IMF GDP Synthesis
description: >
  IMF GDP growth synthesis values. Intent RESEARCH_SYNTHESIS.

base_url: https://www.imf.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.imf.org/external/datamapper/api/help
  website: https://www.imf.org

endpoints:
  - path: /query
    external_path: /external/datamapper/api/v1/NGDP_RPCH
    method: GET
    description: Query for intent RESEARCH_SYNTHESIS via IMF GDP Synthesis.
    intents: [RESEARCH_SYNTHESIS]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: values
  supported_intents:
    - RESEARCH_SYNTHESIS

on_chain:
  description: Stores signal for RESEARCH_SYNTHESIS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


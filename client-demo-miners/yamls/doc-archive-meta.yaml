version: "1"
kind: miner
id: 90006
slug: doc-archive-meta
protocol: generic
name: Archive.org Metadata
description: >
  Internet Archive item metadata. Intent DOCUMENT_AUTHENTICITY.

base_url: https://archive.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://archive.org/services/docs/api/metadata.html
  website: https://archive.org

endpoints:
  - path: /query
    external_path: /metadata/{item}
    method: GET
    description: Query for intent DOCUMENT_AUTHENTICITY via Archive.org Metadata.
    intents: [DOCUMENT_AUTHENTICITY]
    params:
      path:
        required:
          - name: item
            type: string
            intents: ["*"]
            description: Item id

input_schema:
  type: object
  required: [item]
  properties:
    item: {type: string, description: Item id, default: "nasa"}

semantics:
  signal_mapping:
    label_field: metadata
  supported_intents:
    - DOCUMENT_AUTHENTICITY

on_chain:
  description: Stores signal for DOCUMENT_AUTHENTICITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


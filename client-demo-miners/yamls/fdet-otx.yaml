version: "1"
kind: miner
id: 120005
slug: fdet-otx
protocol: generic
name: OTX Fraud Domain
description: >
  OTX domain fraud indicator. Intent FRAUD_DETECTION.

base_url: https://otx.alienvault.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://otx.alienvault.com/api
  website: https://otx.alienvault.com

endpoints:
  - path: /query
    external_path: /api/v1/indicators/domain/{domain}/general
    method: GET
    description: Query for intent FRAUD_DETECTION via OTX Fraud Domain.
    intents: [FRAUD_DETECTION]
    params:
      path:
        required:
          - name: domain
            type: string
            intents: ["*"]
            description: Domain

input_schema:
  type: object
  required: [domain]
  properties:
    domain: {type: string, description: Domain, default: "example.com"}

semantics:
  signal_mapping:
    label_field: sections
  supported_intents:
    - FRAUD_DETECTION

on_chain:
  description: Stores signal for FRAUD_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 61008
slug: route-dexscreener-search
protocol: generic
name: DexScreener Search
description: >
  DexScreener pair search for venue discovery. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com/

endpoints:
  - path: /query
    external_path: /latest/dex/search
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via DexScreener Search.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Search query

input_schema:
  type: object
  required: [q]
  properties:
    q: {type: string, description: Search query, default: "ETH USDC"}

semantics:
  signal_mapping:
    label_field: pairs
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

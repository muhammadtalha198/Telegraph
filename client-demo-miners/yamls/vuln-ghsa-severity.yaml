version: "1"
kind: miner
id: 73009
slug: vuln-ghsa-severity
protocol: generic
name: GitHub Advisories Critical
description: >
  GitHub critical severity advisories. Intent VULNERABILITY_TRIAGE.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/security-advisories
  website: https://github.com/

endpoints:
  - path: /query
    external_path: /advisories
    method: GET
    description: Query for intent VULNERABILITY_TRIAGE via GitHub Advisories Critical.
    intents: [VULNERABILITY_TRIAGE]
    params:
      query:
        required:
          - name: severity
            type: string
            intents: ["*"]
            description: Severity
          - name: per_page
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [severity, per_page]
  properties:
    severity: {type: string, description: Severity, default: "critical"}
    per_page: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - VULNERABILITY_TRIAGE

on_chain:
  description: Stores signal for VULNERABILITY_TRIAGE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

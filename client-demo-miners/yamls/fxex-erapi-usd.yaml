version: "1"
kind: miner
id: 50004
slug: fxex-erapi-usd
protocol: generic
name: Open ER-API USD
description: >
  open.er-api.com latest USD rates. Intent CURRENCY_EXCHANGE.

base_url: https://open.er-api.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.exchangerate-api.com/docs/free
  website: https://www.exchangerate-api.com/

endpoints:
  - path: /query
    external_path: /v6/latest/{base}
    method: GET
    description: Query for intent CURRENCY_EXCHANGE via Open ER-API USD.
    intents: [CURRENCY_EXCHANGE]
    params:
      path:
        required:
          - name: base
            type: string
            intents: ["*"]
            description: Base currency

input_schema:
  type: object
  required: [base]
  properties:
    base: {type: string, description: Base, default: "USD"}

semantics:
  signal_mapping:
    label_field: rates
  supported_intents:
    - CURRENCY_EXCHANGE

on_chain:
  description: Stores signal for CURRENCY_EXCHANGE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 82006
slug: trav-nws-alert
protocol: generic
name: NWS Area Alerts Travel
description: >
  NWS active alerts affecting travel. Intent TRAVEL_DISRUPTION.

base_url: https://api.weather.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.weather.gov/documentation/services-web-api
  website: https://www.weather.gov

endpoints:
  - path: /query
    external_path: /alerts/active
    method: GET
    description: Query for intent TRAVEL_DISRUPTION via NWS Area Alerts Travel.
    intents: [TRAVEL_DISRUPTION]
    params:
      query:
        required:
          - name: area
            type: string
            intents: ["*"]
            description: State area

input_schema:
  type: object
  required: [area]
  properties:
    area: {type: string, description: State area, default: "FL"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - TRAVEL_DISRUPTION

on_chain:
  description: Stores signal for TRAVEL_DISRUPTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 107008
slug: regr-ghsa
protocol: generic
name: GH Advisories Regression
description: >
  GitHub advisories regression security. Intent REGRESSION_VERIFY.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/security-advisories
  website: https://github.com

endpoints:
  - path: /query
    external_path: /advisories
    method: GET
    description: Query for intent REGRESSION_VERIFY via GH Advisories Regression.
    intents: [REGRESSION_VERIFY]
    params:
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page

input_schema:
  type: object
  required: [per_page]
  properties:
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - REGRESSION_VERIFY

on_chain:
  description: Stores signal for REGRESSION_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


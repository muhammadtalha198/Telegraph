version: "1"
kind: miner
id: 80003
slug: wash-dex-pair
protocol: generic
name: DexScreener Pair
description: >
  DexScreener single pair metrics. Intent WASH_TRADING_DETECTION.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com

endpoints:
  - path: /query
    external_path: /latest/dex/pairs/{chain}/{pair}
    method: GET
    description: Query for intent WASH_TRADING_DETECTION via DexScreener Pair.
    intents: [WASH_TRADING_DETECTION]
    params:
      path:
        required:
          - name: chain
            type: string
            intents: ["*"]
            description: Chain
          - name: pair
            type: string
            intents: ["*"]
            description: Pair address

input_schema:
  type: object
  required: [chain, pair]
  properties:
    chain: {type: string, description: Chain, default: "ethereum"}
    pair: {type: string, description: Pair address, default: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"}

semantics:
  signal_mapping:
    label_field: pairs
  supported_intents:
    - WASH_TRADING_DETECTION

on_chain:
  description: Stores signal for WASH_TRADING_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


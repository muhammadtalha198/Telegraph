version: "1"
kind: miner
id: 61009
slug: route-gecko-pools
protocol: generic
name: GeckoTerminal ETH Pools
description: >
  GeckoTerminal Ethereum pools for venue liquidity. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://api.geckoterminal.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.geckoterminal.com/dex-api
  website: https://www.geckoterminal.com/

endpoints:
  - path: /query
    external_path: /api/v2/networks/eth/pools
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via GeckoTerminal ETH Pools.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      query:
        required:
          - name: page
            type: string
            intents: ["*"]
            description: Page

input_schema:
  type: object
  required: [page]
  properties:
    page: {type: string, description: Page, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

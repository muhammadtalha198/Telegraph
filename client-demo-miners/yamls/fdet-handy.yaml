version: "1"
kind: miner
id: 120010
slug: fdet-handy
protocol: generic
name: HandyAPI Fraud BIN
description: >
  HandyAPI BIN fraud metadata. Intent FRAUD_DETECTION.

base_url: https://data.handyapi.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://handyapi.com/
  website: https://handyapi.com

endpoints:
  - path: /query
    external_path: /bin/{bin}
    method: GET
    description: Query for intent FRAUD_DETECTION via HandyAPI Fraud BIN.
    intents: [FRAUD_DETECTION]
    params:
      path:
        required:
          - name: bin
            type: string
            intents: ["*"]
            description: BIN

input_schema:
  type: object
  required: [bin]
  properties:
    bin: {type: string, description: BIN, default: "45717360"}

semantics:
  signal_mapping:
    label_field: Scheme
  supported_intents:
    - FRAUD_DETECTION

on_chain:
  description: Stores signal for FRAUD_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


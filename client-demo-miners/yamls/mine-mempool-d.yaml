version: "1"
kind: miner
id: 93121
slug: mine-mempool-d
protocol: generic
name: Mempool Hashprice Peer D
description: >
  Hashprice from mempool block API.
  Intent MINING_HASHPRICE_VERIFY — scale peers for Usman ranking.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/btc-hashprice
    method: GET
    description: Query for intent MINING_HASHPRICE_VERIFY via Mempool Hashprice Peer D.
    intents: [MINING_HASHPRICE_VERIFY]
    params:
      query:
        required:
          - name: height
            type: string
            intents: ["*"]
            description: BTC block height
          - name: source
            type: string
            intents: ["*"]
            description: Block API source

input_schema:
  type: object
  required: [height, source]
  properties:
    height: {type: string, description: "BTC block height", default: "800000"}
    source: {type: string, description: "Block API source", default: "mempool"}

semantics:
  signal_mapping:
    label_field: hashprice_sats_per_ph_s_day
  supported_intents:
    - MINING_HASHPRICE_VERIFY

on_chain:
  description: Stores signal for MINING_HASHPRICE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

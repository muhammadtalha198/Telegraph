version: "1"
kind: miner
id: 29201
slug: commerce-stripe-charge
protocol: generic
name: Stripe Charge Purchase Verify
description: >
  Stripe Charges (test or live): amount_total, paid, purchase_ok for a pinned charge_id.
  Intent COMMERCE_PURCHASE_VERIFY. Requires STRIPE_SECRET_KEY on the truth proxy.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.stripe.com/api/charges/retrieve
  website: https://stripe.com/

endpoints:
  - path: /query
    external_path: /truth/commerce-stripe
    method: GET
    description: Query for intent COMMERCE_PURCHASE_VERIFY via Stripe Charges.
    intents: [COMMERCE_PURCHASE_VERIFY]
    params:
      query:
        required:
          - name: charge_id
            type: string
            intents: ["*"]
            description: Stripe charge id (ch_…)

input_schema:
  type: object
  required: [charge_id]
  properties:
    charge_id:
      type: string
      description: Stripe charge id
      default: "ch_REPLACE_WITH_TEST_CHARGE"

semantics:
  signal_mapping:
    label_field: purchase_ok
  supported_intents:
    - COMMERCE_PURCHASE_VERIFY

on_chain:
  description: Stores purchase_ok for COMMERCE_PURCHASE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

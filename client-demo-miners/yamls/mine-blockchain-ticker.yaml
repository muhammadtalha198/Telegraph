version: "1"
kind: miner
id: 67007
slug: mine-blockchain-ticker
protocol: generic
name: Blockchain.info Ticker
description: >
  Blockchain.info BTC price ticker. Intent MINING_HASHPRICE_VERIFY.

base_url: https://blockchain.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.blockchain.com/explorer/api
  website: https://www.blockchain.com/

endpoints:
  - path: /query
    external_path: /ticker
    method: GET
    description: Query for intent MINING_HASHPRICE_VERIFY via Blockchain.info Ticker.
    intents: [MINING_HASHPRICE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: USD
  supported_intents:
    - MINING_HASHPRICE_VERIFY

on_chain:
  description: Stores signal for MINING_HASHPRICE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 60008
slug: code-gitlab-mr
protocol: generic
name: GitLab Merge Requests
description: >
  GitLab merged MRs for review patterns. Intent CODE_REVIEW.

base_url: https://gitlab.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.gitlab.com/ee/api/merge_requests.html
  website: https://gitlab.com/

endpoints:
  - path: /query
    external_path: /api/v4/projects/{project}/merge_requests
    method: GET
    description: Query for intent CODE_REVIEW via GitLab Merge Requests.
    intents: [CODE_REVIEW]
    params:
      path:
        required:
          - name: project
            type: string
            intents: ["*"]
            description: URL-encoded project
      query:
        required:
          - name: state
            type: string
            intents: ["*"]
            description: MR state
          - name: per_page
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [project, state, per_page]
  properties:
    project: {type: string, description: URL-encoded project, default: "gitlab-org%2Fgitlab"}
    state: {type: string, description: MR state, default: "merged"}
    per_page: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CODE_REVIEW

on_chain:
  description: Stores signal for CODE_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

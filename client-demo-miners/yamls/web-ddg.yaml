version: "1"
kind: miner
id: 49004
slug: web-ddg
protocol: generic
name: DuckDuckGo Instant Answer
description: >
  DuckDuckGo instant answer API. Intent WEB_SEARCH.

base_url: https://api.duckduckgo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://duckduckgo.com/
  website: https://duckduckgo.com/

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent WEB_SEARCH via DuckDuckGo Instant Answer.
    intents: [WEB_SEARCH]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query
          - name: format
            type: string
            intents: ["*"]
            description: json
          - name: no_html
            type: string
            intents: ["*"]
            description: no_html
          - name: no_redirect
            type: string
            intents: ["*"]
            description: no_redirect

input_schema:
  type: object
  required: [q, format, no_html, no_redirect]
  properties:
    q: {type: string, description: Query, default: "bitcoin"}
    format: {type: string, description: Format, default: "json"}
    no_html: {type: string, description: no_html, default: "1"}
    no_redirect: {type: string, description: no_redirect, default: "1"}

semantics:
  signal_mapping:
    label_field: Heading
  supported_intents:
    - WEB_SEARCH

on_chain:
  description: Stores signal for WEB_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

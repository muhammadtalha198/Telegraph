version: "1"
kind: miner
id: 117002
slug: fare-metar-jfk
protocol: generic
name: METAR JFK Fare Delay
description: >
  METAR JFK affecting fare rules. Intent FARE_RULE_VERIFY.

base_url: https://aviationweather.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://aviationweather.gov/data/api/
  website: https://aviationweather.gov

endpoints:
  - path: /query
    external_path: /api/data/metar
    method: GET
    description: Query for intent FARE_RULE_VERIFY via METAR JFK Fare Delay.
    intents: [FARE_RULE_VERIFY]
    params:
      query:
        required:
          - name: ids
            type: string
            intents: ["*"]
            description: ICAO
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [ids, format]
  properties:
    ids: {type: string, description: ICAO, default: "KJFK"}
    format: {type: string, description: Format, default: "json"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - FARE_RULE_VERIFY

on_chain:
  description: Stores signal for FARE_RULE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 92009
slug: shelf-frank
protocol: generic
name: Frankfurter FX Shelf
description: >
  Frankfurter FX as shelf currency conversion. Intent LIVE_SHELF_PRICE.

base_url: https://api.frankfurter.app

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.frankfurter.app/docs/
  website: https://www.frankfurter.app

endpoints:
  - path: /query
    external_path: /latest
    method: GET
    description: Query for intent LIVE_SHELF_PRICE via Frankfurter FX Shelf.
    intents: [LIVE_SHELF_PRICE]
    params:
      query:
        required:
          - name: from
            type: string
            intents: ["*"]
            description: From
          - name: to
            type: string
            intents: ["*"]
            description: To

input_schema:
  type: object
  required: [from, to]
  properties:
    from: {type: string, description: From, default: "USD"}
    to: {type: string, description: To, default: "EUR"}

semantics:
  signal_mapping:
    label_field: rates
  supported_intents:
    - LIVE_SHELF_PRICE

on_chain:
  description: Stores signal for LIVE_SHELF_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


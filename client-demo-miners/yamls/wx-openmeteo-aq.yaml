version: "1"
kind: miner
id: 33007
slug: wx-openmeteo-aq
protocol: generic
name: Open-Meteo Air Quality
description: >
  Open-Meteo air quality (PM2.5 / AQI). Intent WEATHER_CHECK. Direct Request shows lat + lon.

base_url: https://air-quality-api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs/air-quality-api
  website: https://open-meteo.com/

endpoints:
  - path: /query
    external_path: /v1/air-quality
    method: GET
    description: Current weather for intent WEATHER_CHECK via Open-Meteo Air Quality.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Latitude
          - name: longitude
            type: string
            intents: ["*"]
            description: Longitude
          - name: current
            type: string
            intents: ["*"]
            description: Current variables

input_schema:
  type: object
  required: [latitude, longitude, current]
  properties:
    latitude:
      type: string
      description: Latitude
      default: "25.7617"
    longitude:
      type: string
      description: Longitude
      default: "-80.1918"
    current:
      type: string
      description: Current AQ fields
      default: "pm2_5,us_aqi"

semantics:
  signal_mapping:
    label_field: current
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores weather signal for WEATHER_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

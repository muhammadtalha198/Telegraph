version: "1"
kind: miner
id: 108008
slug: bot-hn-user
protocol: generic
name: HN User
description: >
  HN user profile bot/human signal. Intent SOCIAL_BOT_DETECTION.

base_url: https://hacker-news.firebaseio.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/HackerNews/API
  website: https://news.ycombinator.com

endpoints:
  - path: /query
    external_path: /v0/user/{user}.json
    method: GET
    description: Query for intent SOCIAL_BOT_DETECTION via HN User.
    intents: [SOCIAL_BOT_DETECTION]
    params:
      path:
        required:
          - name: user
            type: string
            intents: ["*"]
            description: User

input_schema:
  type: object
  required: [user]
  properties:
    user: {type: string, description: User, default: "pg"}

semantics:
  signal_mapping:
    label_field: karma
  supported_intents:
    - SOCIAL_BOT_DETECTION

on_chain:
  description: Stores signal for SOCIAL_BOT_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


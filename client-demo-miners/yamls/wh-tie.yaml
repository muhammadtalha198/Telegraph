version: "1"
kind: miner
id: 119008
slug: wh-tie
protocol: generic
name: Digitraffic Road Warehouse
description: >
  Road TMS warehouse ground logistics. Intent WAREHOUSE_INVENTORY.

base_url: https://tie.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/road-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/tms/v1/stations/data
    method: GET
    description: Query for intent WAREHOUSE_INVENTORY via Digitraffic Road Warehouse.
    intents: [WAREHOUSE_INVENTORY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: stations
  supported_intents:
    - WAREHOUSE_INVENTORY

on_chain:
  description: Stores signal for WAREHOUSE_INVENTORY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


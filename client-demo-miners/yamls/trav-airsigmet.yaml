version: "1"
kind: miner
id: 82005
slug: trav-airsigmet
protocol: generic
name: AviationWeather AIRSIGMET
description: >
  AviationWeather AIRMET/SIGMET disruptions. Intent TRAVEL_DISRUPTION.

base_url: https://aviationweather.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://aviationweather.gov/data/api/
  website: https://aviationweather.gov

endpoints:
  - path: /query
    external_path: /api/data/airsigmet
    method: GET
    description: Query for intent TRAVEL_DISRUPTION via AviationWeather AIRSIGMET.
    intents: [TRAVEL_DISRUPTION]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [format]
  properties:
    format: {type: string, description: Format, default: "json"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - TRAVEL_DISRUPTION

on_chain:
  description: Stores signal for TRAVEL_DISRUPTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


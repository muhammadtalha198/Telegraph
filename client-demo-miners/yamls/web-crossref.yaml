version: "1"
kind: miner
id: 49007
slug: web-crossref
protocol: generic
name: Crossref Works Web Search
description: >
  Crossref works search. Intent WEB_SEARCH.

base_url: https://api.crossref.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
  website: https://www.crossref.org/

endpoints:
  - path: /query
    external_path: /works
    method: GET
    description: Query for intent WEB_SEARCH via Crossref Works Web Search.
    intents: [WEB_SEARCH]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query
          - name: rows
            type: string
            intents: ["*"]
            description: Rows

input_schema:
  type: object
  required: [query, rows]
  properties:
    query: {type: string, description: Query, default: "blockchain"}
    rows: {type: string, description: Rows, default: "1"}

semantics:
  signal_mapping:
    label_field: message
  supported_intents:
    - WEB_SEARCH

on_chain:
  description: Stores signal for WEB_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

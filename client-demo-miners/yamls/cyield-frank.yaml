version: "1"
kind: miner
id: 141010
slug: cyield-frank
protocol: generic
name: Frankfurter Yield FX
description: >
  FX context for yield rates. Intent CRYPTO_YIELD_RATE.

base_url: https://api.frankfurter.app

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.frankfurter.app/docs/
  website: https://www.frankfurter.app

endpoints:
  - path: /query
    external_path: /latest
    method: GET
    description: Query for intent CRYPTO_YIELD_RATE via Frankfurter Yield FX.
    intents: [CRYPTO_YIELD_RATE]
    params:
      query:
        required:
          - name: from
            type: string
            intents: ["*"]
            description: From
          - name: to
            type: string
            intents: ["*"]
            description: To

input_schema:
  type: object
  required: [from, to]
  properties:
    from: {type: string, description: From, default: "USD"}
    to: {type: string, description: To, default: "EUR"}

semantics:
  signal_mapping:
    label_field: rates
  supported_intents:
    - CRYPTO_YIELD_RATE

on_chain:
  description: Stores signal for CRYPTO_YIELD_RATE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


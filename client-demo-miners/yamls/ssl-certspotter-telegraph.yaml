version: "1"
kind: miner
id: 45005
slug: ssl-certspotter-telegraph
protocol: generic
name: Cert Spotter telegraphprotocol.com
description: >
  Cert Spotter CT issuances for telegraphprotocol.com. Intent SSL_VERIFICATION.

base_url: https://api.certspotter.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://sslmate.com/certspotter/api/
  website: https://sslmate.com/certspotter/

endpoints:
  - path: /query
    external_path: /v1/issuances
    method: GET
    description: Query for intent SSL_VERIFICATION via Cert Spotter telegraphprotocol.com.
    intents: [SSL_VERIFICATION]
    params:
      query:
        required:
          - name: domain
            type: string
            intents: ["*"]
            description: Domain name
          - name: include_subdomains
            type: string
            intents: ["*"]
            description: include_subdomains
          - name: expand
            type: string
            intents: ["*"]
            description: expand fields

input_schema:
  type: object
  required: [domain, include_subdomains, expand]
  properties:
    domain: {type: string, description: Domain, default: "telegraphprotocol.com"}
    include_subdomains: {type: string, description: Subdomains, default: "false"}
    expand: {type: string, description: Expand, default: "dns_names"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - SSL_VERIFICATION

on_chain:
  description: Stores signal for SSL_VERIFICATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

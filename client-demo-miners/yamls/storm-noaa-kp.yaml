version: "1"
kind: miner
id: 37005
slug: storm-noaa-kp
protocol: generic
name: NOAA Planetary K-Index
description: >
  NOAA SWPC planetary K-index. Intent STORM_ALERT.

base_url: https://services.swpc.noaa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.swpc.noaa.gov/products
  website: https://www.swpc.noaa.gov/

endpoints:
  - path: /query
    external_path: /json/planetary_k_index_1m.json
    method: GET
    description: Query for intent STORM_ALERT via NOAA Planetary K-Index.
    intents: [STORM_ALERT]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - STORM_ALERT

on_chain:
  description: Stores signal for STORM_ALERT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

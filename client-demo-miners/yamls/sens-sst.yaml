version: "1"
kind: miner
id: 79010
slug: sens-sst
protocol: generic
name: NOAA SST Grid Sensor
description: >
  NOAA ERDDAP MUR SST gridpoint. Intent SENSOR_TELEMETRY_VERIFY.

base_url: https://coastwatch.pfeg.noaa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://coastwatch.pfeg.noaa.gov/erddap/index.html
  website: https://coastwatch.pfeg.noaa.gov

endpoints:
  - path: /query
    external_path: /erddap/griddap/jplMURSST41.json?analysed_sst[(last)][(25.7)][(-80.2)]
    method: GET
    description: Query for intent SENSOR_TELEMETRY_VERIFY via NOAA SST Grid Sensor.
    intents: [SENSOR_TELEMETRY_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: table
  supported_intents:
    - SENSOR_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for SENSOR_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


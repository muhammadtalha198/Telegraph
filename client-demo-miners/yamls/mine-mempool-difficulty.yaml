version: "1"
kind: miner
id: 67003
slug: mine-mempool-difficulty
protocol: generic
name: Mempool Difficulty Adj
description: >
  BTC difficulty adjustment progress. Intent MINING_HASHPRICE_VERIFY.

base_url: https://mempool.space

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://mempool.space/docs/api/rest
  website: https://mempool.space/

endpoints:
  - path: /query
    external_path: /api/v1/difficulty-adjustment
    method: GET
    description: Query for intent MINING_HASHPRICE_VERIFY via Mempool Difficulty Adj.
    intents: [MINING_HASHPRICE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: progressPercent
  supported_intents:
    - MINING_HASHPRICE_VERIFY

on_chain:
  description: Stores signal for MINING_HASHPRICE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

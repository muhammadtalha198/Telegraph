version: "1"
kind: miner
id: 97010
slug: fraud-openphish
protocol: generic
name: OpenPhish Fraud Feed
description: >
  OpenPhish phishing feed for fraud risk. Intent FRAUD_RISK.

base_url: https://openphish.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://openphish.com/
  website: https://openphish.com

endpoints:
  - path: /query
    external_path: /feed.txt
    method: GET
    description: Query for intent FRAUD_RISK via OpenPhish Fraud Feed.
    intents: [FRAUD_RISK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - FRAUD_RISK

on_chain:
  description: Stores signal for FRAUD_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


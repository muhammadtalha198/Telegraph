version: "1"
kind: miner
id: 58006
slug: flight-adsb-miami
protocol: generic
name: ADSB.lol Miami radius
description: >
  ADSB.lol Miami radius. Intent FLIGHT_AVAILABILITY.

base_url: https://api.adsb.lol

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.adsb.lol/
  website: https://api.adsb.lol/

endpoints:
  - path: /query
    external_path: /v2/lat/{lat}/lon/{lon}/dist/{dist}
    method: GET
    description: Query for intent FLIGHT_AVAILABILITY via ADSB.lol Miami radius.
    intents: [FLIGHT_AVAILABILITY]
    params:
      path:
        required:
          - name: lat
            type: string
            intents: ["*"]
            description: Latitude
          - name: lon
            type: string
            intents: ["*"]
            description: Longitude
          - name: dist
            type: string
            intents: ["*"]
            description: Distance NM

input_schema:
  type: object
  required: [lat, lon, dist]
  properties:
    lat: {type: string, description: Latitude, default: "25.76"}
    lon: {type: string, description: Longitude, default: "-80.19"}
    dist: {type: string, description: Distance NM, default: "50"}

semantics:
  signal_mapping:
    label_field: ac
  supported_intents:
    - FLIGHT_AVAILABILITY

on_chain:
  description: Stores signal for FLIGHT_AVAILABILITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 97007
slug: fraud-bin
protocol: generic
name: Binlist Payment Fraud
description: >
  BIN metadata for payment fraud signals. Intent FRAUD_RISK.

base_url: https://lookup.binlist.net

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://binlist.net/
  website: https://binlist.net

endpoints:
  - path: /query
    external_path: /45717360
    method: GET
    description: Query for intent FRAUD_RISK via Binlist Payment Fraud.
    intents: [FRAUD_RISK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: scheme
  supported_intents:
    - FRAUD_RISK

on_chain:
  description: Stores signal for FRAUD_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


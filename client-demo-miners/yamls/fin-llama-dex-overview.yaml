version: "1"
kind: miner
id: 70010
slug: fin-llama-dex-overview
protocol: generic
name: DefiLlama DEX Overview
description: >
  DefiLlama DEX volumes overview. Intent FINANCIAL_DATA.

base_url: https://api.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com/

endpoints:
  - path: /query
    external_path: /overview/dexs
    method: GET
    description: Query for intent FINANCIAL_DATA via DefiLlama DEX Overview.
    intents: [FINANCIAL_DATA]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: totalDataChart
  supported_intents:
    - FINANCIAL_DATA

on_chain:
  description: Stores signal for FINANCIAL_DATA.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

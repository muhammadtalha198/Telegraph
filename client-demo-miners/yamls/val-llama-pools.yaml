version: "1"
kind: miner
id: 85006
slug: val-llama-pools
protocol: generic
name: DefiLlama Yield Pools
description: >
  DefiLlama yield pools incl staking. Intent VALIDATOR_PERFORMANCE_VERIFY.

base_url: https://yields.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com

endpoints:
  - path: /query
    external_path: /pools
    method: GET
    description: Query for intent VALIDATOR_PERFORMANCE_VERIFY via DefiLlama Yield Pools.
    intents: [VALIDATOR_PERFORMANCE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - VALIDATOR_PERFORMANCE_VERIFY

on_chain:
  description: Stores signal for VALIDATOR_PERFORMANCE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 87001
slug: ven-os-default
protocol: generic
name: OpenSanctions Default Index
description: >
  OpenSanctions default dataset for vendor screening. Intent VENDOR_VERIFY.

base_url: https://data.opensanctions.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.opensanctions.org/docs/api/
  website: https://www.opensanctions.org

endpoints:
  - path: /query
    external_path: /datasets/latest/default/index.json
    method: GET
    description: Query for intent VENDOR_VERIFY via OpenSanctions Default Index.
    intents: [VENDOR_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: name
  supported_intents:
    - VENDOR_VERIFY

on_chain:
  description: Stores signal for VENDOR_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


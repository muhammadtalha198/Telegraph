version: "1"
kind: miner
id: 40010
slug: stock-alphavantage
protocol: generic
name: Alpha Vantage Global Quote
description: >
  Alpha Vantage GLOBAL_QUOTE (demo key). Intent STOCK_PRICE.

base_url: https://www.alphavantage.co

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.alphavantage.co/documentation/
  website: https://www.alphavantage.co/

endpoints:
  - path: /query
    external_path: /query
    method: GET
    description: Query for intent STOCK_PRICE via Alpha Vantage Global Quote.
    intents: [STOCK_PRICE]
    params:
      query:
        required:
          - name: function
            type: string
            intents: ["*"]
            description: API function
          - name: symbol
            type: string
            intents: ["*"]
            description: Ticker symbol
          - name: apikey
            type: string
            intents: ["*"]
            description: API key (demo)

input_schema:
  type: object
  required: [function, symbol, apikey]
  properties:
    function: {type: string, description: Function, default: "GLOBAL_QUOTE"}
    symbol: {type: string, description: Symbol, default: "IBM"}
    apikey: {type: string, description: API key, default: "demo"}

semantics:
  signal_mapping:
    label_field: Global Quote
  supported_intents:
    - STOCK_PRICE

on_chain:
  description: Stores signal for STOCK_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 77010
slug: secrev-deps
protocol: generic
name: deps.dev Package Review
description: >
  deps.dev package version metadata for review. Intent SECURITY_REVIEW.

base_url: https://deps.dev

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.deps.dev/
  website: https://deps.dev

endpoints:
  - path: /query
    external_path: /_/s/npm/p/{pkg}/v/{ver}
    method: GET
    description: Query for intent SECURITY_REVIEW via deps.dev Package Review.
    intents: [SECURITY_REVIEW]
    params:
      path:
        required:
          - name: pkg
            type: string
            intents: ["*"]
            description: Package
          - name: ver
            type: string
            intents: ["*"]
            description: Version

input_schema:
  type: object
  required: [pkg, ver]
  properties:
    pkg: {type: string, description: Package, default: "lodash"}
    ver: {type: string, description: Version, default: "4.17.21"}

semantics:
  signal_mapping:
    label_field: version
  supported_intents:
    - SECURITY_REVIEW

on_chain:
  description: Stores signal for SECURITY_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 124009
slug: cver-bbc
protocol: generic
name: BBC Verify Feed
description: >
  BBC news feed verification baseline. Intent CONTENT_VERIFICATION.

base_url: https://feeds.bbci.co.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.bbc.co.uk/news
  website: https://www.bbc.co.uk

endpoints:
  - path: /query
    external_path: /news/rss.xml
    method: GET
    description: Query for intent CONTENT_VERIFICATION via BBC Verify Feed.
    intents: [CONTENT_VERIFICATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: feed
  supported_intents:
    - CONTENT_VERIFICATION

on_chain:
  description: Stores signal for CONTENT_VERIFICATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


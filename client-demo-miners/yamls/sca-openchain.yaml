version: "1"
kind: miner
id: 151003
slug: sca-openchain
protocol: generic
name: OpenChain Sig Audit
description: >
  OpenChain signature database lookup. Intent SMART_CONTRACT_AUDIT.

base_url: https://api.openchain.xyz

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://openchain.xyz/signatures
  website: https://openchain.xyz

endpoints:
  - path: /query
    external_path: /signature-database/v1/lookup
    method: GET
    description: Query for intent SMART_CONTRACT_AUDIT via OpenChain Sig Audit.
    intents: [SMART_CONTRACT_AUDIT]
    params:
      query:
        required:
          - name: function
            type: string
            intents: ["*"]
            description: Function

input_schema:
  type: object
  required: [function]
  properties:
    function: {type: string, description: Function, default: "0xa9059cbb"}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - SMART_CONTRACT_AUDIT

on_chain:
  description: Stores signal for SMART_CONTRACT_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


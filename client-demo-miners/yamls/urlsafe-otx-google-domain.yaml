version: "1"
kind: miner
id: 52002
slug: urlsafe-otx-google-domain
protocol: generic
name: OTX google.com domain
description: >
  AlienVault OTX domain indicator. Intent URL_SAFE.

base_url: https://otx.alienvault.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://otx.alienvault.com/api
  website: https://otx.alienvault.com/

endpoints:
  - path: /query
    external_path: /api/v1/indicators/domain/{indicator}/general
    method: GET
    description: Query for intent URL_SAFE via OTX google.com domain.
    intents: [URL_SAFE]
    params:
      path:
        required:
          - name: indicator
            type: string
            intents: ["*"]
            description: Domain or hostname

input_schema:
  type: object
  required: [indicator]
  properties:
    indicator: {type: string, description: Indicator, default: "google.com"}

semantics:
  signal_mapping:
    label_field: indicator
  supported_intents:
    - URL_SAFE

on_chain:
  description: Stores signal for URL_SAFE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 164009
slug: chat-httpbin
protocol: generic
name: HTTPBin Chat Probe
description: >
  HTTPBin chat health probe. Intent CHAT_COMPLETION.

base_url: https://httpbin.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://httpbin.org/
  website: https://httpbin.org

endpoints:
  - path: /query
    external_path: /uuid
    method: GET
    description: Query for intent CHAT_COMPLETION via HTTPBin Chat Probe.
    intents: [CHAT_COMPLETION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: uuid
  supported_intents:
    - CHAT_COMPLETION

on_chain:
  description: Stores signal for CHAT_COMPLETION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


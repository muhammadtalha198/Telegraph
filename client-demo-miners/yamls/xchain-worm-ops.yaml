version: "1"
kind: miner
id: 89006
slug: xchain-worm-ops
protocol: generic
name: WormholeScan Operations
description: >
  WormholeScan recent cross-chain operations. Intent CROSS_CHAIN_STATE_VERIFY.

base_url: https://api.wormholescan.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://wormholescan.io/
  website: https://wormhole.com

endpoints:
  - path: /query
    external_path: /api/v1/operations
    method: GET
    description: Query for intent CROSS_CHAIN_STATE_VERIFY via WormholeScan Operations.
    intents: [CROSS_CHAIN_STATE_VERIFY]
    params:
      query:
        required:
          - name: page
            type: string
            intents: ["*"]
            description: Page
          - name: pageSize
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [page, pageSize]
  properties:
    page: {type: string, description: Page, default: "0"}
    pageSize: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: operations
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  description: Stores signal for CROSS_CHAIN_STATE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 130006
slug: rq-imf
protocol: generic
name: IMF Research Indicators
description: >
  IMF indicators research catalog. Intent RESEARCH_QUERY.

base_url: https://www.imf.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.imf.org/external/datamapper/api/help
  website: https://www.imf.org

endpoints:
  - path: /query
    external_path: /external/datamapper/api/v1/indicators
    method: GET
    description: Query for intent RESEARCH_QUERY via IMF Research Indicators.
    intents: [RESEARCH_QUERY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: indicators
  supported_intents:
    - RESEARCH_QUERY

on_chain:
  description: Stores signal for RESEARCH_QUERY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 90001
slug: doc-crossref
protocol: generic
name: Crossref DOI Work
description: >
  Crossref DOI metadata for document authenticity. Intent DOCUMENT_AUTHENTICITY.

base_url: https://api.crossref.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.crossref.org/documentation/retrieve-metadata/
  website: https://www.crossref.org

endpoints:
  - path: /query
    external_path: /works/{doi}
    method: GET
    description: Query for intent DOCUMENT_AUTHENTICITY via Crossref DOI Work.
    intents: [DOCUMENT_AUTHENTICITY]
    params:
      path:
        required:
          - name: doi
            type: string
            intents: ["*"]
            description: DOI

input_schema:
  type: object
  required: [doi]
  properties:
    doi: {type: string, description: DOI, default: "10.1038/nature12373"}

semantics:
  signal_mapping:
    label_field: message
  supported_intents:
    - DOCUMENT_AUTHENTICITY

on_chain:
  description: Stores signal for DOCUMENT_AUTHENTICITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


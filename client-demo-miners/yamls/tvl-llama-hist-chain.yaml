version: "1"
kind: miner
id: 38005
slug: tvl-llama-hist-chain
protocol: generic
name: DefiLlama Historical Chain TVL
description: >
  DefiLlama historical chain TVL. Intent TVL_LOOKUP.

base_url: https://api.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com/

endpoints:
  - path: /query
    external_path: /v2/historicalChainTvl/{chain}
    method: GET
    description: Query for intent TVL_LOOKUP via DefiLlama Historical Chain TVL.
    intents: [TVL_LOOKUP]
    params:
      path:
        required:
          - name: chain
            type: string
            intents: ["*"]
            description: Chain name

input_schema:
  type: object
  required: [chain]
  properties:
    chain: {type: string, description: Chain, default: "Ethereum"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - TVL_LOOKUP

on_chain:
  description: Stores signal for TVL_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

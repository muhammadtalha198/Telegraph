version: "1"
kind: miner
id: 150010
slug: up-cf-trace
protocol: generic
name: Cloudflare Trace Uptime
description: >
  Cloudflare edge trace uptime. Intent SERVER_UPTIME_MONITOR.

base_url: https://www.cloudflare.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.cloudflare.com/
  website: https://www.cloudflare.com

endpoints:
  - path: /query
    external_path: /cdn-cgi/trace
    method: GET
    description: Query for intent SERVER_UPTIME_MONITOR via Cloudflare Trace Uptime.
    intents: [SERVER_UPTIME_MONITOR]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - SERVER_UPTIME_MONITOR

on_chain:
  description: Stores signal for SERVER_UPTIME_MONITOR.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


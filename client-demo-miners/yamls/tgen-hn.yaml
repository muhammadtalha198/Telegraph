version: "1"
kind: miner
id: 155001
slug: tgen-hn
protocol: generic
name: HN Item Text Gen
description: >
  HN item text generation source. Intent TEXT_GENERATION.

base_url: https://hacker-news.firebaseio.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/HackerNews/API
  website: https://news.ycombinator.com

endpoints:
  - path: /query
    external_path: /v0/item/{id}.json
    method: GET
    description: Query for intent TEXT_GENERATION via HN Item Text Gen.
    intents: [TEXT_GENERATION]
    params:
      path:
        required:
          - name: id
            type: string
            intents: ["*"]
            description: ID

input_schema:
  type: object
  required: [id]
  properties:
    id: {type: string, description: ID, default: "8863"}

semantics:
  signal_mapping:
    label_field: title
  supported_intents:
    - TEXT_GENERATION

on_chain:
  description: Stores signal for TEXT_GENERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


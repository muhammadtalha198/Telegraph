version: "1"
kind: miner
id: 63006
slug: llm-doaj
protocol: generic
name: DOAJ LLM Eval
description: >
  DOAJ articles on generative eval. Intent LLM_OUTPUT_EVALUATION.

base_url: https://doaj.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://doaj.org/api/v4/docs
  website: https://doaj.org/

endpoints:
  - path: /query
    external_path: /api/search/articles/{query}
    method: GET
    description: Query for intent LLM_OUTPUT_EVALUATION via DOAJ LLM Eval.
    intents: [LLM_OUTPUT_EVALUATION]
    params:
      path:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query
      query:
        required:
          - name: pageSize
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [query, pageSize]
  properties:
    query: {type: string, description: Query, default: "large%20language%20model"}
    pageSize: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - LLM_OUTPUT_EVALUATION

on_chain:
  description: Stores signal for LLM_OUTPUT_EVALUATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

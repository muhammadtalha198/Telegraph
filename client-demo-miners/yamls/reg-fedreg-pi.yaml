version: "1"
kind: miner
id: 84004
slug: reg-fedreg-pi
protocol: generic
name: Federal Register Public Inspection
description: >
  US Federal Register public inspection docs. Intent REGULATORY_FILING_MONITOR.

base_url: https://www.federalregister.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.federalregister.gov/developers/documentation/api/v1
  website: https://www.federalregister.gov

endpoints:
  - path: /query
    external_path: /api/v1/public-inspection-documents.json
    method: GET
    description: Query for intent REGULATORY_FILING_MONITOR via Federal Register Public Inspection.
    intents: [REGULATORY_FILING_MONITOR]
    params:
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page

input_schema:
  type: object
  required: [per_page]
  properties:
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - REGULATORY_FILING_MONITOR

on_chain:
  description: Stores signal for REGULATORY_FILING_MONITOR.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


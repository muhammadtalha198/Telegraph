version: "1"
kind: miner
id: 41009
slug: gas-etherscan-v2
protocol: generic
name: Etherscan Gas Oracle v2
description: >
  Etherscan gas oracle via v2 API. Intent GAS_PRICE.

base_url: https://api.etherscan.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.etherscan.io/
  website: https://etherscan.io/

endpoints:
  - path: /query
    external_path: /v2/api
    method: GET
    description: Query for intent GAS_PRICE via Etherscan Gas Oracle v2.
    intents: [GAS_PRICE]
    params:
      query:
        required:
          - name: chainid
            type: string
            intents: ["*"]
            description: Chain id
          - name: module
            type: string
            intents: ["*"]
            description: Module gastracker
          - name: action
            type: string
            intents: ["*"]
            description: Action gasoracle

input_schema:
  type: object
  required: [chainid, module, action]
  properties:
    chainid: {type: string, description: Chain id, default: "1"}
    module: {type: string, description: Module, default: "gastracker"}
    action: {type: string, description: Action, default: "gasoracle"}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - GAS_PRICE

on_chain:
  description: Stores signal for GAS_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

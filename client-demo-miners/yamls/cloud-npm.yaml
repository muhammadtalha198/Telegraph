version: "1"
kind: miner
id: 139006
slug: cloud-npm
protocol: generic
name: NPM Registry Cloud
description: >
  NPM registry cloud package usage. Intent CLOUD_RESOURCE_USAGE.

base_url: https://registry.npmjs.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/npm/registry/blob/master/docs/REGISTRY-API.md
  website: https://www.npmjs.com

endpoints:
  - path: /query
    external_path: /{pkg}/latest
    method: GET
    description: Query for intent CLOUD_RESOURCE_USAGE via NPM Registry Cloud.
    intents: [CLOUD_RESOURCE_USAGE]
    params:
      path:
        required:
          - name: pkg
            type: string
            intents: ["*"]
            description: Package

input_schema:
  type: object
  required: [pkg]
  properties:
    pkg: {type: string, description: Package, default: "react"}

semantics:
  signal_mapping:
    label_field: version
  supported_intents:
    - CLOUD_RESOURCE_USAGE

on_chain:
  description: Stores signal for CLOUD_RESOURCE_USAGE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


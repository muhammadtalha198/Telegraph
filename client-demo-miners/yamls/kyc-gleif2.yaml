version: "1"
kind: miner
id: 165002
slug: kyc-gleif2
protocol: generic
name: GLEIF KYC Apple
description: >
  GLEIF Apple KYC identity. Intent KYC_BIOMETRIC_LIVENESS.

base_url: https://api.gleif.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.gleif.org/en/lei-data/gleif-api
  website: https://www.gleif.org

endpoints:
  - path: /query
    external_path: /api/v1/lei-records
    method: GET
    description: Query for intent KYC_BIOMETRIC_LIVENESS via GLEIF KYC Apple.
    intents: [KYC_BIOMETRIC_LIVENESS]
    params:
      query:
        required:
          - name: "filter[entity.legalName]"
            type: string
            intents: ["*"]
            description: Name
          - name: "page[size]"
            type: string
            intents: ["*"]
            description: Size

input_schema:
  type: object
  required: ["filter[entity.legalName]", "page[size]"]
  properties:
    "filter[entity.legalName]": {type: string, description: Name, default: "Apple"}
    "page[size]": {type: string, description: Size, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - KYC_BIOMETRIC_LIVENESS

on_chain:
  description: Stores signal for KYC_BIOMETRIC_LIVENESS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 132008
slug: atask-ip
protocol: generic
name: IPify Agent Task
description: >
  IPify public IP agent task. Intent AGENT_TASK.

base_url: https://api.ipify.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.ipify.org/
  website: https://www.ipify.org

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent AGENT_TASK via IPify Agent Task.
    intents: [AGENT_TASK]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [format]
  properties:
    format: {type: string, description: Format, default: "json"}

semantics:
  signal_mapping:
    label_field: ip
  supported_intents:
    - AGENT_TASK

on_chain:
  description: Stores signal for AGENT_TASK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


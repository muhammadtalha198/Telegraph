version: "1"
kind: miner
id: 89001
slug: xchain-lifi-chains
protocol: generic
name: LI.FI Supported Chains
description: >
  LI.FI supported chains for cross-chain state. Intent CROSS_CHAIN_STATE_VERIFY.

base_url: https://li.quest

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.li.fi/
  website: https://li.fi

endpoints:
  - path: /query
    external_path: /v1/chains
    method: GET
    description: Query for intent CROSS_CHAIN_STATE_VERIFY via LI.FI Supported Chains.
    intents: [CROSS_CHAIN_STATE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: chains
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  description: Stores signal for CROSS_CHAIN_STATE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 61006
slug: route-lifi-tools
protocol: generic
name: LI.FI Tools
description: >
  LI.FI bridges and exchangers catalog. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://li.quest

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.li.fi/
  website: https://li.fi/

endpoints:
  - path: /query
    external_path: /v1/tools
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via LI.FI Tools.
    intents: [OPTIMAL_EXECUTION_ROUTE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: bridges
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

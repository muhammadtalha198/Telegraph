version: "1"
kind: miner
id: 55008
slug: tr-mm-en-ar
protocol: generic
name: MyMemory EN→AR
description: >
  MyMemory translate EN→AR. Intent LANGUAGE_TRANSLATION.

base_url: https://api.mymemory.translated.net

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://mymemory.translated.net/doc/spec.php
  website: https://mymemory.translated.net/

endpoints:
  - path: /query
    external_path: /get
    method: GET
    description: Query for intent LANGUAGE_TRANSLATION via MyMemory EN→AR.
    intents: [LANGUAGE_TRANSLATION]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Text to translate
          - name: langpair
            type: string
            intents: ["*"]
            description: Source|Target languages

input_schema:
  type: object
  required: [q, langpair]
  properties:
    q: {type: string, description: Text, default: "Hello"}
    langpair: {type: string, description: Lang pair, default: "en|ar"}

semantics:
  signal_mapping:
    label_field: responseData
  supported_intents:
    - LANGUAGE_TRANSLATION

on_chain:
  description: Stores signal for LANGUAGE_TRANSLATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

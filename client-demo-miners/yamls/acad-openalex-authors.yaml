version: "1"
kind: miner
id: 48002
slug: acad-openalex-authors
protocol: generic
name: OpenAlex Authors Search
description: >
  OpenAlex authors search. Intent ACADEMIC_SEARCH.

base_url: https://api.openalex.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.openalex.org/
  website: https://openalex.org/

endpoints:
  - path: /query
    external_path: /authors
    method: GET
    description: Query for intent ACADEMIC_SEARCH via OpenAlex Authors Search.
    intents: [ACADEMIC_SEARCH]
    params:
      query:
        required:
          - name: search
            type: string
            intents: ["*"]
            description: Author search
          - name: per_page
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [search, per_page]
  properties:
    search: {type: string, description: Search, default: "einstein"}
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - ACADEMIC_SEARCH

on_chain:
  description: Stores signal for ACADEMIC_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

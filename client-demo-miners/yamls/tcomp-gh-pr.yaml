version: "1"
kind: miner
id: 133003
slug: tcomp-gh-pr
protocol: generic
name: GitHub PR Complete
description: >
  GitHub PR task completion. Intent TASK_COMPLETION.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest
  website: https://github.com

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/pulls
    method: GET
    description: Query for intent TASK_COMPLETION via GitHub PR Complete.
    intents: [TASK_COMPLETION]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page
          - name: state
            type: string
            intents: ["*"]
            description: State

input_schema:
  type: object
  required: [owner, repo, per_page, state]
  properties:
    owner: {type: string, description: Owner, default: "facebook"}
    repo: {type: string, description: Repo, default: "react"}
    per_page: {type: string, description: Per page, default: "1"}
    state: {type: string, description: State, default: "closed"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - TASK_COMPLETION

on_chain:
  description: Stores signal for TASK_COMPLETION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


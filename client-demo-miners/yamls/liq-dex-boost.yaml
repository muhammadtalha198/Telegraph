version: "1"
kind: miner
id: 72003
slug: liq-dex-boost
protocol: generic
name: DexScreener Token Boosts
description: >
  DexScreener top token boosts. Intent LIQUIDITY_DEPTH_VERIFY.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com/

endpoints:
  - path: /query
    external_path: /token-boosts/top/v1
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via DexScreener Token Boosts.
    intents: [LIQUIDITY_DEPTH_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

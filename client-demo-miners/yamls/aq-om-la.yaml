version: "1"
kind: miner
id: 137002
slug: aq-om-la
protocol: generic
name: Open-Meteo AQ LA
description: >
  Open-Meteo air quality LA. Intent AIR_QUALITY_INDEX.

base_url: https://air-quality-api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs/air-quality-api
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/air-quality
    method: GET
    description: Query for intent AIR_QUALITY_INDEX via Open-Meteo AQ LA.
    intents: [AIR_QUALITY_INDEX]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Lat
          - name: longitude
            type: string
            intents: ["*"]
            description: Lon
          - name: current
            type: string
            intents: ["*"]
            description: Current

input_schema:
  type: object
  required: [latitude, longitude, current]
  properties:
    latitude: {type: string, description: Lat, default: "34.05"}
    longitude: {type: string, description: Lon, default: "-118.25"}
    current: {type: string, description: Current, default: "pm2_5,us_aqi"}

semantics:
  signal_mapping:
    label_field: current
  supported_intents:
    - AIR_QUALITY_INDEX

on_chain:
  description: Stores signal for AIR_QUALITY_INDEX.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


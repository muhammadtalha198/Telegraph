version: "1"
kind: miner
id: 146003
slug: loan-imf
protocol: generic
name: IMF Rate Indicators
description: >
  IMF rate indicators catalog. Intent LOAN_INTEREST_RATE_QUOTE.

base_url: https://www.imf.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.imf.org/external/datamapper/api/help
  website: https://www.imf.org

endpoints:
  - path: /query
    external_path: /external/datamapper/api/v1/indicators
    method: GET
    description: Query for intent LOAN_INTEREST_RATE_QUOTE via IMF Rate Indicators.
    intents: [LOAN_INTEREST_RATE_QUOTE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: indicators
  supported_intents:
    - LOAN_INTEREST_RATE_QUOTE

on_chain:
  description: Stores signal for LOAN_INTEREST_RATE_QUOTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


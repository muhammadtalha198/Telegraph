version: "1"
kind: miner
id: 32001
slug: crypto-coingecko
protocol: generic
name: CoinGecko Crypto Price
description: >
  Live crypto spot via CoinGecko simple/price. Intent CRYPTO_PRICE. Direct Request shows ids + vs_currencies.

base_url: https://api.coingecko.com/api/v3

auth:
  type: none

rate_limit_per_sec: 2
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.coingecko.com/
  website: https://www.coingecko.com/

endpoints:
  - path: /query
    external_path: /simple/price
    method: GET
    description: Spot crypto price for intent CRYPTO_PRICE via CoinGecko Crypto Price.
    intents: [CRYPTO_PRICE]
    params:
      query:
        required:
          - name: ids
            type: string
            intents: ["*"]
            description: CoinGecko id (e.g. bitcoin, ethereum)
          - name: vs_currencies
            type: string
            intents: ["*"]
            description: Quote currency (e.g. usd)

input_schema:
  type: object
  required: [ids, vs_currencies]
  properties:
    ids:
      type: string
      description: CoinGecko asset id
      default: "bitcoin"
    vs_currencies:
      type: string
      description: Quote currency
      default: "usd"

semantics:
  signal_mapping:
    label_field: bitcoin
  supported_intents:
    - CRYPTO_PRICE

on_chain:
  description: Stores crypto spot signal for CRYPTO_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

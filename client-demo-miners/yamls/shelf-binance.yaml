version: "1"
kind: miner
id: 92007
slug: shelf-binance
protocol: generic
name: Binance BTCUSDT
description: >
  Binance spot ticker shelf price. Intent LIVE_SHELF_PRICE.

base_url: https://api.binance.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://binance-docs.github.io/apidocs/spot/en/
  website: https://www.binance.com

endpoints:
  - path: /query
    external_path: /api/v3/ticker/price
    method: GET
    description: Query for intent LIVE_SHELF_PRICE via Binance BTCUSDT.
    intents: [LIVE_SHELF_PRICE]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: Symbol

input_schema:
  type: object
  required: [symbol]
  properties:
    symbol: {type: string, description: Symbol, default: "BTCUSDT"}

semantics:
  signal_mapping:
    label_field: price
  supported_intents:
    - LIVE_SHELF_PRICE

on_chain:
  description: Stores signal for LIVE_SHELF_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


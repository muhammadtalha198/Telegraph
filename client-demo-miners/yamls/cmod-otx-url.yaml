version: "1"
kind: miner
id: 123004
slug: cmod-otx-url
protocol: generic
name: OTX Moderation URL
description: >
  OTX URL moderation indicator. Intent CONTENT_MODERATION.

base_url: https://otx.alienvault.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://otx.alienvault.com/api
  website: https://otx.alienvault.com

endpoints:
  - path: /query
    external_path: /api/v1/indicators/url/{url}/general
    method: GET
    description: Query for intent CONTENT_MODERATION via OTX Moderation URL.
    intents: [CONTENT_MODERATION]
    params:
      path:
        required:
          - name: url
            type: string
            intents: ["*"]
            description: URL

input_schema:
  type: object
  required: [url]
  properties:
    url: {type: string, description: URL, default: "http://example.com"}

semantics:
  signal_mapping:
    label_field: sections
  supported_intents:
    - CONTENT_MODERATION

on_chain:
  description: Stores signal for CONTENT_MODERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


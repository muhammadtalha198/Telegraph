version: "1"
kind: miner
id: 62006
slug: task-zenodo
protocol: generic
name: Zenodo Records
description: >
  Zenodo research records for quality benchmarks. Intent TASK_EXECUTION_QUALITY.

base_url: https://zenodo.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.zenodo.org/
  website: https://zenodo.org/

endpoints:
  - path: /query
    external_path: /api/records
    method: GET
    description: Query for intent TASK_EXECUTION_QUALITY via Zenodo Records.
    intents: [TASK_EXECUTION_QUALITY]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query
          - name: size
            type: string
            intents: ["*"]
            description: Size

input_schema:
  type: object
  required: [q, size]
  properties:
    q: {type: string, description: Query, default: "benchmark evaluation"}
    size: {type: string, description: Size, default: "1"}

semantics:
  signal_mapping:
    label_field: hits
  supported_intents:
    - TASK_EXECUTION_QUALITY

on_chain:
  description: Stores signal for TASK_EXECUTION_QUALITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 45007
slug: ssl-ssllabs-example
protocol: generic
name: SSL Labs Analyze example.com
description: >
  Qualys SSL Labs analyze cache for example.com. Intent SSL_VERIFICATION.

base_url: https://api.ssllabs.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/ssllabs/ssllabs-scan/blob/master/ssllabs-api-docs-v3.md
  website: https://www.ssllabs.com/

endpoints:
  - path: /query
    external_path: /api/v3/analyze
    method: GET
    description: Query for intent SSL_VERIFICATION via SSL Labs Analyze example.com.
    intents: [SSL_VERIFICATION]
    params:
      query:
        required:
          - name: host
            type: string
            intents: ["*"]
            description: Hostname
          - name: publish
            type: string
            intents: ["*"]
            description: publish off
          - name: fromCache
            type: string
            intents: ["*"]
            description: fromCache on
          - name: all
            type: string
            intents: ["*"]
            description: all done

input_schema:
  type: object
  required: [host, publish, fromCache, all]
  properties:
    host: {type: string, description: Host, default: "example.com"}
    publish: {type: string, description: Publish, default: "off"}
    fromCache: {type: string, description: fromCache, default: "on"}
    all: {type: string, description: all, default: "done"}

semantics:
  signal_mapping:
    label_field: host
  supported_intents:
    - SSL_VERIFICATION

on_chain:
  description: Stores signal for SSL_VERIFICATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

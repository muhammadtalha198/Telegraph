version: "1"
kind: miner
id: 161006
slug: stt-wayback
protocol: generic
name: Wayback Audio Page
description: >
  Wayback audio page STT proxy. Intent SPEECH_TO_TEXT.

base_url: https://archive.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://archive.org/help/wayback_api.php
  website: https://archive.org

endpoints:
  - path: /query
    external_path: /wayback/available
    method: GET
    description: Query for intent SPEECH_TO_TEXT via Wayback Audio Page.
    intents: [SPEECH_TO_TEXT]
    params:
      query:
        required:
          - name: url
            type: string
            intents: ["*"]
            description: URL

input_schema:
  type: object
  required: [url]
  properties:
    url: {type: string, description: URL, default: "archive.org"}

semantics:
  signal_mapping:
    label_field: archived_snapshots
  supported_intents:
    - SPEECH_TO_TEXT

on_chain:
  description: Stores signal for SPEECH_TO_TEXT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 76008
slug: wxfv-om-archive
protocol: generic
name: Open-Meteo Archive Verify
description: >
  Historical archive daily max for verify. Intent WEATHER_FORECAST_VERIFY.

base_url: https://archive-api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs/historical-weather-api
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/archive
    method: GET
    description: Query for intent WEATHER_FORECAST_VERIFY via Open-Meteo Archive Verify.
    intents: [WEATHER_FORECAST_VERIFY]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Latitude
          - name: longitude
            type: string
            intents: ["*"]
            description: Longitude
          - name: start_date
            type: string
            intents: ["*"]
            description: Start date
          - name: end_date
            type: string
            intents: ["*"]
            description: End date
          - name: daily
            type: string
            intents: ["*"]
            description: Daily vars

input_schema:
  type: object
  required: [latitude, longitude, start_date, end_date, daily]
  properties:
    latitude: {type: string, description: Latitude, default: "52.52"}
    longitude: {type: string, description: Longitude, default: "13.41"}
    start_date: {type: string, description: Start date, default: "2024-01-01"}
    end_date: {type: string, description: End date, default: "2024-01-02"}
    daily: {type: string, description: Daily vars, default: "temperature_2m_max"}

semantics:
  signal_mapping:
    label_field: daily
  supported_intents:
    - WEATHER_FORECAST_VERIFY

on_chain:
  description: Stores signal for WEATHER_FORECAST_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


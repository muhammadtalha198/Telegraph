version: "1"
kind: miner
id: 112009
slug: ret-clearbit
protocol: generic
name: Clearbit Merchant
description: >
  Clearbit merchant identity for policy context. Intent RETURN_POLICY_VERIFY.

base_url: https://autocomplete.clearbit.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://clearbit.com/
  website: https://clearbit.com

endpoints:
  - path: /query
    external_path: /v1/companies/suggest
    method: GET
    description: Query for intent RETURN_POLICY_VERIFY via Clearbit Merchant.
    intents: [RETURN_POLICY_VERIFY]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query

input_schema:
  type: object
  required: [query]
  properties:
    query: {type: string, description: Query, default: "amazon"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - RETURN_POLICY_VERIFY

on_chain:
  description: Stores signal for RETURN_POLICY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


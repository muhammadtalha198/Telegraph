version: "1"
kind: miner
id: 53001
slug: urlscan-example
protocol: generic
name: URLScan example.com
description: >
  urlscan.io search for example.com. Intent URL_SCAN.

base_url: https://urlscan.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://urlscan.io/docs/api/
  website: https://urlscan.io/

endpoints:
  - path: /query
    external_path: /api/v1/search/
    method: GET
    description: Query for intent URL_SCAN via URLScan example.com.
    intents: [URL_SCAN]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Search query
          - name: size
            type: string
            intents: ["*"]
            description: Result size

input_schema:
  type: object
  required: [q, size]
  properties:
    q: {type: string, description: Query, default: "domain:example.com"}
    size: {type: string, description: Size, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - URL_SCAN

on_chain:
  description: Stores signal for URL_SCAN.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

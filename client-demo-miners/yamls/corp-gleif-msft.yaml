version: "1"
kind: miner
id: 98008
slug: corp-gleif-msft
protocol: generic
name: GLEIF Microsoft LEI
description: >
  GLEIF LEI search Microsoft for corporate registry. Intent CORPORATE_REGISTRY_LOOKUP.

base_url: https://api.gleif.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.gleif.org/en/lei-data/gleif-api
  website: https://www.gleif.org

endpoints:
  - path: /query
    external_path: /api/v1/lei-records
    method: GET
    description: Query for intent CORPORATE_REGISTRY_LOOKUP via GLEIF Microsoft LEI.
    intents: [CORPORATE_REGISTRY_LOOKUP]
    params:
      query:
        required:
          - name: "filter[entity.legalName]"
            type: string
            intents: ["*"]
            description: Legal name
          - name: "page[size]"
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: ["filter[entity.legalName]", "page[size]"]
  properties:
    "filter[entity.legalName]": {type: string, description: Legal name, default: "Microsoft"}
    "page[size]": {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - CORPORATE_REGISTRY_LOOKUP

on_chain:
  description: Stores signal for CORPORATE_REGISTRY_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


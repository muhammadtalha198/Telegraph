version: "1"
kind: miner
id: 103008
slug: sla-httpbin
protocol: generic
name: HTTPBin Probe SLA
description: >
  HTTPBin 200 probe SLA check. Intent SLA_COMPLIANCE.

base_url: https://httpbin.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://httpbin.org/
  website: https://httpbin.org

endpoints:
  - path: /query
    external_path: /get
    method: GET
    description: Query for intent SLA_COMPLIANCE via HTTPBin Probe SLA.
    intents: [SLA_COMPLIANCE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: url
  supported_intents:
    - SLA_COMPLIANCE

on_chain:
  description: Stores signal for SLA_COMPLIANCE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


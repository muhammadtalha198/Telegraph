version: "1"
kind: miner
id: 72001
slug: liq-dex-pair
protocol: generic
name: DexScreener ETH Pair
description: >
  DexScreener Uniswap USDC/ETH pair depth. Intent LIQUIDITY_DEPTH_VERIFY.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com/

endpoints:
  - path: /query
    external_path: /latest/dex/pairs/{chainId}/{pairAddresses}
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via DexScreener ETH Pair.
    intents: [LIQUIDITY_DEPTH_VERIFY]
    params:
      path:
        required:
          - name: chainId
            type: string
            intents: ["*"]
            description: Chain
          - name: pairAddresses
            type: string
            intents: ["*"]
            description: Pair address

input_schema:
  type: object
  required: [chainId, pairAddresses]
  properties:
    chainId: {type: string, description: Chain, default: "ethereum"}
    pairAddresses: {type: string, description: Pair address, default: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"}

semantics:
  signal_mapping:
    label_field: pairs
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

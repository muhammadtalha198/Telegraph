version: "1"
kind: miner
id: 115008
slug: hotel-om
protocol: generic
name: Open-Meteo Hotel Weather
description: >
  Weather affecting hotel availability demand. Intent HOTEL_AVAILABILITY.

base_url: https://api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/forecast
    method: GET
    description: Query for intent HOTEL_AVAILABILITY via Open-Meteo Hotel Weather.
    intents: [HOTEL_AVAILABILITY]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Lat
          - name: longitude
            type: string
            intents: ["*"]
            description: Lon
          - name: daily
            type: string
            intents: ["*"]
            description: Daily
          - name: forecast_days
            type: string
            intents: ["*"]
            description: Days

input_schema:
  type: object
  required: [latitude, longitude, daily, forecast_days]
  properties:
    latitude: {type: string, description: Lat, default: "25.76"}
    longitude: {type: string, description: Lon, default: "-80.19"}
    daily: {type: string, description: Daily, default: "temperature_2m_max,precipitation_sum"}
    forecast_days: {type: string, description: Days, default: "3"}

semantics:
  signal_mapping:
    label_field: daily
  supported_intents:
    - HOTEL_AVAILABILITY

on_chain:
  description: Stores signal for HOTEL_AVAILABILITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


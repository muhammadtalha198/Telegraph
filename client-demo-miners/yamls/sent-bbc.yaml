version: "1"
kind: miner
id: 109005
slug: sent-bbc
protocol: generic
name: BBC News RSS Sentiment
description: >
  BBC news RSS sentiment headlines. Intent SENTIMENT_ANALYSIS.

base_url: https://feeds.bbci.co.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.bbc.co.uk/news
  website: https://www.bbc.co.uk

endpoints:
  - path: /query
    external_path: /news/rss.xml
    method: GET
    description: Query for intent SENTIMENT_ANALYSIS via BBC News RSS Sentiment.
    intents: [SENTIMENT_ANALYSIS]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: rss
  supported_intents:
    - SENTIMENT_ANALYSIS

on_chain:
  description: Stores signal for SENTIMENT_ANALYSIS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


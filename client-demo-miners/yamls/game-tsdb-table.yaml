version: "1"
kind: miner
id: 69004
slug: game-tsdb-table
protocol: generic
name: TheSportsDB League Table
description: >
  TheSportsDB league standings table. Intent GAME_RESULT.

base_url: https://www.thesportsdb.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.thesportsdb.com/api.php
  website: https://www.thesportsdb.com/

endpoints:
  - path: /query
    external_path: /api/v1/json/3/lookuptable.php
    method: GET
    description: Query for intent GAME_RESULT via TheSportsDB League Table.
    intents: [GAME_RESULT]
    params:
      query:
        required:
          - name: l
            type: string
            intents: ["*"]
            description: League id
          - name: s
            type: string
            intents: ["*"]
            description: Season

input_schema:
  type: object
  required: [l, s]
  properties:
    l: {type: string, description: League id, default: "4328"}
    s: {type: string, description: Season, default: "2023-2024"}

semantics:
  signal_mapping:
    label_field: table
  supported_intents:
    - GAME_RESULT

on_chain:
  description: Stores signal for GAME_RESULT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

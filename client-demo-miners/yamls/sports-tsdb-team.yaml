version: "1"
kind: miner
id: 44008
slug: sports-tsdb-team
protocol: generic
name: TheSportsDB Team Search
description: >
  TheSportsDB free team search. Intent SPORTS_SCORE.

base_url: https://www.thesportsdb.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.thesportsdb.com/api.php
  website: https://www.thesportsdb.com/

endpoints:
  - path: /query
    external_path: /api/v1/json/3/searchteams.php
    method: GET
    description: Query for intent SPORTS_SCORE via TheSportsDB Team Search.
    intents: [SPORTS_SCORE]
    params:
      query:
        required:
          - name: t
            type: string
            intents: ["*"]
            description: Team name

input_schema:
  type: object
  required: [t]
  properties:
    t: {type: string, description: Team, default: "Arsenal"}

semantics:
  signal_mapping:
    label_field: teams
  supported_intents:
    - SPORTS_SCORE

on_chain:
  description: Stores signal for SPORTS_SCORE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

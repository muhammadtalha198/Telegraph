version: "1"
kind: miner
id: 90002
slug: doc-doi-handle
protocol: generic
name: DOI Handle API
description: >
  DOI.org handle resolution metadata. Intent DOCUMENT_AUTHENTICITY.

base_url: https://doi.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.doi.org/the-identifier/resources/factsheets/doi-resolution-documentation
  website: https://www.doi.org

endpoints:
  - path: /query
    external_path: /api/handles/{doi}
    method: GET
    description: Query for intent DOCUMENT_AUTHENTICITY via DOI Handle API.
    intents: [DOCUMENT_AUTHENTICITY]
    params:
      path:
        required:
          - name: doi
            type: string
            intents: ["*"]
            description: DOI

input_schema:
  type: object
  required: [doi]
  properties:
    doi: {type: string, description: DOI, default: "10.1038/nature12373"}

semantics:
  signal_mapping:
    label_field: values
  supported_intents:
    - DOCUMENT_AUTHENTICITY

on_chain:
  description: Stores signal for DOCUMENT_AUTHENTICITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 66005
slug: grid-ci-scotland
protocol: generic
name: UK Regional Scotland
description: >
  UK regional carbon intensity Scotland. Intent GRID_POWER_PRICE.

base_url: https://api.carbonintensity.org.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://carbonintensity.org.uk/
  website: https://carbonintensity.org.uk/

endpoints:
  - path: /query
    external_path: /regional/{region}
    method: GET
    description: Query for intent GRID_POWER_PRICE via UK Regional Scotland.
    intents: [GRID_POWER_PRICE]
    params:
      path:
        required:
          - name: region
            type: string
            intents: ["*"]
            description: Region name

input_schema:
  type: object
  required: [region]
  properties:
    region: {type: string, description: Region name, default: "scotland"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - GRID_POWER_PRICE

on_chain:
  description: Stores signal for GRID_POWER_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

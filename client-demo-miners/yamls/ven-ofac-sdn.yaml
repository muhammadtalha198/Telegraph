version: "1"
kind: miner
id: 87006
slug: ven-ofac-sdn
protocol: generic
name: OFAC SDN XML
description: >
  US OFAC SDN list for vendor verify. Intent VENDOR_VERIFY.

base_url: https://www.treasury.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ofac.treasury.gov/
  website: https://ofac.treasury.gov

endpoints:
  - path: /query
    external_path: /ofac/downloads/sdn.xml
    method: GET
    description: Query for intent VENDOR_VERIFY via OFAC SDN XML.
    intents: [VENDOR_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: sdnList
  supported_intents:
    - VENDOR_VERIFY

on_chain:
  description: Stores signal for VENDOR_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


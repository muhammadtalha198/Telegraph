version: "1"
kind: miner
id: 64009
slug: contract-chicago-po
protocol: generic
name: Chicago Purchase Orders
description: >
  Chicago open data purchase orders / contracts. Intent CONTRACT_OBLIGATION_AUDIT.

base_url: https://data.cityofchicago.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://dev.socrata.com/
  website: https://data.cityofchicago.org/

endpoints:
  - path: /query
    external_path: /resource/rsxa-ify5.json
    method: GET
    description: Query for intent CONTRACT_OBLIGATION_AUDIT via Chicago Purchase Orders.
    intents: [CONTRACT_OBLIGATION_AUDIT]
    params:
      query:
        required:
          - name: $limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [$limit]
  properties:
    $limit: {type: string, description: Limit, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CONTRACT_OBLIGATION_AUDIT

on_chain:
  description: Stores signal for CONTRACT_OBLIGATION_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 98009
slug: corp-clearbit
protocol: generic
name: Clearbit Company Suggest
description: >
  Clearbit company identity registry suggest. Intent CORPORATE_REGISTRY_LOOKUP.

base_url: https://autocomplete.clearbit.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://clearbit.com/
  website: https://clearbit.com

endpoints:
  - path: /query
    external_path: /v1/companies/suggest
    method: GET
    description: Query for intent CORPORATE_REGISTRY_LOOKUP via Clearbit Company Suggest.
    intents: [CORPORATE_REGISTRY_LOOKUP]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query

input_schema:
  type: object
  required: [query]
  properties:
    query: {type: string, description: Query, default: "tesla"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CORPORATE_REGISTRY_LOOKUP

on_chain:
  description: Stores signal for CORPORATE_REGISTRY_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


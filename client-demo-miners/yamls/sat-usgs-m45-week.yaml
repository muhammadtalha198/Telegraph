version: "1"
kind: miner
id: 68009
slug: sat-usgs-m45-week
protocol: generic
name: USGS M45 Week
description: >
  USGS M4.5+ earthquakes past week. Intent SATELLITE_IMAGERY_ANALYSIS.

base_url: https://earthquake.usgs.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://earthquake.usgs.gov/
  website: https://earthquake.usgs.gov/

endpoints:
  - path: /query
    external_path: /earthquakes/feed/v1.0/summary/4.5_week.geojson
    method: GET
    description: Query for intent SATELLITE_IMAGERY_ANALYSIS via USGS M45 Week.
    intents: [SATELLITE_IMAGERY_ANALYSIS]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - SATELLITE_IMAGERY_ANALYSIS

on_chain:
  description: Stores signal for SATELLITE_IMAGERY_ANALYSIS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

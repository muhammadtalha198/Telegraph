version: "1"
kind: miner
id: 93006
slug: ves-adsb-sgp
protocol: generic
name: ADSB.lol Singapore
description: >
  adsb.lol traffic near Singapore port approaches. Intent VESSEL_TELEMETRY_VERIFY.

base_url: https://api.adsb.lol

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.adsb.lol/
  website: https://adsb.lol

endpoints:
  - path: /query
    external_path: /v2/lat/{lat}/lon/{lon}/dist/{dist}
    method: GET
    description: Query for intent VESSEL_TELEMETRY_VERIFY via ADSB.lol Singapore.
    intents: [VESSEL_TELEMETRY_VERIFY]
    params:
      path:
        required:
          - name: lat
            type: string
            intents: ["*"]
            description: Lat
          - name: lon
            type: string
            intents: ["*"]
            description: Lon
          - name: dist
            type: string
            intents: ["*"]
            description: Dist

input_schema:
  type: object
  required: [lat, lon, dist]
  properties:
    lat: {type: string, description: Lat, default: "1.26"}
    lon: {type: string, description: Lon, default: "103.85"}
    dist: {type: string, description: Dist, default: "50"}

semantics:
  signal_mapping:
    label_field: ac
  supported_intents:
    - VESSEL_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for VESSEL_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


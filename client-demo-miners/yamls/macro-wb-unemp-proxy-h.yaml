version: "1"
kind: miner
id: 93156
slug: macro-wb-unemp-proxy-h
protocol: generic
name: WB Unemp Proxy H
description: >
  World Bank ILO unemployment country=US.
  Intent MACRO_ECONOMIC_INDICATOR — scale peers for Usman ranking.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/macro-unemp
    method: GET
    description: Query for intent MACRO_ECONOMIC_INDICATOR via WB Unemp Proxy H.
    intents: [MACRO_ECONOMIC_INDICATOR]
    params:
      query:
        required:
          - name: country
            type: string
            intents: ["*"]
            description: Country ISO
          - name: date
            type: string
            intents: ["*"]
            description: Year or range

input_schema:
  type: object
  required: [country, date]
  properties:
    country: {type: string, description: "Country ISO", default: "US"}
    date: {type: string, description: "Year or range", default: "2019:2019"}

semantics:
  signal_mapping:
    label_field: rate_pct
  supported_intents:
    - MACRO_ECONOMIC_INDICATOR

on_chain:
  description: Stores signal for MACRO_ECONOMIC_INDICATOR.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

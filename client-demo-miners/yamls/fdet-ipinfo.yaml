version: "1"
kind: miner
id: 120009
slug: fdet-ipinfo
protocol: generic
name: IPinfo Fraud Geo
description: >
  IPinfo fraud geo signal. Intent FRAUD_DETECTION.

base_url: https://ipinfo.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ipinfo.io/developers
  website: https://ipinfo.io

endpoints:
  - path: /query
    external_path: /{ip}/json
    method: GET
    description: Query for intent FRAUD_DETECTION via IPinfo Fraud Geo.
    intents: [FRAUD_DETECTION]
    params:
      path:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "8.8.4.4"}

semantics:
  signal_mapping:
    label_field: country
  supported_intents:
    - FRAUD_DETECTION

on_chain:
  description: Stores signal for FRAUD_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


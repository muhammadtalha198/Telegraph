version: "1"
kind: miner
id: 104005
slug: txr-otx
protocol: generic
name: OTX Tx Risk IP
description: >
  OTX IP transaction risk indicator. Intent TRANSACTION_RISK.

base_url: https://otx.alienvault.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://otx.alienvault.com/api
  website: https://otx.alienvault.com

endpoints:
  - path: /query
    external_path: /api/v1/indicators/IPv4/{ip}/general
    method: GET
    description: Query for intent TRANSACTION_RISK via OTX Tx Risk IP.
    intents: [TRANSACTION_RISK]
    params:
      path:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "1.1.1.1"}

semantics:
  signal_mapping:
    label_field: sections
  supported_intents:
    - TRANSACTION_RISK

on_chain:
  description: Stores signal for TRANSACTION_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


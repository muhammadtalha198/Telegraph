version: "1"
kind: miner
id: 71008
slug: ocm-blockchain-stats
protocol: generic
name: Blockchain.info Metrics
description: >
  Blockchain.info network metrics. Intent ONCHAIN_METRIC_VERIFY.

base_url: https://blockchain.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.blockchain.com/explorer/api
  website: https://www.blockchain.com/

endpoints:
  - path: /query
    external_path: /stats
    method: GET
    description: Query for intent ONCHAIN_METRIC_VERIFY via Blockchain.info Metrics.
    intents: [ONCHAIN_METRIC_VERIFY]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [format]
  properties:
    format: {type: string, description: Format, default: "json"}

semantics:
  signal_mapping:
    label_field: n_tx
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

on_chain:
  description: Stores signal for ONCHAIN_METRIC_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

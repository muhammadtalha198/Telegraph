version: "1"
kind: miner
id: 105009
slug: dc-aqicn
protocol: generic
name: WAQI DC Air
description: >
  WAQI demo air telemetry near DCs. Intent DATACENTER_TELEMETRY_VERIFY.

base_url: https://api.waqi.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://aqicn.org/api/
  website: https://aqicn.org

endpoints:
  - path: /query
    external_path: /feed/{city}/
    method: GET
    description: Query for intent DATACENTER_TELEMETRY_VERIFY via WAQI DC Air.
    intents: [DATACENTER_TELEMETRY_VERIFY]
    params:
      path:
        required:
          - name: city
            type: string
            intents: ["*"]
            description: City
      query:
        required:
          - name: token
            type: string
            intents: ["*"]
            description: Token

input_schema:
  type: object
  required: [city, token]
  properties:
    city: {type: string, description: City, default: "beijing"}
    token: {type: string, description: Token, default: "demo"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - DATACENTER_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for DATACENTER_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


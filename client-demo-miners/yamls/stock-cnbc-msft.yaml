version: "1"
kind: miner
id: 40009
slug: stock-cnbc-msft
protocol: generic
name: CNBC Quote MSFT
description: >
  CNBC quick quote for MSFT. Intent STOCK_PRICE.

base_url: https://quote.cnbc.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.cnbc.com/
  website: https://www.cnbc.com/

endpoints:
  - path: /query
    external_path: /quote-html-webservice/quote.htm
    method: GET
    description: Query for intent STOCK_PRICE via CNBC Quote MSFT.
    intents: [STOCK_PRICE]
    params:
      query:
        required:
          - name: symbols
            type: string
            intents: ["*"]
            description: Ticker symbols
          - name: requestMethod
            type: string
            intents: ["*"]
            description: Request method
          - name: noform
            type: string
            intents: ["*"]
            description: noform flag
          - name: output
            type: string
            intents: ["*"]
            description: Output format json

input_schema:
  type: object
  required: [symbols, requestMethod, noform, output]
  properties:
    symbols: {type: string, description: Symbols, default: "MSFT"}
    requestMethod: {type: string, description: Method, default: "quick"}
    noform: {type: string, description: noform, default: "1"}
    output: {type: string, description: Output, default: "json"}

semantics:
  signal_mapping:
    label_field: QuickQuoteResult
  supported_intents:
    - STOCK_PRICE

on_chain:
  description: Stores signal for STOCK_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

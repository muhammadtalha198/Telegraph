version: "1"
kind: miner
id: 67008
slug: mine-blockchair-stats
protocol: generic
name: Blockchair BTC Stats
description: >
  Blockchair Bitcoin chain stats. Intent MINING_HASHPRICE_VERIFY.

base_url: https://api.blockchair.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://blockchair.com/api
  website: https://blockchair.com/

endpoints:
  - path: /query
    external_path: /bitcoin/stats
    method: GET
    description: Query for intent MINING_HASHPRICE_VERIFY via Blockchair BTC Stats.
    intents: [MINING_HASHPRICE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - MINING_HASHPRICE_VERIFY

on_chain:
  description: Stores signal for MINING_HASHPRICE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

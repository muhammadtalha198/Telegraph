version: "1"
kind: miner
id: 147002
slug: psa-dns-mx
protocol: generic
name: DNS MX Exposure Audit
description: >
  DNS MX exposure audit (passive). Intent PORT_SCAN_AUDIT.

base_url: https://dns.google

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.google.com/speed/public-dns/docs/doh
  website: https://dns.google

endpoints:
  - path: /query
    external_path: /resolve
    method: GET
    description: Query for intent PORT_SCAN_AUDIT via DNS MX Exposure Audit.
    intents: [PORT_SCAN_AUDIT]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: Name
          - name: type
            type: string
            intents: ["*"]
            description: Type

input_schema:
  type: object
  required: [name, type]
  properties:
    name: {type: string, description: Name, default: "gmail.com"}
    type: {type: string, description: Type, default: "MX"}

semantics:
  signal_mapping:
    label_field: Answer
  supported_intents:
    - PORT_SCAN_AUDIT

on_chain:
  description: Stores signal for PORT_SCAN_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 33005
slug: wx-brightsky
protocol: generic
name: Bright Sky Weather Check
description: >
  Bright Sky (DWD) current weather. Intent WEATHER_CHECK. Best coverage in Europe; defaults Berlin.

base_url: https://api.brightsky.dev

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://brightsky.dev/
  website: https://brightsky.dev/

endpoints:
  - path: /query
    external_path: /current_weather
    method: GET
    description: Current weather for intent WEATHER_CHECK via Bright Sky Weather Check.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: lat
            type: string
            intents: ["*"]
            description: Latitude
          - name: lon
            type: string
            intents: ["*"]
            description: Longitude

input_schema:
  type: object
  required: [lat, lon]
  properties:
    lat:
      type: string
      description: Latitude
      default: "52.52"
    lon:
      type: string
      description: Longitude
      default: "13.40"

semantics:
  signal_mapping:
    label_field: weather
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores weather signal for WEATHER_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 33004
slug: wx-7timer
protocol: generic
name: 7Timer Weather Check
description: >
  7Timer civil weather product. Intent WEATHER_CHECK. Direct Request shows lat + lon.

base_url: https://www.7timer.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: http://www.7timer.info/doc.php
  website: https://www.7timer.info/

endpoints:
  - path: /query
    external_path: /bin/api.pl
    method: GET
    description: Current weather for intent WEATHER_CHECK via 7Timer Weather Check.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: lat
            type: string
            intents: ["*"]
            description: Latitude
          - name: lon
            type: string
            intents: ["*"]
            description: Longitude
          - name: product
            type: string
            intents: ["*"]
            description: Product (civil)
          - name: output
            type: string
            intents: ["*"]
            description: Output format (json)

input_schema:
  type: object
  required: [lat, lon, product, output]
  properties:
    lat:
      type: string
      description: Latitude
      default: "25.7617"
    lon:
      type: string
      description: Longitude
      default: "-80.1918"
    product:
      type: string
      description: 7Timer product
      default: "civil"
    output:
      type: string
      description: Output type
      default: "json"

semantics:
  signal_mapping:
    label_field: dataseries
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores weather signal for WEATHER_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

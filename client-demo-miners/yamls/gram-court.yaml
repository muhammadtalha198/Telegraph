version: "1"
kind: miner
id: 144008
slug: gram-court
protocol: generic
name: CourtListener Grammar
description: >
  CourtListener language cases. Intent GRAMMAR_SPELL_CHECK.

base_url: https://www.courtlistener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.courtlistener.com/api/
  website: https://www.courtlistener.com

endpoints:
  - path: /query
    external_path: /api/rest/v4/search/
    method: GET
    description: Query for intent GRAMMAR_SPELL_CHECK via CourtListener Grammar.
    intents: [GRAMMAR_SPELL_CHECK]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query
          - name: type
            type: string
            intents: ["*"]
            description: Type
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [q, type, format]
  properties:
    q: {type: string, description: Query, default: "grammar"}
    type: {type: string, description: Type, default: "o"}
    format: {type: string, description: Format, default: "json"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - GRAMMAR_SPELL_CHECK

on_chain:
  description: Stores signal for GRAMMAR_SPELL_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


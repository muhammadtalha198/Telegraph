version: "1"
kind: miner
id: 133008
slug: tcomp-discord
protocol: generic
name: Discord Status Complete
description: >
  Discord status task completion. Intent TASK_COMPLETION.

base_url: https://discordstatus.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://discordstatus.com/
  website: https://discordstatus.com

endpoints:
  - path: /query
    external_path: /api/v2/status.json
    method: GET
    description: Query for intent TASK_COMPLETION via Discord Status Complete.
    intents: [TASK_COMPLETION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - TASK_COMPLETION

on_chain:
  description: Stores signal for TASK_COMPLETION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


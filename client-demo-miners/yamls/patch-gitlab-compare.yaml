version: "1"
kind: miner
id: 74007
slug: patch-gitlab-compare
protocol: generic
name: GitLab Compare
description: >
  GitLab repository compare. Intent CODE_PATCH_VERIFY.

base_url: https://gitlab.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.gitlab.com/ee/api/repositories.html
  website: https://gitlab.com/

endpoints:
  - path: /query
    external_path: /api/v4/projects/{project}/repository/compare
    method: GET
    description: Query for intent CODE_PATCH_VERIFY via GitLab Compare.
    intents: [CODE_PATCH_VERIFY]
    params:
      path:
        required:
          - name: project
            type: string
            intents: ["*"]
            description: Project
      query:
        required:
          - name: from
            type: string
            intents: ["*"]
            description: From
          - name: to
            type: string
            intents: ["*"]
            description: To

input_schema:
  type: object
  required: [project, from, to]
  properties:
    project: {type: string, description: Project, default: "gitlab-org%2Fgitlab"}
    from: {type: string, description: From, default: "master"}
    to: {type: string, description: To, default: "master"}

semantics:
  signal_mapping:
    label_field: commits
  supported_intents:
    - CODE_PATCH_VERIFY

on_chain:
  description: Stores signal for CODE_PATCH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

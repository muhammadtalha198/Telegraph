version: "1"
kind: miner
id: 112004
slug: ret-archive
protocol: generic
name: Archive Policy Meta
description: >
  Archive.org metadata for policy docs. Intent RETURN_POLICY_VERIFY.

base_url: https://archive.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://archive.org/services/docs/api/metadata.html
  website: https://archive.org

endpoints:
  - path: /query
    external_path: /metadata/{item}
    method: GET
    description: Query for intent RETURN_POLICY_VERIFY via Archive Policy Meta.
    intents: [RETURN_POLICY_VERIFY]
    params:
      path:
        required:
          - name: item
            type: string
            intents: ["*"]
            description: Item

input_schema:
  type: object
  required: [item]
  properties:
    item: {type: string, description: Item, default: "nasa"}

semantics:
  signal_mapping:
    label_field: metadata
  supported_intents:
    - RETURN_POLICY_VERIFY

on_chain:
  description: Stores signal for RETURN_POLICY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 61007
slug: route-lifi-connections
protocol: generic
name: LI.FI Connections
description: >
  LI.FI chain connection map. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://li.quest

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.li.fi/
  website: https://li.fi/

endpoints:
  - path: /query
    external_path: /v1/connections
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via LI.FI Connections.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      query:
        required:
          - name: fromChain
            type: string
            intents: ["*"]
            description: From chain
          - name: toChain
            type: string
            intents: ["*"]
            description: To chain

input_schema:
  type: object
  required: [fromChain, toChain]
  properties:
    fromChain: {type: string, description: From chain, default: "1"}
    toChain: {type: string, description: To chain, default: "137"}

semantics:
  signal_mapping:
    label_field: connections
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

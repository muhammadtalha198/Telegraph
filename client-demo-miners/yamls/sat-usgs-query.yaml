version: "1"
kind: miner
id: 68006
slug: sat-usgs-query
protocol: generic
name: USGS Event Query
description: >
  USGS FDSN event query geojson. Intent SATELLITE_IMAGERY_ANALYSIS.

base_url: https://earthquake.usgs.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://earthquake.usgs.gov/fdsnws/event/1/
  website: https://earthquake.usgs.gov/

endpoints:
  - path: /query
    external_path: /fdsnws/event/1/query
    method: GET
    description: Query for intent SATELLITE_IMAGERY_ANALYSIS via USGS Event Query.
    intents: [SATELLITE_IMAGERY_ANALYSIS]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format
          - name: limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [format, limit]
  properties:
    format: {type: string, description: Format, default: "geojson"}
    limit: {type: string, description: Limit, default: "1"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - SATELLITE_IMAGERY_ANALYSIS

on_chain:
  description: Stores signal for SATELLITE_IMAGERY_ANALYSIS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

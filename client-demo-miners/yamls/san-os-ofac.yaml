version: "1"
kind: miner
id: 78004
slug: san-os-ofac
protocol: generic
name: OpenSanctions US OFAC Index
description: >
  OpenSanctions US OFAC SDN dataset index. Intent SANCTIONS_SCREENING_MATCH.

base_url: https://data.opensanctions.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.opensanctions.org/docs/api/
  website: https://www.opensanctions.org

endpoints:
  - path: /query
    external_path: /datasets/latest/us_ofac_sdn/index.json
    method: GET
    description: Query for intent SANCTIONS_SCREENING_MATCH via OpenSanctions US OFAC Index.
    intents: [SANCTIONS_SCREENING_MATCH]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: name
  supported_intents:
    - SANCTIONS_SCREENING_MATCH

on_chain:
  description: Stores signal for SANCTIONS_SCREENING_MATCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


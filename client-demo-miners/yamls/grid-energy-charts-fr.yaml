version: "1"
kind: miner
id: 66010
slug: grid-energy-charts-fr
protocol: generic
name: Energy-Charts Price FR
description: >
  Energy-Charts day-ahead price France. Intent GRID_POWER_PRICE.

base_url: https://api.energy-charts.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.energy-charts.info/
  website: https://api.energy-charts.info/

endpoints:
  - path: /query
    external_path: /price
    method: GET
    description: Query for intent GRID_POWER_PRICE via Energy-Charts Price FR.
    intents: [GRID_POWER_PRICE]
    params:
      query:
        required:
          - name: bzn
            type: string
            intents: ["*"]
            description: Bidding zone

input_schema:
  type: object
  required: [bzn]
  properties:
    bzn: {type: string, description: Bidding zone, default: "FR"}

semantics:
  signal_mapping:
    label_field: license_info
  supported_intents:
    - GRID_POWER_PRICE

on_chain:
  description: Stores signal for GRID_POWER_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

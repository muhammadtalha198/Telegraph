version: "1"
kind: miner
id: 72006
slug: liq-gecko-pool
protocol: generic
name: GeckoTerminal Pool
description: >
  GeckoTerminal specific pool depth. Intent LIQUIDITY_DEPTH_VERIFY.

base_url: https://api.geckoterminal.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.geckoterminal.com/dex-api
  website: https://www.geckoterminal.com/

endpoints:
  - path: /query
    external_path: /api/v2/networks/eth/pools/{address}
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via GeckoTerminal Pool.
    intents: [LIQUIDITY_DEPTH_VERIFY]
    params:
      path:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: Pool address

input_schema:
  type: object
  required: [address]
  properties:
    address: {type: string, description: Pool address, default: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

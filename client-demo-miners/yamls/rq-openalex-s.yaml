version: "1"
kind: miner
id: 130007
slug: rq-openalex-s
protocol: generic
name: OpenAlex Sources Query
description: >
  OpenAlex sources research query. Intent RESEARCH_QUERY.

base_url: https://api.openalex.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.openalex.org/
  website: https://openalex.org

endpoints:
  - path: /query
    external_path: /sources
    method: GET
    description: Query for intent RESEARCH_QUERY via OpenAlex Sources Query.
    intents: [RESEARCH_QUERY]
    params:
      query:
        required:
          - name: search
            type: string
            intents: ["*"]
            description: Search
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page

input_schema:
  type: object
  required: [search, per_page]
  properties:
    search: {type: string, description: Search, default: "nature"}
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - RESEARCH_QUERY

on_chain:
  description: Stores signal for RESEARCH_QUERY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


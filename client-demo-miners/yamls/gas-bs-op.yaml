version: "1"
kind: miner
id: 41007
slug: gas-bs-op
protocol: generic
name: Blockscout Optimism Stats
description: >
  Blockscout chain stats (includes gas/fee context) for Optimism. Intent GAS_PRICE.

base_url: https://optimism.blockscout.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://optimism.blockscout.com/api-docs
  website: https://optimism.blockscout.com/

endpoints:
  - path: /query
    external_path: /api/v2/stats
    method: GET
    description: Query for intent GAS_PRICE via Blockscout Optimism Stats.
    intents: [GAS_PRICE]


input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: gas_prices
  supported_intents:
    - GAS_PRICE

on_chain:
  description: Stores signal for GAS_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 51010
slug: tok-llama-usdt
protocol: generic
name: DefiLlama Token Price Context
description: >
  DefiLlama token price context for holder analysis. Intent TOKEN_HOLDER_COUNT.

base_url: https://coins.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com/

endpoints:
  - path: /query
    external_path: /prices/current/{coins}
    method: GET
    description: Query for intent TOKEN_HOLDER_COUNT via DefiLlama Token Price Context.
    intents: [TOKEN_HOLDER_COUNT]
    params:
      path:
        required:
          - name: coins
            type: string
            intents: ["*"]
            description: ethereum:tokenAddress

input_schema:
  type: object
  required: [coins]
  properties:
    coins: {type: string, description: Coin key, default: "ethereum:0xdac17f958d2ee523a2206206994597c13d831ec7"}

semantics:
  signal_mapping:
    label_field: coins
  supported_intents:
    - TOKEN_HOLDER_COUNT

on_chain:
  description: Stores signal for TOKEN_HOLDER_COUNT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

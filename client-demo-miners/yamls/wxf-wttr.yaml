version: "1"
kind: miner
id: 35007
slug: wxf-wttr
protocol: generic
name: wttr.in Forecast
description: >
  wttr.in JSON includes forecast blocks. Intent WEATHER_FORECAST.

base_url: https://wttr.in

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/chubin/wttr.in
  website: https://wttr.in/

endpoints:
  - path: /query
    external_path: /{location}
    method: GET
    description: Query for intent WEATHER_FORECAST via wttr.in Forecast.
    intents: [WEATHER_FORECAST]
    params:
      path:
        required:
          - name: location
            type: string
            intents: ["*"]
            description: City name
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format j1

input_schema:
  type: object
  required: [location, format]
  properties:
    location: {type: string, description: City, default: "Miami"}
    format: {type: string, description: Format, default: "j1"}

semantics:
  signal_mapping:
    label_field: weather
  supported_intents:
    - WEATHER_FORECAST

on_chain:
  description: Stores signal for WEATHER_FORECAST.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

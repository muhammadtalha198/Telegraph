version: "1"
kind: miner
id: 146005
slug: loan-frank
protocol: generic
name: Frankfurter Loan FX
description: >
  FX for loan rate quotes. Intent LOAN_INTEREST_RATE_QUOTE.

base_url: https://api.frankfurter.app

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.frankfurter.app/docs/
  website: https://www.frankfurter.app

endpoints:
  - path: /query
    external_path: /latest
    method: GET
    description: Query for intent LOAN_INTEREST_RATE_QUOTE via Frankfurter Loan FX.
    intents: [LOAN_INTEREST_RATE_QUOTE]
    params:
      query:
        required:
          - name: from
            type: string
            intents: ["*"]
            description: From
          - name: to
            type: string
            intents: ["*"]
            description: To

input_schema:
  type: object
  required: [from, to]
  properties:
    from: {type: string, description: From, default: "USD"}
    to: {type: string, description: To, default: "EUR"}

semantics:
  signal_mapping:
    label_field: rates
  supported_intents:
    - LOAN_INTEREST_RATE_QUOTE

on_chain:
  description: Stores signal for LOAN_INTEREST_RATE_QUOTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


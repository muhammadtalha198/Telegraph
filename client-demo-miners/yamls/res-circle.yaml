version: "1"
kind: miner
id: 81007
slug: res-circle
protocol: generic
name: Circle Stablecoin Supply
description: >
  Circle public stablecoin total amounts. Intent ASSET_RESERVE_ATTESTATION.

base_url: https://api.circle.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.circle.com/
  website: https://www.circle.com

endpoints:
  - path: /query
    external_path: /v1/stablecoins
    method: GET
    description: Query for intent ASSET_RESERVE_ATTESTATION via Circle Stablecoin Supply.
    intents: [ASSET_RESERVE_ATTESTATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - ASSET_RESERVE_ATTESTATION

on_chain:
  description: Stores signal for ASSET_RESERVE_ATTESTATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


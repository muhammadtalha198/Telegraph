version: "1"
kind: miner
id: 80021
slug: wash-dex-volume
protocol: generic
name: DexScreener H24 Volume
description: >
  DexScreener pair h24 volume → volume_h24_usd.
  Intent WASH_TRADING_DETECTION — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/wash-volume
    method: GET
    description: Query for intent WASH_TRADING_DETECTION via DexScreener H24 Volume.
    intents: [WASH_TRADING_DETECTION]
    params:
      query:
        required:
          - name: chainId
            type: string
            intents: ["*"]
            description: Chain id
          - name: pairAddresses
            type: string
            intents: ["*"]
            description: Pair address

input_schema:
  type: object
  required: [chainId, pairAddresses]
  properties:
    chainId: {type: string, description: "Chain id", default: "ethereum"}
    pairAddresses: {type: string, description: "Pair address", default: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"}

semantics:
  signal_mapping:
    label_field: volume_h24_usd
  supported_intents:
    - WASH_TRADING_DETECTION

on_chain:
  description: Stores signal for WASH_TRADING_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

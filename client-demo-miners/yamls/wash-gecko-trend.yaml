version: "1"
kind: miner
id: 80005
slug: wash-gecko-trend
protocol: generic
name: GeckoTerminal Trending
description: >
  GeckoTerminal eth trending pools. Intent WASH_TRADING_DETECTION.

base_url: https://api.geckoterminal.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.geckoterminal.com/dex-api
  website: https://www.geckoterminal.com

endpoints:
  - path: /query
    external_path: /api/v2/networks/eth/trending_pools
    method: GET
    description: Query for intent WASH_TRADING_DETECTION via GeckoTerminal Trending.
    intents: [WASH_TRADING_DETECTION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - WASH_TRADING_DETECTION

on_chain:
  description: Stores signal for WASH_TRADING_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


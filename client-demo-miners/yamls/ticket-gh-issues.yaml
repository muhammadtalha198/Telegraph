version: "1"
kind: miner
id: 65001
slug: ticket-gh-issues
protocol: generic
name: GitHub Issues List
description: >
  GitHub closed issues as ticket outcomes. Intent CUSTOMER_TICKET_RESOLUTION.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/issues/issues
  website: https://github.com/

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/issues
    method: GET
    description: Query for intent CUSTOMER_TICKET_RESOLUTION via GitHub Issues List.
    intents: [CUSTOMER_TICKET_RESOLUTION]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
      query:
        required:
          - name: state
            type: string
            intents: ["*"]
            description: State
          - name: per_page
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [owner, repo, state, per_page]
  properties:
    owner: {type: string, description: Owner, default: "facebook"}
    repo: {type: string, description: Repo, default: "react"}
    state: {type: string, description: State, default: "closed"}
    per_page: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CUSTOMER_TICKET_RESOLUTION

on_chain:
  description: Stores signal for CUSTOMER_TICKET_RESOLUTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

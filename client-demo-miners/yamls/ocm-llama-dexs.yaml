version: "1"
kind: miner
id: 71003
slug: ocm-llama-dexs
protocol: generic
name: Llama DEX Volumes
description: >
  DefiLlama DEX volume metrics. Intent ONCHAIN_METRIC_VERIFY.

base_url: https://api.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com/

endpoints:
  - path: /query
    external_path: /overview/dexs
    method: GET
    description: Query for intent ONCHAIN_METRIC_VERIFY via Llama DEX Volumes.
    intents: [ONCHAIN_METRIC_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: totalDataChart
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

on_chain:
  description: Stores signal for ONCHAIN_METRIC_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

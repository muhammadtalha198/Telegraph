version: "1"
kind: miner
id: 138004
slug: apih-cf-trace
protocol: generic
name: Cloudflare Trace Health
description: >
  Cloudflare trace health. Intent API_HEALTH_CHECK.

base_url: https://www.cloudflare.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.cloudflare.com/
  website: https://www.cloudflare.com

endpoints:
  - path: /query
    external_path: /cdn-cgi/trace
    method: GET
    description: Query for intent API_HEALTH_CHECK via Cloudflare Trace Health.
    intents: [API_HEALTH_CHECK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - API_HEALTH_CHECK

on_chain:
  description: Stores signal for API_HEALTH_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


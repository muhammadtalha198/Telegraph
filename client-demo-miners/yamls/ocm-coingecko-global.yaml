version: "1"
kind: miner
id: 71009
slug: ocm-coingecko-global
protocol: generic
name: CoinGecko Crypto Metrics
description: >
  CoinGecko global on-market metrics. Intent ONCHAIN_METRIC_VERIFY.

base_url: https://api.coingecko.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.coingecko.com/en/api
  website: https://www.coingecko.com/

endpoints:
  - path: /query
    external_path: /api/v3/global
    method: GET
    description: Query for intent ONCHAIN_METRIC_VERIFY via CoinGecko Crypto Metrics.
    intents: [ONCHAIN_METRIC_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

on_chain:
  description: Stores signal for ONCHAIN_METRIC_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

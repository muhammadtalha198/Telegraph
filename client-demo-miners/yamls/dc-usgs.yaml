version: "1"
kind: miner
id: 105005
slug: dc-usgs
protocol: generic
name: USGS Water DC Telemetry
description: >
  USGS water site telemetry near infrastructure. Intent DATACENTER_TELEMETRY_VERIFY.

base_url: https://waterservices.usgs.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://waterservices.usgs.gov/docs/
  website: https://waterdata.usgs.gov

endpoints:
  - path: /query
    external_path: /nwis/iv/
    method: GET
    description: Query for intent DATACENTER_TELEMETRY_VERIFY via USGS Water DC Telemetry.
    intents: [DATACENTER_TELEMETRY_VERIFY]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format
          - name: sites
            type: string
            intents: ["*"]
            description: Site
          - name: parameterCd
            type: string
            intents: ["*"]
            description: Param

input_schema:
  type: object
  required: [format, sites, parameterCd]
  properties:
    format: {type: string, description: Format, default: "json"}
    sites: {type: string, description: Site, default: "01646500"}
    parameterCd: {type: string, description: Param, default: "00060"}

semantics:
  signal_mapping:
    label_field: value
  supported_intents:
    - DATACENTER_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for DATACENTER_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


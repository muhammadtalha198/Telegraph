version: "1"
kind: miner
id: 87007
slug: ven-un-list
protocol: generic
name: UN Sanctions XML
description: >
  UN consolidated sanctions for vendor verify. Intent VENDOR_VERIFY.

base_url: https://scsanctions.un.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://main.un.org/securitycouncil/en/sanctions/information
  website: https://main.un.org/securitycouncil

endpoints:
  - path: /query
    external_path: /resources/xml/en/consolidated.xml
    method: GET
    description: Query for intent VENDOR_VERIFY via UN Sanctions XML.
    intents: [VENDOR_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: CONSOLIDATED_LIST
  supported_intents:
    - VENDOR_VERIFY

on_chain:
  description: Stores signal for VENDOR_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


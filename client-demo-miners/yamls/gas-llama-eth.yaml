version: "1"
kind: miner
id: 41010
slug: gas-llama-eth
protocol: generic
name: DefiLlama ETH Price Context
description: >
  DefiLlama ETH spot used as gas-market context. Intent GAS_PRICE.

base_url: https://coins.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com/

endpoints:
  - path: /query
    external_path: /prices/current/{coins}
    method: GET
    description: Query for intent GAS_PRICE via DefiLlama ETH Price Context.
    intents: [GAS_PRICE]
    params:
      path:
        required:
          - name: coins
            type: string
            intents: ["*"]
            description: coingecko:ethereum

input_schema:
  type: object
  required: [coins]
  properties:
    coins: {type: string, description: Coin key, default: "coingecko:ethereum"}

semantics:
  signal_mapping:
    label_field: coins
  supported_intents:
    - GAS_PRICE

on_chain:
  description: Stores signal for GAS_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

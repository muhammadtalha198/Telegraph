version: "1"
kind: miner
id: 107002
slug: regr-gh-compare
protocol: generic
name: GH Next Compare
description: >
  GitHub compare for regression delta. Intent REGRESSION_VERIFY.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest
  website: https://github.com

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/compare/{basehead}
    method: GET
    description: Query for intent REGRESSION_VERIFY via GH Next Compare.
    intents: [REGRESSION_VERIFY]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
          - name: basehead
            type: string
            intents: ["*"]
            description: Basehead

input_schema:
  type: object
  required: [owner, repo, basehead]
  properties:
    owner: {type: string, description: Owner, default: "vercel"}
    repo: {type: string, description: Repo, default: "next.js"}
    basehead: {type: string, description: Basehead, default: "canary...canary~1"}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - REGRESSION_VERIFY

on_chain:
  description: Stores signal for REGRESSION_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


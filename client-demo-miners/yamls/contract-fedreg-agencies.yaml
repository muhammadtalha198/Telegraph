version: "1"
kind: miner
id: 64007
slug: contract-fedreg-agencies
protocol: generic
name: Federal Register Agencies
description: >
  Federal Register agencies list. Intent CONTRACT_OBLIGATION_AUDIT.

base_url: https://www.federalregister.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.federalregister.gov/developers/documentation/api/v1
  website: https://www.federalregister.gov/

endpoints:
  - path: /query
    external_path: /api/v1/agencies
    method: GET
    description: Query for intent CONTRACT_OBLIGATION_AUDIT via Federal Register Agencies.
    intents: [CONTRACT_OBLIGATION_AUDIT]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CONTRACT_OBLIGATION_AUDIT

on_chain:
  description: Stores signal for CONTRACT_OBLIGATION_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 165008
slug: kyc-geojs
protocol: generic
name: GeoJS KYC Geo
description: >
  GeoJS IP geo KYC context. Intent KYC_BIOMETRIC_LIVENESS.

base_url: https://get.geojs.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.geojs.io/docs/v1/simple/geo/
  website: https://www.geojs.io

endpoints:
  - path: /query
    external_path: /v1/ip/geo/{ip}.json
    method: GET
    description: Query for intent KYC_BIOMETRIC_LIVENESS via GeoJS KYC Geo.
    intents: [KYC_BIOMETRIC_LIVENESS]
    params:
      path:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "8.8.8.8"}

semantics:
  signal_mapping:
    label_field: country
  supported_intents:
    - KYC_BIOMETRIC_LIVENESS

on_chain:
  description: Stores signal for KYC_BIOMETRIC_LIVENESS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


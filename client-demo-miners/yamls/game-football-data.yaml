version: "1"
kind: miner
id: 69010
slug: game-football-data
protocol: generic
name: Football-Data Matches
description: >
  Football-Data.org free matches feed. Intent GAME_RESULT.

base_url: https://api.football-data.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.football-data.org/documentation/api
  website: https://www.football-data.org/

endpoints:
  - path: /query
    external_path: /v4/matches
    method: GET
    description: Query for intent GAME_RESULT via Football-Data Matches.
    intents: [GAME_RESULT]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: matches
  supported_intents:
    - GAME_RESULT

on_chain:
  description: Stores signal for GAME_RESULT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 70002
slug: fin-worldbank-inflation
protocol: generic
name: World Bank Inflation
description: >
  World Bank US inflation indicator. Intent FINANCIAL_DATA.

base_url: https://api.worldbank.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://datahelpdesk.worldbank.org/
  website: https://data.worldbank.org/

endpoints:
  - path: /query
    external_path: /v2/country/{country}/indicator/{indicator}
    method: GET
    description: Query for intent FINANCIAL_DATA via World Bank Inflation.
    intents: [FINANCIAL_DATA]
    params:
      path:
        required:
          - name: country
            type: string
            intents: ["*"]
            description: Country
          - name: indicator
            type: string
            intents: ["*"]
            description: Indicator
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page

input_schema:
  type: object
  required: [country, indicator, format, per_page]
  properties:
    country: {type: string, description: Country, default: "US"}
    indicator: {type: string, description: Indicator, default: "FP.CPI.TOTL.ZG"}
    format: {type: string, description: Format, default: "json"}
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: "1"
  supported_intents:
    - FINANCIAL_DATA

on_chain:
  description: Stores signal for FINANCIAL_DATA.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

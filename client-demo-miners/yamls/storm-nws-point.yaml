version: "1"
kind: miner
id: 37001
slug: storm-nws-point
protocol: generic
name: NWS Alerts by Point
description: >
  US NWS active alerts for a lat,lon point. Intent STORM_ALERT.

base_url: https://api.weather.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.weather.gov/documentation/services-web-api
  website: https://www.weather.gov/

endpoints:
  - path: /query
    external_path: /alerts/active
    method: GET
    description: Query for intent STORM_ALERT via NWS Alerts by Point.
    intents: [STORM_ALERT]
    params:
      query:
        required:
          - name: point
            type: string
            intents: ["*"]
            description: lat,lon

input_schema:
  type: object
  required: [point]
  properties:
    point: {type: string, description: lat,lon, default: "25.7617,-80.1918"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - STORM_ALERT

on_chain:
  description: Stores signal for STORM_ALERT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 61010
slug: route-paraswap-tokens
protocol: generic
name: ParaSwap Tokens ETH
description: >
  ParaSwap tradable token list on Ethereum. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://apiv5.paraswap.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.paraswap.network/
  website: https://www.paraswap.io/

endpoints:
  - path: /query
    external_path: /tokens/{network}
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via ParaSwap Tokens ETH.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      path:
        required:
          - name: network
            type: string
            intents: ["*"]
            description: Network id

input_schema:
  type: object
  required: [network]
  properties:
    network: {type: string, description: Network id, default: "1"}

semantics:
  signal_mapping:
    label_field: tokens
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

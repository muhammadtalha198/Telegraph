version: "1"
kind: miner
id: 150008
slug: up-httpbin-status
protocol: generic
name: HTTPBin Status Uptime
description: >
  HTTPBin status code uptime. Intent SERVER_UPTIME_MONITOR.

base_url: https://httpbin.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://httpbin.org/
  website: https://httpbin.org

endpoints:
  - path: /query
    external_path: /status/{code}
    method: GET
    description: Query for intent SERVER_UPTIME_MONITOR via HTTPBin Status Uptime.
    intents: [SERVER_UPTIME_MONITOR]
    params:
      path:
        required:
          - name: code
            type: string
            intents: ["*"]
            description: Code

input_schema:
  type: object
  required: [code]
  properties:
    code: {type: string, description: Code, default: "200"}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - SERVER_UPTIME_MONITOR

on_chain:
  description: Stores signal for SERVER_UPTIME_MONITOR.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


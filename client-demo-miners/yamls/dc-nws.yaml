version: "1"
kind: miner
id: 105008
slug: dc-nws
protocol: generic
name: NWS Obs DC Telemetry
description: >
  NWS station observation DC telemetry. Intent DATACENTER_TELEMETRY_VERIFY.

base_url: https://api.weather.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.weather.gov/documentation/services-web-api
  website: https://www.weather.gov

endpoints:
  - path: /query
    external_path: /stations/{station}/observations/latest
    method: GET
    description: Query for intent DATACENTER_TELEMETRY_VERIFY via NWS Obs DC Telemetry.
    intents: [DATACENTER_TELEMETRY_VERIFY]
    params:
      path:
        required:
          - name: station
            type: string
            intents: ["*"]
            description: Station

input_schema:
  type: object
  required: [station]
  properties:
    station: {type: string, description: Station, default: "KIAD"}

semantics:
  signal_mapping:
    label_field: properties
  supported_intents:
    - DATACENTER_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for DATACENTER_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


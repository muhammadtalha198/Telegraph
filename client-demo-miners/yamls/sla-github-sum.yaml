version: "1"
kind: miner
id: 103002
slug: sla-github-sum
protocol: generic
name: GitHub Summary SLA
description: >
  GitHub status summary SLA. Intent SLA_COMPLIANCE.

base_url: https://www.githubstatus.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.githubstatus.com/
  website: https://www.githubstatus.com

endpoints:
  - path: /query
    external_path: /api/v2/summary.json
    method: GET
    description: Query for intent SLA_COMPLIANCE via GitHub Summary SLA.
    intents: [SLA_COMPLIANCE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - SLA_COMPLIANCE

on_chain:
  description: Stores signal for SLA_COMPLIANCE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


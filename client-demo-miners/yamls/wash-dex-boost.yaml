version: "1"
kind: miner
id: 80004
slug: wash-dex-boost
protocol: generic
name: DexScreener Token Boosts
description: >
  DexScreener top token boosts. Intent WASH_TRADING_DETECTION.

base_url: https://api.dexscreener.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.dexscreener.com/
  website: https://dexscreener.com

endpoints:
  - path: /query
    external_path: /token-boosts/top/v1
    method: GET
    description: Query for intent WASH_TRADING_DETECTION via DexScreener Token Boosts.
    intents: [WASH_TRADING_DETECTION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - WASH_TRADING_DETECTION

on_chain:
  description: Stores signal for WASH_TRADING_DETECTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


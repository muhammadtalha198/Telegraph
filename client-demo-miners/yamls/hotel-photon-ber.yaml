version: "1"
kind: miner
id: 115001
slug: hotel-photon-ber
protocol: generic
name: Photon Hotels Berlin
description: >
  Photon hotel POI availability signal Berlin. Intent HOTEL_AVAILABILITY.

base_url: https://photon.komoot.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/komoot/photon
  website: https://photon.komoot.io

endpoints:
  - path: /query
    external_path: /api/
    method: GET
    description: Query for intent HOTEL_AVAILABILITY via Photon Hotels Berlin.
    intents: [HOTEL_AVAILABILITY]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query
          - name: limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [q, limit]
  properties:
    q: {type: string, description: Query, default: "hotel berlin"}
    limit: {type: string, description: Limit, default: "1"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - HOTEL_AVAILABILITY

on_chain:
  description: Stores signal for HOTEL_AVAILABILITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


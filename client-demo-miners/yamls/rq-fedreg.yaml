version: "1"
kind: miner
id: 130009
slug: rq-fedreg
protocol: generic
name: Fed Register Research
description: >
  Federal Register research docs. Intent RESEARCH_QUERY.

base_url: https://www.federalregister.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.federalregister.gov/developers/documentation/api/v1
  website: https://www.federalregister.gov

endpoints:
  - path: /query
    external_path: /api/v1/documents.json
    method: GET
    description: Query for intent RESEARCH_QUERY via Fed Register Research.
    intents: [RESEARCH_QUERY]
    params:
      query:
        required:
          - name: "conditions[term]"
            type: string
            intents: ["*"]
            description: Term
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page

input_schema:
  type: object
  required: ["conditions[term]", per_page]
  properties:
    "conditions[term]": {type: string, description: Term, default: "research"}
    per_page: {type: string, description: Per page, default: "1"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - RESEARCH_QUERY

on_chain:
  description: Stores signal for RESEARCH_QUERY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


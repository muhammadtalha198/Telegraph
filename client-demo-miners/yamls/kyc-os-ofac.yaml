version: "1"
kind: miner
id: 165006
slug: kyc-os-ofac
protocol: generic
name: OpenSanctions OFAC KYC
description: >
  OpenSanctions OFAC KYC list. Intent KYC_BIOMETRIC_LIVENESS.

base_url: https://data.opensanctions.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.opensanctions.org/docs/api/
  website: https://www.opensanctions.org

endpoints:
  - path: /query
    external_path: /datasets/latest/us_ofac_sdn/index.json
    method: GET
    description: Query for intent KYC_BIOMETRIC_LIVENESS via OpenSanctions OFAC KYC.
    intents: [KYC_BIOMETRIC_LIVENESS]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: datasets
  supported_intents:
    - KYC_BIOMETRIC_LIVENESS

on_chain:
  description: Stores signal for KYC_BIOMETRIC_LIVENESS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


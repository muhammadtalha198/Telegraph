version: "1"
kind: miner
id: 146008
slug: loan-bis
protocol: generic
name: BIS Policy Rates
description: >
  BIS central bank policy rates. Intent LOAN_INTEREST_RATE_QUOTE.

base_url: https://stats.bis.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://data.bis.org/
  website: https://www.bis.org

endpoints:
  - path: /query
    external_path: /api/v2/data/dataflow/BIS/WS_CBPOL/1.0/M.US
    method: GET
    description: Query for intent LOAN_INTEREST_RATE_QUOTE via BIS Policy Rates.
    intents: [LOAN_INTEREST_RATE_QUOTE]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [format]
  properties:
    format: {type: string, description: Format, default: "csv"}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - LOAN_INTEREST_RATE_QUOTE

on_chain:
  description: Stores signal for LOAN_INTEREST_RATE_QUOTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


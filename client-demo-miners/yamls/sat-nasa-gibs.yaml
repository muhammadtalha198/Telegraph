version: "1"
kind: miner
id: 68007
slug: sat-nasa-gibs
protocol: generic
name: NASA GIBS WMTS Caps
description: >
  NASA GIBS WMTS GetCapabilities. Intent SATELLITE_IMAGERY_ANALYSIS.

base_url: https://gibs.earthdata.nasa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://nasa-gibs.github.io/gibs-api-docs/
  website: https://earthdata.nasa.gov/gibs

endpoints:
  - path: /query
    external_path: /wmts/epsg4326/best/wmts.cgi
    method: GET
    description: Query for intent SATELLITE_IMAGERY_ANALYSIS via NASA GIBS WMTS Caps.
    intents: [SATELLITE_IMAGERY_ANALYSIS]
    params:
      query:
        required:
          - name: SERVICE
            type: string
            intents: ["*"]
            description: Service
          - name: REQUEST
            type: string
            intents: ["*"]
            description: Request

input_schema:
  type: object
  required: [SERVICE, REQUEST]
  properties:
    SERVICE: {type: string, description: Service, default: "WMTS"}
    REQUEST: {type: string, description: Request, default: "GetCapabilities"}

semantics:
  signal_mapping:
    label_field: Capabilities
  supported_intents:
    - SATELLITE_IMAGERY_ANALYSIS

on_chain:
  description: Stores signal for SATELLITE_IMAGERY_ANALYSIS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

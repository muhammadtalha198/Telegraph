version: "1"
kind: miner
id: 161008
slug: stt-bbc
protocol: generic
name: BBC Speech Corpus
description: >
  BBC RSS transcript-like corpus. Intent SPEECH_TO_TEXT.

base_url: https://feeds.bbci.co.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.bbc.co.uk/news
  website: https://www.bbc.co.uk

endpoints:
  - path: /query
    external_path: /news/rss.xml
    method: GET
    description: Query for intent SPEECH_TO_TEXT via BBC Speech Corpus.
    intents: [SPEECH_TO_TEXT]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: feed
  supported_intents:
    - SPEECH_TO_TEXT

on_chain:
  description: Stores signal for SPEECH_TO_TEXT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


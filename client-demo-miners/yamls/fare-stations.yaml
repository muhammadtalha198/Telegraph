version: "1"
kind: miner
id: 117006
slug: fare-stations
protocol: generic
name: Digitraffic Stations Fare
description: >
  Rail stations metadata for fare rules. Intent FARE_RULE_VERIFY.

base_url: https://rata.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/railway-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/v1/metadata/stations
    method: GET
    description: Query for intent FARE_RULE_VERIFY via Digitraffic Stations Fare.
    intents: [FARE_RULE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - FARE_RULE_VERIFY

on_chain:
  description: Stores signal for FARE_RULE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


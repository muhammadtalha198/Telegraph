version: "1"
kind: miner
id: 83010
slug: prod-obf-product
protocol: generic
name: Open Beauty Facts Product API
description: >
  Open Beauty Facts v2 product by barcode attempt. Intent PRODUCT_AUTHENTICITY.

base_url: https://world.openbeautyfacts.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://world.openbeautyfacts.org/data
  website: https://world.openbeautyfacts.org

endpoints:
  - path: /query
    external_path: /api/v2/search
    method: GET
    description: Query for intent PRODUCT_AUTHENTICITY via Open Beauty Facts Product API.
    intents: [PRODUCT_AUTHENTICITY]
    params:
      query:
        required:
          - name: categories_tags_en
            type: string
            intents: ["*"]
            description: Category
          - name: page_size
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [categories_tags_en, page_size]
  properties:
    categories_tags_en: {type: string, description: Category, default: "shampoos"}
    page_size: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: products
  supported_intents:
    - PRODUCT_AUTHENTICITY

on_chain:
  description: Stores signal for PRODUCT_AUTHENTICITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


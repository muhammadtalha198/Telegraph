version: "1"
kind: miner
id: 60001
slug: code-gh-pull
protocol: generic
name: GitHub Pull Request
description: >
  GitHub PR metadata for review. Intent CODE_REVIEW.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/pulls/pulls
  website: https://github.com/

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/pulls/{pull_number}
    method: GET
    description: Query for intent CODE_REVIEW via GitHub Pull Request.
    intents: [CODE_REVIEW]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Repo owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo name
          - name: pull_number
            type: string
            intents: ["*"]
            description: PR number

input_schema:
  type: object
  required: [owner, repo, pull_number]
  properties:
    owner: {type: string, description: Repo owner, default: "facebook"}
    repo: {type: string, description: Repo name, default: "react"}
    pull_number: {type: string, description: PR number, default: "1"}

semantics:
  signal_mapping:
    label_field: title
  supported_intents:
    - CODE_REVIEW

on_chain:
  description: Stores signal for CODE_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

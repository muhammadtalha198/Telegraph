version: "1"
kind: miner
id: 105006
slug: dc-tide
protocol: generic
name: NOAA Tide DC Telemetry
description: >
  NOAA tide telemetry coastal DC risk. Intent DATACENTER_TELEMETRY_VERIFY.

base_url: https://api.tidesandcurrents.noaa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.tidesandcurrents.noaa.gov/api/prod/
  website: https://tidesandcurrents.noaa.gov

endpoints:
  - path: /query
    external_path: /api/prod/datagetter
    method: GET
    description: Query for intent DATACENTER_TELEMETRY_VERIFY via NOAA Tide DC Telemetry.
    intents: [DATACENTER_TELEMETRY_VERIFY]
    params:
      query:
        required:
          - name: date
            type: string
            intents: ["*"]
            description: Date
          - name: station
            type: string
            intents: ["*"]
            description: Station
          - name: product
            type: string
            intents: ["*"]
            description: Product
          - name: datum
            type: string
            intents: ["*"]
            description: Datum
          - name: time_zone
            type: string
            intents: ["*"]
            description: TZ
          - name: units
            type: string
            intents: ["*"]
            description: Units
          - name: format
            type: string
            intents: ["*"]
            description: Format

input_schema:
  type: object
  required: [date, station, product, datum, time_zone, units, format]
  properties:
    date: {type: string, description: Date, default: "latest"}
    station: {type: string, description: Station, default: "8723214"}
    product: {type: string, description: Product, default: "water_level"}
    datum: {type: string, description: Datum, default: "MTL"}
    time_zone: {type: string, description: TZ, default: "gmt"}
    units: {type: string, description: Units, default: "metric"}
    format: {type: string, description: Format, default: "json"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - DATACENTER_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for DATACENTER_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


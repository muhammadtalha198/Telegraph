version: "1"
kind: miner
id: 158010
slug: emb-hn-best
protocol: generic
name: HN Best Embedding Corpus
description: >
  HN best stories embedding corpus. Intent EMBEDDING_GENERATION.

base_url: https://hacker-news.firebaseio.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/HackerNews/API
  website: https://news.ycombinator.com

endpoints:
  - path: /query
    external_path: /v0/beststories.json
    method: GET
    description: Query for intent EMBEDDING_GENERATION via HN Best Embedding Corpus.
    intents: [EMBEDDING_GENERATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - EMBEDDING_GENERATION

on_chain:
  description: Stores signal for EMBEDDING_GENERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


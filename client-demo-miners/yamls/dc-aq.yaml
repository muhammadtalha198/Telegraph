version: "1"
kind: miner
id: 105004
slug: dc-aq
protocol: generic
name: Open-Meteo DC AQ
description: >
  Air quality telemetry near DC. Intent DATACENTER_TELEMETRY_VERIFY.

base_url: https://air-quality-api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://open-meteo.com/en/docs/air-quality-api
  website: https://open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/air-quality
    method: GET
    description: Query for intent DATACENTER_TELEMETRY_VERIFY via Open-Meteo DC AQ.
    intents: [DATACENTER_TELEMETRY_VERIFY]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: Lat
          - name: longitude
            type: string
            intents: ["*"]
            description: Lon
          - name: current
            type: string
            intents: ["*"]
            description: Current

input_schema:
  type: object
  required: [latitude, longitude, current]
  properties:
    latitude: {type: string, description: Lat, default: "37.77"}
    longitude: {type: string, description: Lon, default: "-122.42"}
    current: {type: string, description: Current, default: "pm2_5"}

semantics:
  signal_mapping:
    label_field: current
  supported_intents:
    - DATACENTER_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for DATACENTER_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


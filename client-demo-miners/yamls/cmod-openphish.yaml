version: "1"
kind: miner
id: 123001
slug: cmod-openphish
protocol: generic
name: OpenPhish Moderation
description: >
  OpenPhish unsafe URL moderation. Intent CONTENT_MODERATION.

base_url: https://openphish.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://openphish.com/
  website: https://openphish.com

endpoints:
  - path: /query
    external_path: /feed.txt
    method: GET
    description: Query for intent CONTENT_MODERATION via OpenPhish Moderation.
    intents: [CONTENT_MODERATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: result
  supported_intents:
    - CONTENT_MODERATION

on_chain:
  description: Stores signal for CONTENT_MODERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


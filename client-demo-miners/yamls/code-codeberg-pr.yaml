version: "1"
kind: miner
id: 60009
slug: code-codeberg-pr
protocol: generic
name: Codeberg Pull Requests
description: >
  Codeberg/Forgejo PRs for review. Intent CODE_REVIEW.

base_url: https://codeberg.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://codeberg.org/api/swagger
  website: https://codeberg.org/

endpoints:
  - path: /query
    external_path: /api/v1/repos/{owner}/{repo}/pulls
    method: GET
    description: Query for intent CODE_REVIEW via Codeberg Pull Requests.
    intents: [CODE_REVIEW]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
      query:
        required:
          - name: state
            type: string
            intents: ["*"]
            description: PR state
          - name: limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [owner, repo, state, limit]
  properties:
    owner: {type: string, description: Owner, default: "forgejo"}
    repo: {type: string, description: Repo, default: "forgejo"}
    state: {type: string, description: PR state, default: "closed"}
    limit: {type: string, description: Limit, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CODE_REVIEW

on_chain:
  description: Stores signal for CODE_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

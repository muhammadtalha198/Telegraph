version: "1"
kind: miner
id: 86002
slug: port-digit-loc-hel
protocol: generic
name: Digitraffic AIS Helsinki Radius
description: >
  AIS locations near Helsinki port. Intent LIVE_PORT_CONGESTION.

base_url: https://meri.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/marine-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/ais/v1/locations
    method: GET
    description: Query for intent LIVE_PORT_CONGESTION via Digitraffic AIS Helsinki Radius.
    intents: [LIVE_PORT_CONGESTION]
    params:
      query:
        required:
          - name: radius
            type: string
            intents: ["*"]
            description: Radius km
          - name: latitude
            type: string
            intents: ["*"]
            description: Lat
          - name: longitude
            type: string
            intents: ["*"]
            description: Lon

input_schema:
  type: object
  required: [radius, latitude, longitude]
  properties:
    radius: {type: string, description: Radius km, default: "10"}
    latitude: {type: string, description: Lat, default: "60.17"}
    longitude: {type: string, description: Lon, default: "24.94"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - LIVE_PORT_CONGESTION

on_chain:
  description: Stores signal for LIVE_PORT_CONGESTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


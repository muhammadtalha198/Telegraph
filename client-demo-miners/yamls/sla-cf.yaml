version: "1"
kind: miner
id: 103003
slug: sla-cf
protocol: generic
name: Cloudflare Status SLA
description: >
  Cloudflare status SLA signal. Intent SLA_COMPLIANCE.

base_url: https://www.cloudflarestatus.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.cloudflarestatus.com/
  website: https://www.cloudflarestatus.com

endpoints:
  - path: /query
    external_path: /api/v2/status.json
    method: GET
    description: Query for intent SLA_COMPLIANCE via Cloudflare Status SLA.
    intents: [SLA_COMPLIANCE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - SLA_COMPLIANCE

on_chain:
  description: Stores signal for SLA_COMPLIANCE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


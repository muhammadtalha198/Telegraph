version: "1"
kind: miner
id: 133005
slug: tcomp-osv
protocol: generic
name: OSV Complete
description: >
  OSV advisory task completion context. Intent TASK_COMPLETION.

base_url: https://api.osv.dev

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://google.github.io/osv.dev/
  website: https://osv.dev

endpoints:
  - path: /query
    external_path: /v1/vulns/{id}
    method: GET
    description: Query for intent TASK_COMPLETION via OSV Complete.
    intents: [TASK_COMPLETION]
    params:
      path:
        required:
          - name: id
            type: string
            intents: ["*"]
            description: ID

input_schema:
  type: object
  required: [id]
  properties:
    id: {type: string, description: ID, default: "GHSA-c2qf-rxjj-qqgw"}

semantics:
  signal_mapping:
    label_field: id
  supported_intents:
    - TASK_COMPLETION

on_chain:
  description: Stores signal for TASK_COMPLETION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 77006
slug: secrev-nvd
protocol: generic
name: NVD CVE Lookup Review
description: >
  NVD CVE 2.0 lookup for security review. Intent SECURITY_REVIEW.

base_url: https://services.nvd.nist.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://nvd.nist.gov/developers/vulnerabilities
  website: https://nvd.nist.gov

endpoints:
  - path: /query
    external_path: /rest/json/cves/2.0
    method: GET
    description: Query for intent SECURITY_REVIEW via NVD CVE Lookup Review.
    intents: [SECURITY_REVIEW]
    params:
      query:
        required:
          - name: cveId
            type: string
            intents: ["*"]
            description: CVE id

input_schema:
  type: object
  required: [cveId]
  properties:
    cveId: {type: string, description: CVE id, default: "CVE-2021-44228"}

semantics:
  signal_mapping:
    label_field: vulnerabilities
  supported_intents:
    - SECURITY_REVIEW

on_chain:
  description: Stores signal for SECURITY_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


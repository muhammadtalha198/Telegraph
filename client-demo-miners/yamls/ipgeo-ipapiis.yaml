version: "1"
kind: miner
id: 34007
slug: ipgeo-ipapiis
protocol: generic
name: ipapi.is Geolocation
description: >
  ipapi.is lookup. Intent IP_GEOLOCATION. Direct Request shows q (IP).

base_url: https://api.ipapi.is

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ipapi.is/developers.html
  website: https://ipapi.is/

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: IP geolocation for intent IP_GEOLOCATION via ipapi.is Geolocation.
    intents: [IP_GEOLOCATION]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: IP address to look up

input_schema:
  type: object
  required: [q]
  properties:
    q:
      type: string
      description: IP address
      default: "8.8.8.8"

semantics:
  signal_mapping:
    label_field: city
  supported_intents:
    - IP_GEOLOCATION

on_chain:
  description: Stores geo signal for IP_GEOLOCATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

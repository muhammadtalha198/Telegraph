version: "1"
kind: miner
id: 143007
slug: ent-clearbit
protocol: generic
name: Clearbit Entity
description: >
  Clearbit company entity suggest. Intent ENTITY_EXTRACTION.

base_url: https://autocomplete.clearbit.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://clearbit.com/
  website: https://clearbit.com

endpoints:
  - path: /query
    external_path: /v1/companies/suggest
    method: GET
    description: Query for intent ENTITY_EXTRACTION via Clearbit Entity.
    intents: [ENTITY_EXTRACTION]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query

input_schema:
  type: object
  required: [query]
  properties:
    query: {type: string, description: Query, default: "google"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - ENTITY_EXTRACTION

on_chain:
  description: Stores signal for ENTITY_EXTRACTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


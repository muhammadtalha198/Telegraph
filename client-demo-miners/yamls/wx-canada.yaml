version: "1"
kind: miner
id: 33010
slug: wx-canada
protocol: generic
name: Environment Canada Weather
description: >
  Environment Canada citypage realtime. Intent WEATHER_CHECK. Direct Request shows city q.

base_url: https://api.weather.gc.ca

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://eccc-msc.github.io/open-data/msc-geomet/readme_en/
  website: https://weather.gc.ca/

endpoints:
  - path: /query
    external_path: /collections/citypageweather-realtime/items
    method: GET
    description: Current weather for intent WEATHER_CHECK via Environment Canada Weather.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: City name e.g. Toronto
          - name: limit
            type: string
            intents: ["*"]
            description: Result limit

input_schema:
  type: object
  required: [q, limit]
  properties:
    q:
      type: string
      description: Canadian city name
      default: "Toronto"
    limit:
      type: string
      description: Max results
      default: "1"

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores weather signal for WEATHER_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 93113
slug: res-wbtc-por-merkle
protocol: generic
name: WBTC PoR via Merkle
description: >
  Chainlink WBTC PoR eth_call pinned to merkle.
  Intent ASSET_RESERVE_ATTESTATION — scale peers for Usman ranking.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/wbtc-por
    method: GET
    description: Query for intent ASSET_RESERVE_ATTESTATION via WBTC PoR via Merkle.
    intents: [ASSET_RESERVE_ATTESTATION]
    params:
      query:
        required:
          - name: feed
            type: string
            intents: ["*"]
            description: PoR feed
          - name: block
            type: string
            intents: ["*"]
            description: Block tag
          - name: rpc
            type: string
            intents: ["*"]
            description: Preferred RPC alias

input_schema:
  type: object
  required: [feed, block, rpc]
  properties:
    feed: {type: string, description: "PoR feed", default: "0xa81FE04086865e63E12dD3776978E49DEEa2ea4e"}
    block: {type: string, description: "Block tag", default: "latest"}
    rpc: {type: string, description: "Preferred RPC alias", default: "merkle"}

semantics:
  signal_mapping:
    label_field: attested_reserve
  supported_intents:
    - ASSET_RESERVE_ATTESTATION

on_chain:
  description: Stores signal for ASSET_RESERVE_ATTESTATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

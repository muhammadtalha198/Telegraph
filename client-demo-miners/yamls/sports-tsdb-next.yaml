version: "1"
kind: miner
id: 44009
slug: sports-tsdb-next
protocol: generic
name: TheSportsDB Next League Events
description: >
  TheSportsDB next league events. Intent SPORTS_SCORE.

base_url: https://www.thesportsdb.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.thesportsdb.com/api.php
  website: https://www.thesportsdb.com/

endpoints:
  - path: /query
    external_path: /api/v1/json/3/eventsnextleague.php
    method: GET
    description: Query for intent SPORTS_SCORE via TheSportsDB Next League Events.
    intents: [SPORTS_SCORE]
    params:
      query:
        required:
          - name: id
            type: string
            intents: ["*"]
            description: League id

input_schema:
  type: object
  required: [id]
  properties:
    id: {type: string, description: League id, default: "4328"}

semantics:
  signal_mapping:
    label_field: events
  supported_intents:
    - SPORTS_SCORE

on_chain:
  description: Stores signal for SPORTS_SCORE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

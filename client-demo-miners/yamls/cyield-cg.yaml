version: "1"
kind: miner
id: 141003
slug: cyield-cg
protocol: generic
name: CoinGecko Yield Price
description: >
  CoinGecko price yield context. Intent CRYPTO_YIELD_RATE.

base_url: https://api.coingecko.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.coingecko.com/en/api
  website: https://www.coingecko.com

endpoints:
  - path: /query
    external_path: /api/v3/simple/price
    method: GET
    description: Query for intent CRYPTO_YIELD_RATE via CoinGecko Yield Price.
    intents: [CRYPTO_YIELD_RATE]
    params:
      query:
        required:
          - name: ids
            type: string
            intents: ["*"]
            description: Ids
          - name: vs_currencies
            type: string
            intents: ["*"]
            description: VS

input_schema:
  type: object
  required: [ids, vs_currencies]
  properties:
    ids: {type: string, description: Ids, default: "lido-dao"}
    vs_currencies: {type: string, description: VS, default: "usd"}

semantics:
  signal_mapping:
    label_field: lido-dao
  supported_intents:
    - CRYPTO_YIELD_RATE

on_chain:
  description: Stores signal for CRYPTO_YIELD_RATE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


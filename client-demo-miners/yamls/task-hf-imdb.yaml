version: "1"
kind: miner
id: 62002
slug: task-hf-imdb
protocol: generic
name: HF IMDB Dataset Rows
description: >
  Hugging Face labeled IMDB rows as gold rubric sample. Intent TASK_EXECUTION_QUALITY.

base_url: https://datasets-server.huggingface.co

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://huggingface.co/docs/datasets-server
  website: https://huggingface.co/

endpoints:
  - path: /query
    external_path: /rows
    method: GET
    description: Query for intent TASK_EXECUTION_QUALITY via HF IMDB Dataset Rows.
    intents: [TASK_EXECUTION_QUALITY]
    params:
      query:
        required:
          - name: dataset
            type: string
            intents: ["*"]
            description: Dataset
          - name: config
            type: string
            intents: ["*"]
            description: Config
          - name: split
            type: string
            intents: ["*"]
            description: Split
          - name: offset
            type: string
            intents: ["*"]
            description: Offset
          - name: length
            type: string
            intents: ["*"]
            description: Length

input_schema:
  type: object
  required: [dataset, config, split, offset, length]
  properties:
    dataset: {type: string, description: Dataset, default: "stanfordnlp/imdb"}
    config: {type: string, description: Config, default: "plain_text"}
    split: {type: string, description: Split, default: "test"}
    offset: {type: string, description: Offset, default: "0"}
    length: {type: string, description: Length, default: "1"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - TASK_EXECUTION_QUALITY

on_chain:
  description: Stores signal for TASK_EXECUTION_QUALITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

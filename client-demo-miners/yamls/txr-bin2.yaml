version: "1"
kind: miner
id: 104002
slug: txr-bin2
protocol: generic
name: Binlist Tx Risk MC
description: >
  Mastercard BIN transaction risk. Intent TRANSACTION_RISK.

base_url: https://lookup.binlist.net

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://binlist.net/
  website: https://binlist.net

endpoints:
  - path: /query
    external_path: /555555
    method: GET
    description: Query for intent TRANSACTION_RISK via Binlist Tx Risk MC.
    intents: [TRANSACTION_RISK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: scheme
  supported_intents:
    - TRANSACTION_RISK

on_chain:
  description: Stores signal for TRANSACTION_RISK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 112008
slug: ret-uk-leg
protocol: generic
name: UK Legislation Feed
description: >
  UK legislation feed policy changes. Intent RETURN_POLICY_VERIFY.

base_url: https://www.legislation.gov.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.legislation.gov.uk/developer
  website: https://www.legislation.gov.uk

endpoints:
  - path: /query
    external_path: /new/data.feed
    method: GET
    description: Query for intent RETURN_POLICY_VERIFY via UK Legislation Feed.
    intents: [RETURN_POLICY_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: feed
  supported_intents:
    - RETURN_POLICY_VERIFY

on_chain:
  description: Stores signal for RETURN_POLICY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


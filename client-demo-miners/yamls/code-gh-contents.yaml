version: "1"
kind: miner
id: 60006
slug: code-gh-contents
protocol: generic
name: GitHub File Contents
description: >
  GitHub file contents for code review. Intent CODE_REVIEW.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest/repos/contents
  website: https://github.com/

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/contents/{path}
    method: GET
    description: Query for intent CODE_REVIEW via GitHub File Contents.
    intents: [CODE_REVIEW]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Repo owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo name
          - name: path
            type: string
            intents: ["*"]
            description: File path

input_schema:
  type: object
  required: [owner, repo, path]
  properties:
    owner: {type: string, description: Repo owner, default: "facebook"}
    repo: {type: string, description: Repo name, default: "react"}
    path: {type: string, description: File path, default: "README.md"}

semantics:
  signal_mapping:
    label_field: name
  supported_intents:
    - CODE_REVIEW

on_chain:
  description: Stores signal for CODE_REVIEW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

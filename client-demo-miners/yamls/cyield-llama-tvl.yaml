version: "1"
kind: miner
id: 141007
slug: cyield-llama-tvl
protocol: generic
name: DefiLlama Protocol TVL
description: >
  DefiLlama protocol TVL yield context. Intent CRYPTO_YIELD_RATE.

base_url: https://api.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://defillama.com/docs/api
  website: https://defillama.com

endpoints:
  - path: /query
    external_path: /protocols
    method: GET
    description: Query for intent CRYPTO_YIELD_RATE via DefiLlama Protocol TVL.
    intents: [CRYPTO_YIELD_RATE]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - CRYPTO_YIELD_RATE

on_chain:
  description: Stores signal for CRYPTO_YIELD_RATE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


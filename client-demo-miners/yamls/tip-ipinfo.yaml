version: "1"
kind: miner
id: 153005
slug: tip-ipinfo
protocol: generic
name: IPinfo Reputation
description: >
  IPinfo reputation geo. Intent THREAT_IP_REPUTATION.

base_url: https://ipinfo.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ipinfo.io/developers
  website: https://ipinfo.io

endpoints:
  - path: /query
    external_path: /{ip}/json
    method: GET
    description: Query for intent THREAT_IP_REPUTATION via IPinfo Reputation.
    intents: [THREAT_IP_REPUTATION]
    params:
      path:
        required:
          - name: ip
            type: string
            intents: ["*"]
            description: IP

input_schema:
  type: object
  required: [ip]
  properties:
    ip: {type: string, description: IP, default: "1.0.0.1"}

semantics:
  signal_mapping:
    label_field: country
  supported_intents:
    - THREAT_IP_REPUTATION

on_chain:
  description: Stores signal for THREAT_IP_REPUTATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


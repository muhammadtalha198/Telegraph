version: "1"
kind: miner
id: 70007
slug: fin-stablecoins
protocol: generic
name: DefiLlama Stablecoins
description: >
  DefiLlama stablecoins market data. Intent FINANCIAL_DATA.

base_url: https://stablecoins.llama.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://stablecoins.llama.fi/
  website: https://defillama.com/

endpoints:
  - path: /query
    external_path: /stablecoins
    method: GET
    description: Query for intent FINANCIAL_DATA via DefiLlama Stablecoins.
    intents: [FINANCIAL_DATA]
    params:
      query:
        required:
          - name: includePrices
            type: string
            intents: ["*"]
            description: Include prices

input_schema:
  type: object
  required: [includePrices]
  properties:
    includePrices: {type: string, description: Include prices, default: "true"}

semantics:
  signal_mapping:
    label_field: peggedAssets
  supported_intents:
    - FINANCIAL_DATA

on_chain:
  description: Stores signal for FINANCIAL_DATA.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 82008
slug: trav-adsb
protocol: generic
name: ADSB.lol Nearby Traffic
description: >
  adsb.lol nearby aircraft traffic. Intent TRAVEL_DISRUPTION.

base_url: https://api.adsb.lol

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.adsb.lol/
  website: https://adsb.lol

endpoints:
  - path: /query
    external_path: /v2/lat/{lat}/lon/{lon}/dist/{dist}
    method: GET
    description: Query for intent TRAVEL_DISRUPTION via ADSB.lol Nearby Traffic.
    intents: [TRAVEL_DISRUPTION]
    params:
      path:
        required:
          - name: lat
            type: string
            intents: ["*"]
            description: Latitude
          - name: lon
            type: string
            intents: ["*"]
            description: Longitude
          - name: dist
            type: string
            intents: ["*"]
            description: Distance nm

input_schema:
  type: object
  required: [lat, lon, dist]
  properties:
    lat: {type: string, description: Latitude, default: "25.76"}
    lon: {type: string, description: Longitude, default: "-80.19"}
    dist: {type: string, description: Distance nm, default: "50"}

semantics:
  signal_mapping:
    label_field: ac
  supported_intents:
    - TRAVEL_DISRUPTION

on_chain:
  description: Stores signal for TRAVEL_DISRUPTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


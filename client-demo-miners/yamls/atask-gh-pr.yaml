version: "1"
kind: miner
id: 132005
slug: atask-gh-pr
protocol: generic
name: GitHub PR Task
description: >
  GitHub pulls agent task. Intent AGENT_TASK.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest
  website: https://github.com

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}/pulls
    method: GET
    description: Query for intent AGENT_TASK via GitHub PR Task.
    intents: [AGENT_TASK]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: Per page
          - name: state
            type: string
            intents: ["*"]
            description: State

input_schema:
  type: object
  required: [owner, repo, per_page, state]
  properties:
    owner: {type: string, description: Owner, default: "vercel"}
    repo: {type: string, description: Repo, default: "next.js"}
    per_page: {type: string, description: Per page, default: "1"}
    state: {type: string, description: State, default: "open"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - AGENT_TASK

on_chain:
  description: Stores signal for AGENT_TASK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


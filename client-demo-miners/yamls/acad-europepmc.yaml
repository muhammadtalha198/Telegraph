version: "1"
kind: miner
id: 48006
slug: acad-europepmc
protocol: generic
name: Europe PMC Search
description: >
  Europe PMC literature search. Intent ACADEMIC_SEARCH.

base_url: https://www.ebi.ac.uk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://europepmc.org/RestfulWebService
  website: https://europepmc.org/

endpoints:
  - path: /query
    external_path: /europepmc/webservices/rest/search
    method: GET
    description: Query for intent ACADEMIC_SEARCH via Europe PMC Search.
    intents: [ACADEMIC_SEARCH]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query
          - name: format
            type: string
            intents: ["*"]
            description: json
          - name: pageSize
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [query, format, pageSize]
  properties:
    query: {type: string, description: Query, default: "bitcoin"}
    format: {type: string, description: Format, default: "json"}
    pageSize: {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: resultList
  supported_intents:
    - ACADEMIC_SEARCH

on_chain:
  description: Stores signal for ACADEMIC_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

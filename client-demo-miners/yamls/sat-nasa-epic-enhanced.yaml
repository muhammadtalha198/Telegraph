version: "1"
kind: miner
id: 68010
slug: sat-nasa-epic-enhanced
protocol: generic
name: NASA EPIC Enhanced
description: >
  NASA EPIC enhanced imagery metadata. Intent SATELLITE_IMAGERY_ANALYSIS.

base_url: https://epic.gsfc.nasa.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://epic.gsfc.nasa.gov/about/api
  website: https://epic.gsfc.nasa.gov/

endpoints:
  - path: /query
    external_path: /api/enhanced
    method: GET
    description: Query for intent SATELLITE_IMAGERY_ANALYSIS via NASA EPIC Enhanced.
    intents: [SATELLITE_IMAGERY_ANALYSIS]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - SATELLITE_IMAGERY_ANALYSIS

on_chain:
  description: Stores signal for SATELLITE_IMAGERY_ANALYSIS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 83008
slug: prod-off-v0
protocol: generic
name: Open Food Facts V0 Product
description: >
  Open Food Facts v0 product API. Intent PRODUCT_AUTHENTICITY.

base_url: https://world.openfoodfacts.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://openfoodfacts.github.io/openfoodfacts-server/api/
  website: https://world.openfoodfacts.org

endpoints:
  - path: /query
    external_path: /api/v0/product/{code}.json
    method: GET
    description: Query for intent PRODUCT_AUTHENTICITY via Open Food Facts V0 Product.
    intents: [PRODUCT_AUTHENTICITY]
    params:
      path:
        required:
          - name: code
            type: string
            intents: ["*"]
            description: Barcode

input_schema:
  type: object
  required: [code]
  properties:
    code: {type: string, description: Barcode, default: "737628064502"}

semantics:
  signal_mapping:
    label_field: product
  supported_intents:
    - PRODUCT_AUTHENTICITY

on_chain:
  description: Stores signal for PRODUCT_AUTHENTICITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


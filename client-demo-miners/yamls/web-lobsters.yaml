version: "1"
kind: miner
id: 49006
slug: web-lobsters
protocol: generic
name: Lobsters Hottest Search
description: >
  Lobsters hottest JSON. Intent WEB_SEARCH.

base_url: https://lobste.rs

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://lobste.rs/about
  website: https://lobste.rs/

endpoints:
  - path: /query
    external_path: /hottest.json
    method: GET
    description: Query for intent WEB_SEARCH via Lobsters Hottest Search.
    intents: [WEB_SEARCH]


input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - WEB_SEARCH

on_chain:
  description: Stores signal for WEB_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

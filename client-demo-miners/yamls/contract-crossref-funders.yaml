version: "1"
kind: miner
id: 64010
slug: contract-crossref-funders
protocol: generic
name: Crossref Funders
description: >
  Crossref funders for obligation/funding parties. Intent CONTRACT_OBLIGATION_AUDIT.

base_url: https://api.crossref.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
  website: https://www.crossref.org/

endpoints:
  - path: /query
    external_path: /funders
    method: GET
    description: Query for intent CONTRACT_OBLIGATION_AUDIT via Crossref Funders.
    intents: [CONTRACT_OBLIGATION_AUDIT]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query
          - name: rows
            type: string
            intents: ["*"]
            description: Rows

input_schema:
  type: object
  required: [query, rows]
  properties:
    query: {type: string, description: Query, default: "foundation"}
    rows: {type: string, description: Rows, default: "1"}

semantics:
  signal_mapping:
    label_field: message
  supported_intents:
    - CONTRACT_OBLIGATION_AUDIT

on_chain:
  description: Stores signal for CONTRACT_OBLIGATION_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

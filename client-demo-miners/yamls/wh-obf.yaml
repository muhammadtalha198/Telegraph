version: "1"
kind: miner
id: 119002
slug: wh-obf
protocol: generic
name: Open Beauty Warehouse
description: >
  Open Beauty Facts warehouse search. Intent WAREHOUSE_INVENTORY.

base_url: https://world.openbeautyfacts.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://world.openbeautyfacts.org/data
  website: https://world.openbeautyfacts.org

endpoints:
  - path: /query
    external_path: /cgi/search.pl
    method: GET
    description: Query for intent WAREHOUSE_INVENTORY via Open Beauty Warehouse.
    intents: [WAREHOUSE_INVENTORY]
    params:
      query:
        required:
          - name: search_terms
            type: string
            intents: ["*"]
            description: Search
          - name: json
            type: string
            intents: ["*"]
            description: JSON
          - name: page_size
            type: string
            intents: ["*"]
            description: Size

input_schema:
  type: object
  required: [search_terms, json, page_size]
  properties:
    search_terms: {type: string, description: Search, default: "cream"}
    json: {type: string, description: JSON, default: "1"}
    page_size: {type: string, description: Size, default: "1"}

semantics:
  signal_mapping:
    label_field: products
  supported_intents:
    - WAREHOUSE_INVENTORY

on_chain:
  description: Stores signal for WAREHOUSE_INVENTORY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 82007
slug: trav-adsb-reg
protocol: generic
name: ADSB.lol Aircraft Reg
description: >
  adsb.lol lookup by aircraft registration. Intent TRAVEL_DISRUPTION.

base_url: https://api.adsb.lol

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.adsb.lol/
  website: https://adsb.lol

endpoints:
  - path: /query
    external_path: /v2/reg/{reg}
    method: GET
    description: Query for intent TRAVEL_DISRUPTION via ADSB.lol Aircraft Reg.
    intents: [TRAVEL_DISRUPTION]
    params:
      path:
        required:
          - name: reg
            type: string
            intents: ["*"]
            description: Registration

input_schema:
  type: object
  required: [reg]
  properties:
    reg: {type: string, description: Registration, default: "N253A"}

semantics:
  signal_mapping:
    label_field: ac
  supported_intents:
    - TRAVEL_DISRUPTION

on_chain:
  description: Stores signal for TRAVEL_DISRUPTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


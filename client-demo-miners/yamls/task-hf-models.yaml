version: "1"
kind: miner
id: 62003
slug: task-hf-models
protocol: generic
name: HF Model Search
description: >
  Hugging Face model cards for eval tooling. Intent TASK_EXECUTION_QUALITY.

base_url: https://huggingface.co

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://huggingface.co/docs/hub/api
  website: https://huggingface.co/

endpoints:
  - path: /query
    external_path: /api/models
    method: GET
    description: Query for intent TASK_EXECUTION_QUALITY via HF Model Search.
    intents: [TASK_EXECUTION_QUALITY]
    params:
      query:
        required:
          - name: search
            type: string
            intents: ["*"]
            description: Search
          - name: limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [search, limit]
  properties:
    search: {type: string, description: Search, default: "bert"}
    limit: {type: string, description: Limit, default: "1"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - TASK_EXECUTION_QUALITY

on_chain:
  description: Stores signal for TASK_EXECUTION_QUALITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

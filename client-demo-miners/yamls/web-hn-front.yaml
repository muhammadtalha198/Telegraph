version: "1"
kind: miner
id: 49001
slug: web-hn-front
protocol: generic
name: HN Front Page Search
description: >
  Algolia HN front_page. Intent WEB_SEARCH.

base_url: https://hn.algolia.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://hn.algolia.com/api
  website: https://hn.algolia.com/

endpoints:
  - path: /query
    external_path: /api/v1/search
    method: GET
    description: Query for intent WEB_SEARCH via HN Front Page Search.
    intents: [WEB_SEARCH]
    params:
      query:
        required:
          - name: tags
            type: string
            intents: ["*"]
            description: front_page

input_schema:
  type: object
  required: [tags]
  properties:
    tags: {type: string, description: Tags, default: "front_page"}

semantics:
  signal_mapping:
    label_field: hits
  supported_intents:
    - WEB_SEARCH

on_chain:
  description: Stores signal for WEB_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

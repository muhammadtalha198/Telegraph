version: "1"
kind: miner
id: 139007
slug: cloud-gh-repo
protocol: generic
name: GitHub Repo Cloud
description: >
  GitHub repo cloud resource meta. Intent CLOUD_RESOURCE_USAGE.

base_url: https://api.github.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.github.com/en/rest
  website: https://github.com

endpoints:
  - path: /query
    external_path: /repos/{owner}/{repo}
    method: GET
    description: Query for intent CLOUD_RESOURCE_USAGE via GitHub Repo Cloud.
    intents: [CLOUD_RESOURCE_USAGE]
    params:
      path:
        required:
          - name: owner
            type: string
            intents: ["*"]
            description: Owner
          - name: repo
            type: string
            intents: ["*"]
            description: Repo

input_schema:
  type: object
  required: [owner, repo]
  properties:
    owner: {type: string, description: Owner, default: "vercel"}
    repo: {type: string, description: Repo, default: "next.js"}

semantics:
  signal_mapping:
    label_field: full_name
  supported_intents:
    - CLOUD_RESOURCE_USAGE

on_chain:
  description: Stores signal for CLOUD_RESOURCE_USAGE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


version: "1"
kind: miner
id: 85003
slug: val-rocket-apr
protocol: generic
name: Rocket Pool APR
description: >
  Rocket Pool network yearly APR. Intent VALIDATOR_PERFORMANCE_VERIFY.

base_url: https://api.rocketpool.net

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.rocketpool.net/
  website: https://rocketpool.net

endpoints:
  - path: /query
    external_path: /api/apr
    method: GET
    description: Query for intent VALIDATOR_PERFORMANCE_VERIFY via Rocket Pool APR.
    intents: [VALIDATOR_PERFORMANCE_VERIFY]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: yearlyAPR
  supported_intents:
    - VALIDATOR_PERFORMANCE_VERIFY

on_chain:
  description: Stores signal for VALIDATOR_PERFORMANCE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


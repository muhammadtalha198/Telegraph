version: "1"
kind: miner
id: 48009
slug: acad-datacite
protocol: generic
name: DataCite DOIs Search
description: >
  DataCite DOI search. Intent ACADEMIC_SEARCH.

base_url: https://api.datacite.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://support.datacite.org/docs/api
  website: https://datacite.org/

endpoints:
  - path: /query
    external_path: /dois
    method: GET
    description: Query for intent ACADEMIC_SEARCH via DataCite DOIs Search.
    intents: [ACADEMIC_SEARCH]
    params:
      query:
        required:
          - name: query
            type: string
            intents: ["*"]
            description: Query
          - name: page[size]
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [query, "page[size]"]
  properties:
    query: {type: string, description: Query, default: "bitcoin"}
    "page[size]": {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - ACADEMIC_SEARCH

on_chain:
  description: Stores signal for ACADEMIC_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

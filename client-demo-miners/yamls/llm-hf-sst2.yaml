version: "1"
kind: miner
id: 63005
slug: llm-hf-sst2
protocol: generic
name: HF GLUE-like Rows
description: >
  HF dataset rows usable as eval gold labels. Intent LLM_OUTPUT_EVALUATION.

base_url: https://datasets-server.huggingface.co

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://huggingface.co/docs/datasets-server
  website: https://huggingface.co/

endpoints:
  - path: /query
    external_path: /rows
    method: GET
    description: Query for intent LLM_OUTPUT_EVALUATION via HF GLUE-like Rows.
    intents: [LLM_OUTPUT_EVALUATION]
    params:
      query:
        required:
          - name: dataset
            type: string
            intents: ["*"]
            description: Dataset
          - name: config
            type: string
            intents: ["*"]
            description: Config
          - name: split
            type: string
            intents: ["*"]
            description: Split
          - name: offset
            type: string
            intents: ["*"]
            description: Offset
          - name: length
            type: string
            intents: ["*"]
            description: Length

input_schema:
  type: object
  required: [dataset, config, split, offset, length]
  properties:
    dataset: {type: string, description: Dataset, default: "stanfordnlp/imdb"}
    config: {type: string, description: Config, default: "plain_text"}
    split: {type: string, description: Split, default: "test"}
    offset: {type: string, description: Offset, default: "0"}
    length: {type: string, description: Length, default: "1"}

semantics:
  signal_mapping:
    label_field: rows
  supported_intents:
    - LLM_OUTPUT_EVALUATION

on_chain:
  description: Stores signal for LLM_OUTPUT_EVALUATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

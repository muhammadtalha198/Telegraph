version: "1"
kind: miner
id: 48007
slug: acad-pubmed
protocol: generic
name: PubMed ESearch
description: >
  NCBI PubMed esearch. Intent ACADEMIC_SEARCH.

base_url: https://eutils.ncbi.nlm.nih.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.ncbi.nlm.nih.gov/books/NBK25501/
  website: https://pubmed.ncbi.nlm.nih.gov/

endpoints:
  - path: /query
    external_path: /entrez/eutils/esearch.fcgi
    method: GET
    description: Query for intent ACADEMIC_SEARCH via PubMed ESearch.
    intents: [ACADEMIC_SEARCH]
    params:
      query:
        required:
          - name: db
            type: string
            intents: ["*"]
            description: pubmed
          - name: term
            type: string
            intents: ["*"]
            description: Search term
          - name: retmode
            type: string
            intents: ["*"]
            description: json
          - name: retmax
            type: string
            intents: ["*"]
            description: Max results

input_schema:
  type: object
  required: [db, term, retmode, retmax]
  properties:
    db: {type: string, description: Database, default: "pubmed"}
    term: {type: string, description: Term, default: "covid"}
    retmode: {type: string, description: Mode, default: "json"}
    retmax: {type: string, description: Max, default: "1"}

semantics:
  signal_mapping:
    label_field: esearchresult
  supported_intents:
    - ACADEMIC_SEARCH

on_chain:
  description: Stores signal for ACADEMIC_SEARCH.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 44002
slug: sports-nhl-score
protocol: generic
name: NHL Score Now
description: >
  NHL score/now endpoint. Intent SPORTS_SCORE.

base_url: https://api-web.nhle.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://gitlab.com/dword4/nhlapi
  website: https://www.nhl.com/

endpoints:
  - path: /query
    external_path: /v1/score/now
    method: GET
    description: Query for intent SPORTS_SCORE via NHL Score Now.
    intents: [SPORTS_SCORE]


input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: gameWeek
  supported_intents:
    - SPORTS_SCORE

on_chain:
  description: Stores signal for SPORTS_SCORE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

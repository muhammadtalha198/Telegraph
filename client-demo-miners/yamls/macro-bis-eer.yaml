version: "1"
kind: miner
id: 39010
slug: macro-bis-eer
protocol: generic
name: BIS Effective Exchange Rate
description: >
  BIS effective exchange rate series. Intent MACRO_ECONOMIC_INDICATOR.

base_url: https://stats.bis.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://data.bis.org/
  website: https://www.bis.org/

endpoints:
  - path: /query
    external_path: /api/v2/data/dataflow/BIS/WS_EER/1.0/D.N.B.US
    method: GET
    description: Query for intent MACRO_ECONOMIC_INDICATOR via BIS Effective Exchange Rate.
    intents: [MACRO_ECONOMIC_INDICATOR]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: sdmx-json
          - name: detail
            type: string
            intents: ["*"]
            description: dataonly
          - name: lastNObservations
            type: string
            intents: ["*"]
            description: N

input_schema:
  type: object
  required: [format, detail, lastNObservations]
  properties:
    format: {type: string, description: Format, default: "sdmx-json"}
    detail: {type: string, description: Detail, default: "dataonly"}
    lastNObservations: {type: string, description: N, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - MACRO_ECONOMIC_INDICATOR

on_chain:
  description: Stores signal for MACRO_ECONOMIC_INDICATOR.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

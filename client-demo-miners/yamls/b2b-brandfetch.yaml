version: "1"
kind: miner
id: 95003
slug: b2b-brandfetch
protocol: generic
name: Brandfetch Search
description: >
  Brandfetch company brand identity search. Intent B2B_IDENTITY_ENRICHMENT.

base_url: https://api.brandfetch.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.brandfetch.com/
  website: https://brandfetch.com

endpoints:
  - path: /query
    external_path: /v2/search/{q}
    method: GET
    description: Query for intent B2B_IDENTITY_ENRICHMENT via Brandfetch Search.
    intents: [B2B_IDENTITY_ENRICHMENT]
    params:
      path:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query

input_schema:
  type: object
  required: [q]
  properties:
    q: {type: string, description: Query, default: "stripe"}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - B2B_IDENTITY_ENRICHMENT

on_chain:
  description: Stores signal for B2B_IDENTITY_ENRICHMENT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


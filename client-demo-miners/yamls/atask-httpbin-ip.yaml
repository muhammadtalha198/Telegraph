version: "1"
kind: miner
id: 132009
slug: atask-httpbin-ip
protocol: generic
name: HTTPBin IP Task
description: >
  HTTPBin origin IP agent task. Intent AGENT_TASK.

base_url: https://httpbin.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://httpbin.org/
  website: https://httpbin.org

endpoints:
  - path: /query
    external_path: /ip
    method: GET
    description: Query for intent AGENT_TASK via HTTPBin IP Task.
    intents: [AGENT_TASK]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: origin
  supported_intents:
    - AGENT_TASK

on_chain:
  description: Stores signal for AGENT_TASK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


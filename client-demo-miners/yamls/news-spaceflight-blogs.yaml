version: "1"
kind: miner
id: 42007
slug: news-spaceflight-blogs
protocol: generic
name: Spaceflight News Blogs
description: >
  Spaceflight News blogs feed. Intent NEWS_HEADLINES.

base_url: https://api.spaceflightnewsapi.net

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://spaceflightnewsapi.net/
  website: https://spaceflightnewsapi.net/

endpoints:
  - path: /query
    external_path: /v4/blogs/
    method: GET
    description: Query for intent NEWS_HEADLINES via Spaceflight News Blogs.
    intents: [NEWS_HEADLINES]
    params:
      query:
        required:
          - name: limit
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: [limit]
  properties:
    limit: {type: string, description: Limit, default: "3"}

semantics:
  signal_mapping:
    label_field: results
  supported_intents:
    - NEWS_HEADLINES

on_chain:
  description: Stores signal for NEWS_HEADLINES.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

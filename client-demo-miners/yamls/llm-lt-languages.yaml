version: "1"
kind: miner
id: 63008
slug: llm-lt-languages
protocol: generic
name: LanguageTool Langs
description: >
  LanguageTool languages for output quality checks. Intent LLM_OUTPUT_EVALUATION.

base_url: https://api.languagetool.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://languagetool.org/http-api/
  website: https://languagetool.org/

endpoints:
  - path: /query
    external_path: /v2/languages
    method: GET
    description: Query for intent LLM_OUTPUT_EVALUATION via LanguageTool Langs.
    intents: [LLM_OUTPUT_EVALUATION]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: "0"
  supported_intents:
    - LLM_OUTPUT_EVALUATION

on_chain:
  description: Stores signal for LLM_OUTPUT_EVALUATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

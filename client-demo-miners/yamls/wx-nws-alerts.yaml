version: "1"
kind: miner
id: 33008
slug: wx-nws-alerts
protocol: generic
name: NWS Alerts Weather Check
description: >
  US NWS active alerts for a point. Intent WEATHER_CHECK. Direct Request shows point (lat,lon).

base_url: https://api.weather.gov

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.weather.gov/documentation/services-web-api
  website: https://www.weather.gov/

endpoints:
  - path: /query
    external_path: /alerts/active
    method: GET
    description: Current weather for intent WEATHER_CHECK via NWS Alerts Weather Check.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: point
            type: string
            intents: ["*"]
            description: lat,lon point e.g. 25.7617,-80.1918

input_schema:
  type: object
  required: [point]
  properties:
    point:
      type: string
      description: Latitude,longitude
      default: "25.7617,-80.1918"

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores weather signal for WEATHER_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result label
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

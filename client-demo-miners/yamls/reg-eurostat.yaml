version: "1"
kind: miner
id: 84008
slug: reg-eurostat
protocol: generic
name: Eurostat GDP Dataset
description: >
  Eurostat GDP dissemination dataset. Intent REGULATORY_FILING_MONITOR.

base_url: https://ec.europa.eu

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access
  website: https://ec.europa.eu/eurostat

endpoints:
  - path: /query
    external_path: /eurostat/api/dissemination/statistics/1.0/data/nama_10_gdp
    method: GET
    description: Query for intent REGULATORY_FILING_MONITOR via Eurostat GDP Dataset.
    intents: [REGULATORY_FILING_MONITOR]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: Format
          - name: lang
            type: string
            intents: ["*"]
            description: Lang
          - name: geo
            type: string
            intents: ["*"]
            description: Geo
          - name: unit
            type: string
            intents: ["*"]
            description: Unit
          - name: na_item
            type: string
            intents: ["*"]
            description: NA item
          - name: time
            type: string
            intents: ["*"]
            description: Time

input_schema:
  type: object
  required: [format, lang, geo, unit, na_item, time]
  properties:
    format: {type: string, description: Format, default: "JSON"}
    lang: {type: string, description: Lang, default: "en"}
    geo: {type: string, description: Geo, default: "DE"}
    unit: {type: string, description: Unit, default: "CP_MEUR"}
    na_item: {type: string, description: NA item, default: "B1GQ"}
    time: {type: string, description: Time, default: "2022"}

semantics:
  signal_mapping:
    label_field: value
  supported_intents:
    - REGULATORY_FILING_MONITOR

on_chain:
  description: Stores signal for REGULATORY_FILING_MONITOR.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


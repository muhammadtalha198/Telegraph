version: "1"
kind: miner
id: 87009
slug: ven-gleif-page
protocol: generic
name: GLEIF LEI Page
description: >
  GLEIF LEI records first page. Intent VENDOR_VERIFY.

base_url: https://api.gleif.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.gleif.org/en/lei-data/gleif-api
  website: https://www.gleif.org

endpoints:
  - path: /query
    external_path: /api/v1/lei-records
    method: GET
    description: Query for intent VENDOR_VERIFY via GLEIF LEI Page.
    intents: [VENDOR_VERIFY]
    params:
      query:
        required:
          - name: page[size]
            type: string
            intents: ["*"]
            description: Page size

input_schema:
  type: object
  required: ["page[size]"]
  properties:
    "page[size]": {type: string, description: Page size, default: "1"}

semantics:
  signal_mapping:
    label_field: data
  supported_intents:
    - VENDOR_VERIFY

on_chain:
  description: Stores signal for VENDOR_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


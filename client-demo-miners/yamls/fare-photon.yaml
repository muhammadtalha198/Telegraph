version: "1"
kind: miner
id: 117008
slug: fare-photon
protocol: generic
name: Photon Fare Hub
description: >
  Photon geocode fare origin/destination. Intent FARE_RULE_VERIFY.

base_url: https://photon.komoot.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/komoot/photon
  website: https://photon.komoot.io

endpoints:
  - path: /query
    external_path: /api/
    method: GET
    description: Query for intent FARE_RULE_VERIFY via Photon Fare Hub.
    intents: [FARE_RULE_VERIFY]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query
          - name: limit
            type: string
            intents: ["*"]
            description: Limit

input_schema:
  type: object
  required: [q, limit]
  properties:
    q: {type: string, description: Query, default: "airport helsinki"}
    limit: {type: string, description: Limit, default: "1"}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - FARE_RULE_VERIFY

on_chain:
  description: Stores signal for FARE_RULE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


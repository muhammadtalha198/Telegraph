version: "1"
kind: miner
id: 113003
slug: pkg-digit-ais
protocol: generic
name: Digitraffic AIS Package
description: >
  AIS locations cargo movement status. Intent PACKAGE_STATUS.

base_url: https://meri.digitraffic.fi

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/marine-traffic/
  website: https://www.digitraffic.fi

endpoints:
  - path: /query
    external_path: /api/ais/v1/locations
    method: GET
    description: Query for intent PACKAGE_STATUS via Digitraffic AIS Package.
    intents: [PACKAGE_STATUS]

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: features
  supported_intents:
    - PACKAGE_STATUS

on_chain:
  description: Stores signal for PACKAGE_STATUS.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


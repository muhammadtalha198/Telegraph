version: "1"
kind: miner
id: 158004
slug: emb-zenodo
protocol: generic
name: Zenodo Embeddings
description: >
  Zenodo embedding datasets. Intent EMBEDDING_GENERATION.

base_url: https://zenodo.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.zenodo.org/
  website: https://zenodo.org

endpoints:
  - path: /query
    external_path: /api/records
    method: GET
    description: Query for intent EMBEDDING_GENERATION via Zenodo Embeddings.
    intents: [EMBEDDING_GENERATION]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: Query
          - name: size
            type: string
            intents: ["*"]
            description: Size

input_schema:
  type: object
  required: [q, size]
  properties:
    q: {type: string, description: Query, default: "embeddings"}
    size: {type: string, description: Size, default: "1"}

semantics:
  signal_mapping:
    label_field: hits
  supported_intents:
    - EMBEDDING_GENERATION

on_chain:
  description: Stores signal for EMBEDDING_GENERATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok


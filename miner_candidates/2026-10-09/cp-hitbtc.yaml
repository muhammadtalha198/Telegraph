version: "1"
kind: miner
id: 190204
slug: cp-hitbtc
protocol: generic
name: "Cp Hitbtc"
description: "Semantic V2 miner for CRYPTO_PRICE via HitBTC public ticker (USDT). Pair baked in path."

base_url: https://api.hitbtc.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.hitbtc.com/
  website: https://api.hitbtc.com

endpoints:
  - path: /query
    external_path: /api/3/public/ticker/BTCUSDT
    method: GET
    description: Query for intent CRYPTO_PRICE via Cp Hitbtc.
    intents: [CRYPTO_PRICE]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - CRYPTO_PRICE

on_chain:
  description: Stores signal for CRYPTO_PRICE (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

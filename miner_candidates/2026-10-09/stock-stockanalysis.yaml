version: "1"
kind: miner
id: 190208
slug: stock-stockanalysis
protocol: generic
name: "Stock Stockanalysis"
description: "Semantic V2 miner for STOCK_PRICE via stockanalysis.com quote (USD)."

base_url: https://stockanalysis.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://stockanalysis.com/
  website: https://stockanalysis.com

endpoints:
  - path: /query
    external_path: /api/quotes/s/{symbol}
    method: GET
    description: Query for intent STOCK_PRICE via Stock Stockanalysis.
    intents: [STOCK_PRICE]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: symbol

input_schema:
  type: object
  required: [symbol]
  properties:
    symbol: {type: string, description: "symbol", default: "AAPL"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - STOCK_PRICE

on_chain:
  description: Stores signal for STOCK_PRICE (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

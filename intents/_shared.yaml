#   deterministically. Qualifier after a comma matches country, country_code, admin1
#   or admin1_code ("Paris, TX", "Paris, Texas", "Paris, US").
# currencies: ISO 4217 codes, plus names/symbols. A list value = ambiguous; the user
#   is asked to be specific instead of us guessing.


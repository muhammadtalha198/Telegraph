version: "1"
kind: miner
id: 31001
slug: fx-frankfurter
protocol: generic
name: Frankfurter FX Now
description: >
  ECB mid-market FX via Frankfurter. Intent FX_NOW. Direct Request shows FX input fields in Alexandria.

base_url: https://api.frankfurter.app

auth:
  type: none

rate_limit_per_sec: 2
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.frankfurter.app/docs/
  website: https://www.frankfurter.app/

endpoints:
  - path: /query
    external_path: /latest
    method: GET
    description: FX mid-market rates for intent FX_NOW via Frankfurter FX Now.
    intents: [FX_NOW]
    params:
      query:
        required:
          - name: from
            type: string
            intents: ["*"]
            description: Base currency code (e.g. USD)
          - name: to
            type: string
            intents: ["*"]
            description: Quote currency codes, comma-separated (e.g. EUR)

input_schema:
  type: object
  required: [from, to]
  properties:
    from:
      type: string
      description: Base currency
      default: "USD"
    to:
      type: string
      description: Quote currencies
      default: "EUR"

semantics:
  signal_mapping:
    label_field: base
  supported_intents:
    - FX_NOW

on_chain:
  description: Stores FX signal for FX_NOW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: base
        description: Base currency
        source_path: base
      - index: 1
        name: date
        description: Rate date
        source_path: date
    integers:
      - index: 0
        name: eur_x10000
        description: EUR rate x10000
        source_path: rates.EUR
        multiplier: 10000

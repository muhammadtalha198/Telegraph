version: "1"
kind: miner
id: 31003
slug: fx-fawaz
protocol: generic
name: Fawaz Currency API FX Now
description: >
  Community currency-api via jsDelivr CDN. Intent FX_NOW. Direct Request shows FX input fields in Alexandria.

base_url: https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest

auth:
  type: none

rate_limit_per_sec: 2
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/fawazahmed0/currency-api
  website: https://github.com/fawazahmed0/currency-api

endpoints:
  - path: /query
    external_path: /v1/currencies/{base}.json
    method: GET
    description: FX mid-market rates for intent FX_NOW via Fawaz Currency API FX Now.
    intents: [FX_NOW]
    params:
      path:
        required:
          - name: base
            type: string
            intents: ["*"]
            description: Base currency lowercase (e.g. usd)

input_schema:
  type: object
  required: [base]
  properties:
    base:
      type: string
      description: Base currency (lowercase)
      default: "usd"

semantics:
  signal_mapping:
    label_field: date
  supported_intents:
    - FX_NOW

on_chain:
  description: Stores FX signal for FX_NOW.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: date
        description: Rate date
        source_path: date
    integers:
      - index: 0
        name: eur_x10000
        description: EUR per base x10000
        source_path: usd.eur
        multiplier: 10000

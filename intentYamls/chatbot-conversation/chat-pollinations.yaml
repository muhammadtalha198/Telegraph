version: "1"
kind: miner
id: 180301
slug: chat-pollinations
protocol: generic
name: Pollinations chatbot
description: >
  Pollinations chatbot -> reply_text for pinned q. Intent CHATBOT_CONVERSATION (NON-DETERMINISTIC / adapter). Venue `pollinations` is this miner\'s distinct chat engine. Shared pin must match peers.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/chat
    method: GET
    description: Query for intent CHATBOT_CONVERSATION via Pollinations chatbot.
    intents: [CHATBOT_CONVERSATION]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Bound chatbot engine id
          - name: q
            type: string
            intents: ["*"]
            description: User utterance

input_schema:
  type: object
  required: [q]
  properties:
    venue: {type: string, description: "Bound chatbot", default: "pollinations"}
    q: {type: string, description: "User utterance", default: "What is 2+2? Reply in one short full sentence."}

semantics:
  signal_mapping:
    label_field: reply_text
  supported_intents:
    - CHATBOT_CONVERSATION

on_chain:
  description: Stores signal for CHATBOT_CONVERSATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

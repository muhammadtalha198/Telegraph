version: "1"
kind: miner
id: 190148
slug: macro-eurostat
protocol: generic
name: "Macro Eurostat"
description: "Semantic V2 miner for MACRO_ECONOMIC_INDICATOR. Aggregates released central bank interest rates, consumer price index (CPI) updates, and unemployment figures. Capture pin answers: Must return the requested macro indicator value (unemployment / CPI / policy rate) for the country and period."

base_url: https://ec.europa.eu

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ec.europa.eu/
  website: https://ec.europa.eu

endpoints:
  - path: /query
    external_path: /eurostat/api/dissemination/statistics/1.0/data/une_rt_a
    method: GET
    description: Query for intent MACRO_ECONOMIC_INDICATOR via Macro Eurostat.
    intents: [MACRO_ECONOMIC_INDICATOR]
    params:
      query:
        required:
          - name: geo
            type: string
            intents: ["*"]
            description: geo
          - name: age
            type: string
            intents: ["*"]
            description: age
          - name: sex
            type: string
            intents: ["*"]
            description: sex
          - name: unit
            type: string
            intents: ["*"]
            description: unit
          - name: time
            type: string
            intents: ["*"]
            description: time

input_schema:
  type: object
  required: [geo, age, sex, unit, time]
  properties:
    geo: {type: string, description: "geo", default: "DE"}
    age: {type: string, description: "age", default: "Y15-74"}
    sex: {type: string, description: "sex", default: "T"}
    unit: {type: string, description: "unit", default: "PC_ACT"}
    time: {type: string, description: "time", default: "2019"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - MACRO_ECONOMIC_INDICATOR

on_chain:
  description: Stores signal for MACRO_ECONOMIC_INDICATOR (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

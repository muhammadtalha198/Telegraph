version: "1"
kind: miner
id: 190131
slug: grid-elering
protocol: generic
name: "Grid Elering"
description: "Semantic V2 miner for GRID_POWER_PRICE. Ingests real-time nodal marginal locational prices (LMP) and day-ahead electricity spot rates from regional grid operators. Capture pin answers: Must return current/day-ahead electricity spot prices for the grid region asked."

base_url: https://dashboard.elering.ee

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://dashboard.elering.ee/
  website: https://dashboard.elering.ee

endpoints:
  - path: /query
    external_path: /api/nps/price/EE/current
    method: GET
    description: Query for intent GRID_POWER_PRICE via Grid Elering.
    intents: [GRID_POWER_PRICE]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - GRID_POWER_PRICE

on_chain:
  description: Stores signal for GRID_POWER_PRICE (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

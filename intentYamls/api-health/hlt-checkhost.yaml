version: "1"
kind: miner
id: 170057
slug: hlt-checkhost
protocol: generic
name: check-host.net HTTP
description: >
  check-host.net HTTP -> http_status (HTTP status code seen by the probe).
  Intent API_HEALTH_CHECK - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://check-host.net/about/api
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/http-status
    method: GET
    description: Query for intent API_HEALTH_CHECK via check-host.net HTTP.
    intents: [API_HEALTH_CHECK]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Probe network id
          - name: url
            type: string
            intents: ["*"]
            description: URL to fetch

input_schema:
  type: object
  required: [venue, url]
  properties:
    venue: {type: string, description: "Probe network id", default: "checkhost"}
    url: {type: string, description: "URL to fetch", default: "https://example.com/"}

semantics:
  signal_mapping:
    label_field: http_status
  supported_intents:
    - API_HEALTH_CHECK

on_chain:
  description: Stores signal for API_HEALTH_CHECK.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

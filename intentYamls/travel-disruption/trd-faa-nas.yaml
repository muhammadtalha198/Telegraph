version: "1"
kind: miner
id: 170020
slug: trd-faa-nas
protocol: generic
name: FAA NAS Airport Disruption Status
description: >
  FAA National Airspace System status -> disruption_active (1/0): active ground stop, ground delay, arrival/departure delay, closure or NOTAM event for pinned US airport.
  Intent TRAVEL_DISRUPTION - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 120
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://nasstatus.faa.gov/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/faa-disrupt
    method: GET
    description: Query for intent TRAVEL_DISRUPTION via FAA NAS Airport Disruption Status.
    intents: [TRAVEL_DISRUPTION]
    params:
      query:
        required:
          - name: airport
            type: string
            intents: ["*"]
            description: 3-letter FAA/IATA airport code

input_schema:
  type: object
  required: [airport]
  properties:
    airport: {type: string, description: "3-letter FAA/IATA airport code", default: "JFK"}

semantics:
  signal_mapping:
    label_field: disruption_active
  supported_intents:
    - TRAVEL_DISRUPTION

on_chain:
  description: Stores signal for TRAVEL_DISRUPTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

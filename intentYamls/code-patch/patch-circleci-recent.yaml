version: "1"
kind: miner
id: 190001
slug: patch-circleci-recent
protocol: generic
name: "Patch Circleci Recent"
description: "Semantic V2 miner for CODE_PATCH_VERIFY. Validates that software patch commits compile, resolve targeted defects, and introduce no regression side effects. Capture pin answers: Must convey whether the build/tests for the patch passed or failed."

base_url: https://circleci.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://circleci.com/
  website: https://circleci.com

endpoints:
  - path: /query
    external_path: /api/v1.1/project/github/CircleCI-Public/circleci-cli
    method: GET
    description: Query for intent CODE_PATCH_VERIFY via Patch Circleci Recent.
    intents: [CODE_PATCH_VERIFY]
    params:
      query:
        required:
          - name: limit
            type: string
            intents: ["*"]
            description: limit
          - name: filter
            type: string
            intents: ["*"]
            description: filter

input_schema:
  type: object
  required: [limit, filter]
  properties:
    limit: {type: string, description: "limit", default: "1"}
    filter: {type: string, description: "filter", default: "completed"}

semantics:
  signal_mapping:
    label_field: conclusion
  supported_intents:
    - CODE_PATCH_VERIFY

on_chain:
  description: Stores signal for CODE_PATCH_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190004
slug: patch-gitlab-pipeline
protocol: generic
name: "Patch Gitlab Pipeline"
description: "Semantic V2 miner for CODE_PATCH_VERIFY. Validates that software patch commits compile, resolve targeted defects, and introduce no regression side effects. Capture pin answers: Must convey whether the build/tests for the patch passed or failed."

base_url: https://gitlab.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://gitlab.com/
  website: https://gitlab.com

endpoints:
  - path: /query
    external_path: /api/v4/projects/gitlab-org/gitlab-runner/pipelines
    method: GET
    description: Query for intent CODE_PATCH_VERIFY via Patch Gitlab Pipeline.
    intents: [CODE_PATCH_VERIFY]
    params:
      query:
        required:
          - name: per_page
            type: string
            intents: ["*"]
            description: per_page
          - name: status
            type: string
            intents: ["*"]
            description: status

input_schema:
  type: object
  required: [per_page, status]
  properties:
    per_page: {type: string, description: "per_page", default: "1"}
    status: {type: string, description: "status", default: "success"}

semantics:
  signal_mapping:
    label_field: conclusion
  supported_intents:
    - CODE_PATCH_VERIFY

on_chain:
  description: Stores signal for CODE_PATCH_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

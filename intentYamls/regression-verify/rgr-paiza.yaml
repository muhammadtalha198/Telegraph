version: "1"
kind: miner
id: 170076
slug: rgr-paiza
protocol: generic
name: paiza.io runner
description: >
  paiza.io runner -> exit_status (0 if the program runs and exits 0, else 1).
  Intent REGRESSION_VERIFY - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://paiza.io/help
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/regress-paiza
    method: GET
    description: Query for intent REGRESSION_VERIFY via paiza.io runner.
    intents: [REGRESSION_VERIFY]
    params:
      query:
        required:
          - name: source_code
            type: string
            intents: ["*"]
            description: Program source
          - name: language
            type: string
            intents: ["*"]
            description: paiza.io language id

input_schema:
  type: object
  required: [source_code, language]
  properties:
    source_code: {type: string, description: "Program source", default: "print(1+1)"}
    language: {type: string, description: "paiza.io language id", default: "python3"}

semantics:
  signal_mapping:
    label_field: exit_status
  supported_intents:
    - REGRESSION_VERIFY

on_chain:
  description: Stores signal for REGRESSION_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

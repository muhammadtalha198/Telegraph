version: "1"
kind: miner
id: 170038
slug: aqi-sensorcommunity
protocol: generic
name: Sensor.Community
description: >
  Sensor.Community -> pm25_ugm3_x10 (Latest PM2.5 in ug/m3 x10).
  Intent AIR_QUALITY_INDEX - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://github.com/opendata-stuttgart/meta/wiki/APIs
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/aq-pm25
    method: GET
    description: Query for intent AIR_QUALITY_INDEX via Sensor.Community.
    intents: [AIR_QUALITY_INDEX]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Air-quality network id
          - name: site
            type: string
            intents: ["*"]
            description: "Location as lat,lon (e.g. 52.52,13.41)"

input_schema:
  type: object
  required: [venue, site]
  properties:
    venue: {type: string, description: "Air-quality network id", default: "sensorcommunity"}
    site: {type: string, description: "Location as lat,lon (e.g. 52.52,13.41)", default: "52.52,13.41"}

semantics:
  signal_mapping:
    label_field: pm25_ugm3_x10
  supported_intents:
    - AIR_QUALITY_INDEX

on_chain:
  description: Stores signal for AIR_QUALITY_INDEX.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

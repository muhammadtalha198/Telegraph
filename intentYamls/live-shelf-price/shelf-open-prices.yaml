version: "1"
kind: miner
id: 92021
slug: shelf-open-prices
protocol: generic
name: Open Prices By Id
description: >
  Open Prices GET /api/v1/prices/{id} via proxy → price_cents.
  Intent LIVE_SHELF_PRICE — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/open-prices
    method: GET
    description: Query for intent LIVE_SHELF_PRICE via Open Prices By Id.
    intents: [LIVE_SHELF_PRICE]
    params:
      query:
        required:
          - name: price_id
            type: string
            intents: ["*"]
            description: Open Prices price id

input_schema:
  type: object
  required: [price_id]
  properties:
    price_id: {type: string, description: "Open Prices price id", default: "1"}

semantics:
  signal_mapping:
    label_field: price_cents
  supported_intents:
    - LIVE_SHELF_PRICE

on_chain:
  description: Stores signal for LIVE_SHELF_PRICE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

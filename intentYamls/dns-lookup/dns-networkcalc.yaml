version: "1"
kind: miner
id: 190197
slug: dns-networkcalc
protocol: generic
name: "Dns Networkcalc"
description: "Semantic V2 miner for DNS_RECORD_LOOKUP. Resolves and validates authoritative DNS records (A, AAAA, CNAME, MX, TXT) across global resolvers. Capture pin answers: Must return the DNS records (A/AAAA/CNAME/MX/TXT) for the name and type asked."

base_url: https://networkcalc.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://networkcalc.com/
  website: https://networkcalc.com

endpoints:
  - path: /query
    external_path: /api/dns/lookup/dns.google
    method: GET
    description: Query for intent DNS_RECORD_LOOKUP via Dns Networkcalc.
    intents: [DNS_RECORD_LOOKUP]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - DNS_RECORD_LOOKUP

on_chain:
  description: Stores signal for DNS_RECORD_LOOKUP (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190081
slug: dns-hackertarget
protocol: generic
name: "Dns Hackertarget"
description: "Semantic V2 miner for DNS_RECORD_LOOKUP. PACK READY - meets 10 candidates; 11 keyless. Resolver JSON APIs. Several may not expose JSON - the runner will drop those. Distinct operators, same DNS truth. Capture pin answers: Must satisfy catalog intent DNS_RECORD_LOOKUP via upstream HackerTarget"

base_url: https://api.hackertarget.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.hackertarget.com/
  website: https://api.hackertarget.com

endpoints:
  - path: /query
    external_path: /dnslookup/
    method: GET
    description: Query for intent DNS_RECORD_LOOKUP via Dns Hackertarget.
    intents: [DNS_RECORD_LOOKUP]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: q

input_schema:
  type: object
  required: [q]
  properties:
    q: {type: string, description: "q", default: "bitcoin"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - DNS_RECORD_LOOKUP

on_chain:
  description: Stores signal for DNS_RECORD_LOOKUP (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

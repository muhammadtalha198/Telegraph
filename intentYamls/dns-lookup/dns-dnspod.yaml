version: "1"
kind: miner
id: 190080
slug: dns-dnspod
protocol: generic
name: "Dns Dnspod"
description: "Semantic V2 miner for DNS_RECORD_LOOKUP. PACK READY - meets 10 candidates; 11 keyless. Resolver JSON APIs. Several may not expose JSON - the runner will drop those. Distinct operators, same DNS truth. Capture pin answers: Must satisfy catalog intent DNS_RECORD_LOOKUP via upstream DNSPod (Tencent)"

base_url: https://doh.pub

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://doh.pub/
  website: https://doh.pub

endpoints:
  - path: /query
    external_path: /dns-query
    method: GET
    description: Query for intent DNS_RECORD_LOOKUP via Dns Dnspod.
    intents: [DNS_RECORD_LOOKUP]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: name
          - name: type
            type: string
            intents: ["*"]
            description: type

input_schema:
  type: object
  required: [name, type]
  properties:
    name: {type: string, description: "name", default: "bitcoin"}
    type: {type: string, description: "type", default: "A"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - DNS_RECORD_LOOKUP

on_chain:
  description: Stores signal for DNS_RECORD_LOOKUP (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

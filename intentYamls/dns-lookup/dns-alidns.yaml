version: "1"
kind: miner
id: 170109
slug: dns-alidns
protocol: generic
name: Alibaba Public DNS
description: >
  Alibaba Public DNS -> has_record.
  Intent DNS_RECORD_LOOKUP - Round Two Batch 7.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.alibabacloud.com/help/en/dns
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/dns-has
    method: GET
    description: Query for intent DNS_RECORD_LOOKUP via Alibaba Public DNS.
    intents: [DNS_RECORD_LOOKUP]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: venue
          - name: name
            type: string
            intents: ["*"]
            description: name
          - name: type
            type: string
            intents: ["*"]
            description: type

input_schema:
  type: object
  required: [venue, name, type]
  properties:
    venue: {type: string, description: "venue", default: "alidns"}
    name: {type: string, description: "name", default: "example.com"}
    type: {type: string, description: "type", default: "A"}

semantics:
  signal_mapping:
    label_field: has_record
  supported_intents:
    - DNS_RECORD_LOOKUP

on_chain:
  description: Stores signal for DNS_RECORD_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

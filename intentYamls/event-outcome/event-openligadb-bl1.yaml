version: "1"
kind: miner
id: 190016
slug: event-openligadb-bl1
protocol: generic
name: "Event Openligadb Bl1"
description: "Semantic V2 miner for EVENT_OUTCOME_RESOLUTION. Resolves objective real-world event outcomes for prediction markets and conditional contracts using quorum oracles. Capture pin answers: Must state the settled outcome/result of the event asked."

base_url: https://api.openligadb.de

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.openligadb.de/
  website: https://api.openligadb.de

endpoints:
  - path: /query
    external_path: /getmatchdata/bl1/2023
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION via Event Openligadb Bl1.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: events
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores signal for EVENT_OUTCOME_RESOLUTION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

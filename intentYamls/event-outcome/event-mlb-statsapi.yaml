version: "1"
kind: miner
id: 190014
slug: event-mlb-statsapi
protocol: generic
name: "Event MLB Statsapi"
description: "Semantic V2 miner for EVENT_OUTCOME_RESOLUTION. Resolves objective real-world event outcomes for prediction markets and conditional contracts using quorum oracles. Capture pin answers: Must state the settled outcome/result of the event asked."

base_url: https://statsapi.mlb.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://statsapi.mlb.com/
  website: https://statsapi.mlb.com

endpoints:
  - path: /query
    external_path: /api/v1/schedule
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION via Event MLB Statsapi.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      query:
        required:
          - name: sportId
            type: string
            intents: ["*"]
            description: sportId
          - name: date
            type: string
            intents: ["*"]
            description: date
          - name: hydrate
            type: string
            intents: ["*"]
            description: hydrate

input_schema:
  type: object
  required: [sportId, date, hydrate]
  properties:
    sportId: {type: string, description: "sportId", default: "1"}
    date: {type: string, description: "date", default: "2024-10-30"}
    hydrate: {type: string, description: "hydrate", default: "decisions"}

semantics:
  signal_mapping:
    label_field: events
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores signal for EVENT_OUTCOME_RESOLUTION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 29303
slug: event-manifold-resolution
protocol: generic
name: Manifold Market Resolution
description: >
  Manifold resolved market → resolved_yes. Intent EVENT_OUTCOME_RESOLUTION.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.manifold.markets/
  website: https://manifold.markets/

endpoints:
  - path: /query
    external_path: /truth/event-manifold
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      query:
        required:
          - name: id
            type: string
            intents: ["*"]
            description: id

input_schema:
  type: object
  required: [id]
  properties:
    id: {type: string, description: "id", default: "ICnSIPIgZO"}

semantics:
  signal_mapping:
    label_field: resolved_yes
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores resolved_yes for EVENT_OUTCOME_RESOLUTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

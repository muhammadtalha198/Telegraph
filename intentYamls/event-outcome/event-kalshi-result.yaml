version: "1"
kind: miner
id: 29302
slug: event-kalshi-result
protocol: generic
name: Kalshi Market Result
description: >
  Kalshi settled/finalized/determined market result → resolved_yes.
  Intent EVENT_OUTCOME_RESOLUTION. Pin a market ticker with result yes|no.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.kalshi.com/
  website: https://kalshi.com/

endpoints:
  - path: /query
    external_path: /truth/event-kalshi
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION via Kalshi market result.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      query:
        required:
          - name: ticker
            type: string
            intents: ["*"]
            description: Kalshi market ticker (settled/finalized/determined)

input_schema:
  type: object
  required: [ticker]
  properties:
    ticker: {type: string, description: "Kalshi market ticker", default: "KXWTAMATCH-26SEP27LAZJIA-LAZ"}

semantics:
  signal_mapping:
    label_field: resolved_yes
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores resolved_yes for EVENT_OUTCOME_RESOLUTION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

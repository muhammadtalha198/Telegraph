version: "1"
kind: miner
id: 190017
slug: event-poly-closed
protocol: generic
name: "Event Poly Closed"
description: "Semantic V2 miner for EVENT_OUTCOME_RESOLUTION. Resolves objective real-world event outcomes for prediction markets and conditional contracts using quorum oracles. Capture pin answers: Must state the settled outcome/result of the event asked."

base_url: https://gamma-api.polymarket.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://gamma-api.polymarket.com/
  website: https://gamma-api.polymarket.com

endpoints:
  - path: /query
    external_path: /events
    method: GET
    description: Query for intent EVENT_OUTCOME_RESOLUTION via Event Poly Closed.
    intents: [EVENT_OUTCOME_RESOLUTION]
    params:
      query:
        required:
          - name: closed
            type: string
            intents: ["*"]
            description: closed
          - name: limit
            type: string
            intents: ["*"]
            description: limit

input_schema:
  type: object
  required: [closed, limit]
  properties:
    closed: {type: string, description: "closed", default: "true"}
    limit: {type: string, description: "limit", default: "5"}

semantics:
  signal_mapping:
    label_field: events
  supported_intents:
    - EVENT_OUTCOME_RESOLUTION

on_chain:
  description: Stores signal for EVENT_OUTCOME_RESOLUTION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

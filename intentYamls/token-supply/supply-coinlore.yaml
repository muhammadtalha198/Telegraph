version: "1"
kind: miner
id: 190193
slug: supply-coinlore
protocol: generic
name: "Supply Coinlore"
description: "Semantic V2 miner for TOKEN_TOTAL_SUPPLY_VERIFY. Verifies token circulating supply, burnt token balances, and total minted token counts on-chain. Capture pin answers: Must return the token's TOTAL supply (minted count, in whole tokens), not circulating/max."

base_url: https://api.coinlore.net

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.coinlore.net/
  website: https://api.coinlore.net

endpoints:
  - path: /query
    external_path: /api/ticker/
    method: GET
    description: Query for intent TOKEN_TOTAL_SUPPLY_VERIFY via Supply Coinlore.
    intents: [TOKEN_TOTAL_SUPPLY_VERIFY]
    params:
      query:
        required:
          - name: id
            type: string
            intents: ["*"]
            description: id

input_schema:
  type: object
  required: ["id"]
  properties:
    "id": {type: string, description: "id", default: "2751"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - TOKEN_TOTAL_SUPPLY_VERIFY

on_chain:
  description: Stores signal for TOKEN_TOTAL_SUPPLY_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

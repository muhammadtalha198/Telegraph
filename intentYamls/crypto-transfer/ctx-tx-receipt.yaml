version: "1"
kind: miner
id: 91021
slug: ctx-tx-receipt
protocol: generic
name: ETH Tx Receipt Success
description: >
  Blockscout ETH tx receipt → success (0/1).
  Intent CRYPTO_TRANSFER_VERIFY — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/tx-receipt
    method: GET
    description: Query for intent CRYPTO_TRANSFER_VERIFY via ETH Tx Receipt Success.
    intents: [CRYPTO_TRANSFER_VERIFY]
    params:
      query:
        required:
          - name: hash
            type: string
            intents: ["*"]
            description: Transaction hash

input_schema:
  type: object
  required: [hash]
  properties:
    hash:
      {type: string, description: "Transaction hash", default: "0x7393e1e64e355379c59b037dd3c3653289e0bdaa473ec36b07c77d57ac589cee"}

semantics:
  signal_mapping:
    label_field: success
  supported_intents:
    - CRYPTO_TRANSFER_VERIFY

on_chain:
  description: Stores signal for CRYPTO_TRANSFER_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

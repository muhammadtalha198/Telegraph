version: "1"
kind: miner
id: 170043
slug: wnd-jma
protocol: generic
name: JMA AMeDAS
description: >
  JMA AMeDAS -> wind_kmh_milli (Observed 10 m wind speed at that hour, km/h x1000).
  Intent WEATHER_FORECAST_VERIFY - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.jma.go.jp/bosai/amedas/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/wx-wind
    method: GET
    description: Query for intent WEATHER_FORECAST_VERIFY via JMA AMeDAS.
    intents: [WEATHER_FORECAST_VERIFY]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Observation archive id
          - name: site
            type: string
            intents: ["*"]
            description: Station id or lat,lon for this archive
          - name: when
            type: string
            intents: ["*"]
            description: Past UTC hour (YYYY-MM-DDTHH:00)

input_schema:
  type: object
  required: [venue, site, when]
  properties:
    venue: {type: string, description: "Observation archive id", default: "jma"}
    site: {type: string, description: "Station id or lat,lon for this archive", default: "44132"}
    when: {type: string, description: "Past UTC hour (YYYY-MM-DDTHH:00)", default: "2026-09-20T06:00"}

semantics:
  signal_mapping:
    label_field: wind_kmh_milli
  supported_intents:
    - WEATHER_FORECAST_VERIFY

on_chain:
  description: Stores signal for WEATHER_FORECAST_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

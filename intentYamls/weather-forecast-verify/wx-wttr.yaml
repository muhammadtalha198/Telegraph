version: "1"
kind: miner
id: 190101
slug: wx-wttr
protocol: generic
name: "Wx Wttr"
description: "Semantic V2 miner for WEATHER_CHECK. PACK READY - meets 10 candidates; 7 keyless. Open-Meteo model variants share a host - count as 1 source if you enforce one-publisher-per-miner. Capture pin answers: Must satisfy catalog intent WEATHER_CHECK via upstream wttr.in (WorldWeatherOnline)"

base_url: https://wttr.in

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://wttr.in/
  website: https://wttr.in

endpoints:
  - path: /query
    external_path: /52.52,13.41
    method: GET
    description: Query for intent WEATHER_CHECK via Wx Wttr.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: format
            type: string
            intents: ["*"]
            description: format

input_schema:
  type: object
  required: [format]
  properties:
    format: {type: string, description: "format", default: "j1"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores signal for WEATHER_CHECK (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190100
slug: wx-openmeteo
protocol: generic
name: "Wx Openmeteo"
description: "Semantic V2 miner for WEATHER_CHECK. PACK READY - meets 10 candidates; 7 keyless. Open-Meteo model variants share a host - count as 1 source if you enforce one-publisher-per-miner. Capture pin answers: Must satisfy catalog intent WEATHER_CHECK via upstream Open-Meteo (best match)"

base_url: https://api.open-meteo.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.open-meteo.com/
  website: https://api.open-meteo.com

endpoints:
  - path: /query
    external_path: /v1/forecast
    method: GET
    description: Query for intent WEATHER_CHECK via Wx Openmeteo.
    intents: [WEATHER_CHECK]
    params:
      query:
        required:
          - name: latitude
            type: string
            intents: ["*"]
            description: latitude
          - name: longitude
            type: string
            intents: ["*"]
            description: longitude
          - name: current
            type: string
            intents: ["*"]
            description: current

input_schema:
  type: object
  required: [latitude, longitude, current]
  properties:
    latitude: {type: string, description: "latitude", default: "52.52"}
    longitude: {type: string, description: "longitude", default: "13.41"}
    current: {type: string, description: "current", default: "temperature_2m"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - WEATHER_CHECK

on_chain:
  description: Stores signal for WEATHER_CHECK (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

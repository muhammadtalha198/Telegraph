version: "1"
kind: miner
id: 190150
slug: ocm-publicnode-rpc
protocol: generic
name: "Ocm Publicnode Rpc"
description: "Semantic V2 miner for ONCHAIN_METRIC_VERIFY. Validates smart contract event logs, gas consumption, token balances, and wallet transaction states directly on-chain. Capture pin answers: Must return the on-chain value asked (address balance / token balance / tx state)."

base_url: https://ethereum-rpc.publicnode.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ethereum-rpc.publicnode.com/
  website: https://ethereum-rpc.publicnode.com

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent ONCHAIN_METRIC_VERIFY via Ocm Publicnode Rpc.
    intents: [ONCHAIN_METRIC_VERIFY]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: coin_balance
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

on_chain:
  description: Stores signal for ONCHAIN_METRIC_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

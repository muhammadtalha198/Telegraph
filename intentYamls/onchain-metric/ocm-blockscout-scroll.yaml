version: "1"
kind: miner
id: 190034
slug: ocm-blockscout-scroll
protocol: generic
name: "Ocm Blockscout Scroll"
description: "Semantic V2 miner for ONCHAIN_METRIC_VERIFY. Validates smart contract event logs, gas consumption, token balances, and wallet transaction states directly on-chain. Capture pin answers: Must convey the on-chain value asked (wallet/token balance or tx state) for the address given."

base_url: https://scroll.blockscout.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://scroll.blockscout.com/
  website: https://scroll.blockscout.com

endpoints:
  - path: /query
    external_path: /api/v2/addresses/{address}
    method: GET
    description: Query for intent ONCHAIN_METRIC_VERIFY via Ocm Blockscout Scroll.
    intents: [ONCHAIN_METRIC_VERIFY]
    params:
      path:
        required:
          - name: address
            type: string
            intents: ["*"]
            description: address

input_schema:
  type: object
  required: [address]
  properties:
    address: {type: string, description: "address", default: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"}

semantics:
  signal_mapping:
    label_field: coin_balance
  supported_intents:
    - ONCHAIN_METRIC_VERIFY

on_chain:
  description: Stores signal for ONCHAIN_METRIC_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

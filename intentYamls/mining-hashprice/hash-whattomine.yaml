version: "1"
kind: miner
id: 190089
slug: hash-whattomine
protocol: generic
name: "Hash Whattomine"
description: "Semantic V2 miner for MINING_HASHPRICE_VERIFY. PACK READY - only 5 candidates; 4 keyless. Only minerstat/WhatToMine return revenue-per-hash directly; the rest give inputs. Expect 2-3 real miners. Distinct publishers: 5. Capture pin answers: Must satisfy catalog intent MINING_HASHPRICE_VERIFY via upstream WhatToMine"

base_url: https://whattomine.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://whattomine.com/
  website: https://whattomine.com

endpoints:
  - path: /query
    external_path: /coins/1.json
    method: GET
    description: Query for intent MINING_HASHPRICE_VERIFY via Hash Whattomine.
    intents: [MINING_HASHPRICE_VERIFY]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - MINING_HASHPRICE_VERIFY

on_chain:
  description: Stores signal for MINING_HASHPRICE_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190199
slug: filing-asx-announcements
protocol: generic
name: "Filing Asx Announcements"
description: "Semantic V2 miner for REGULATORY_FILING_MONITOR. Parses statutory regulatory filings, 10-K/10-Q disclosures, and disclosure updates from financial oversight portals. Capture pin answers: Must return the company's recent regulatory filings / disclosure notices (type/headline + date) for the pinned issuer."

base_url: https://asx.api.markitdigital.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://asx.api.markitdigital.com/
  website: https://asx.api.markitdigital.com

endpoints:
  - path: /query
    external_path: /asx-research/1.0/companies/BHP/announcements
    method: GET
    description: Query for intent REGULATORY_FILING_MONITOR via Filing Asx Announcements.
    intents: [REGULATORY_FILING_MONITOR]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - REGULATORY_FILING_MONITOR

on_chain:
  description: Stores signal for REGULATORY_FILING_MONITOR (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190063
slug: extract-microlink
protocol: generic
name: "Extract Microlink"
description: "Semantic V2 miner for CONTENT_EXTRACTION. PACK READY - only 7 candidates; 6 keyless. Only Jina/Microlink/Diffbot clean boilerplate; the rest return raw HTML that the LLM normaliser must clean. Distinct publishers: 7. Capture pin answers: Must satisfy catalog intent CONTENT_EXTRACTION via upstream Microlink"

base_url: https://api.microlink.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.microlink.io/
  website: https://api.microlink.io

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent CONTENT_EXTRACTION via Extract Microlink.
    intents: [CONTENT_EXTRACTION]
    params:
      query:
        required:
          - name: url
            type: string
            intents: ["*"]
            description: url

input_schema:
  type: object
  required: [url]
  properties:
    url: {type: string, description: "url", default: "https://example.com"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - CONTENT_EXTRACTION

on_chain:
  description: Stores signal for CONTENT_EXTRACTION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 170069
slug: car-indiapost
protocol: generic
name: India Post PIN directory
description: >
  India Post PIN directory -> deliverable (1 if the postcode has a delivery office/area, else 0).
  Intent CARRIER_SERVICEABILITY - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.postalpincode.in
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/deliverable
    method: GET
    description: Query for intent CARRIER_SERVICEABILITY via India Post PIN directory.
    intents: [CARRIER_SERVICEABILITY]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Postal operator id
          - name: postcode
            type: string
            intents: ["*"]
            description: Postcode

input_schema:
  type: object
  required: [venue, postcode]
  properties:
    venue: {type: string, description: "Postal operator id", default: "indiapost"}
    postcode: {type: string, description: "Postcode", default: "110001"}

semantics:
  signal_mapping:
    label_field: deliverable
  supported_intents:
    - CARRIER_SERVICEABILITY

on_chain:
  description: Stores signal for CARRIER_SERVICEABILITY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190108
slug: xchain-base-root
protocol: generic
name: "Xchain Base Root"
description: "Semantic V2 miner for CROSS_CHAIN_STATE_VERIFY. Proves cryptographic Merkle-Patricia state roots and cross-chain message execution headers between distinct blockchain networks. Capture pin answers: Must return verifiable state roots / cross-chain message status between networks."

base_url: https://mainnet.base.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://mainnet.base.org/
  website: https://mainnet.base.org

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent CROSS_CHAIN_STATE_VERIFY via Xchain Base Root.
    intents: [CROSS_CHAIN_STATE_VERIFY]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  description: Stores signal for CROSS_CHAIN_STATE_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

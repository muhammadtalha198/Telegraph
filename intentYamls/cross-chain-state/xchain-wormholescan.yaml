version: "1"
kind: miner
id: 190009
slug: xchain-wormholescan
protocol: generic
name: "Xchain Wormholescan"
description: "Semantic V2 miner for CROSS_CHAIN_STATE_VERIFY. Proves cryptographic Merkle-Patricia state roots and cross-chain message execution headers between distinct blockchain networks. Capture pin answers: Must convey whether the cross-chain message/transfer executed and its status."

base_url: https://api.wormholescan.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.wormholescan.io/
  website: https://api.wormholescan.io

endpoints:
  - path: /query
    external_path: /api/v1/operations
    method: GET
    description: Query for intent CROSS_CHAIN_STATE_VERIFY via Xchain Wormholescan.
    intents: [CROSS_CHAIN_STATE_VERIFY]
    params:
      query:
        required:
          - name: page
            type: string
            intents: ["*"]
            description: page
          - name: pageSize
            type: string
            intents: ["*"]
            description: pageSize

input_schema:
  type: object
  required: [page, pageSize]
  properties:
    page: {type: string, description: "page", default: "0"}
    pageSize: {type: string, description: "pageSize", default: "5"}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  description: Stores signal for CROSS_CHAIN_STATE_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

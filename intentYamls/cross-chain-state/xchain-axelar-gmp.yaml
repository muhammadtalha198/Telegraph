version: "1"
kind: miner
id: 29101
slug: xchain-axelar-gmp
protocol: generic
name: Axelar GMP Execution Verify
description: >
  Axelarscan GMP: execution header for a pinned cross-chain message tx.
  Returns execution_ok 1 if status=executed, else 0. Intent CROSS_CHAIN_STATE_VERIFY.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.axelarscan.io/
  website: https://axelarscan.io/

endpoints:
  - path: /query
    external_path: /truth/xchain-axelar
    method: GET
    description: Query for intent CROSS_CHAIN_STATE_VERIFY via Axelarscan GMP.
    intents: [CROSS_CHAIN_STATE_VERIFY]
    params:
      query:
        required:
          - name: tx_hash
            type: string
            intents: ["*"]
            description: Source-chain or Axelar GMP transaction hash

input_schema:
  type: object
  required: [tx_hash]
  properties:
    tx_hash:
      type: string
      description: Axelar GMP tx hash
      default: "FC27997CBF294CBED27FA92DB9965D1B4D6B5407FDD2D3444211B0C1B85015B2"

semantics:
  signal_mapping:
    label_field: execution_ok
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  description: Stores execution_ok for CROSS_CHAIN_STATE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

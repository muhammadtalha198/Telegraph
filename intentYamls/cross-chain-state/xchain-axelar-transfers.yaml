version: "1"
kind: miner
id: 190006
slug: xchain-axelar-transfers
protocol: generic
name: "Xchain Axelar Transfers"
description: "Semantic V2 miner for CROSS_CHAIN_STATE_VERIFY. Proves cryptographic Merkle-Patricia state roots and cross-chain message execution headers between distinct blockchain networks. Capture pin answers: Must convey whether the cross-chain message/transfer executed and its status."

base_url: https://api.axelarscan.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.axelarscan.io/
  website: https://api.axelarscan.io

endpoints:
  - path: /query
    external_path: /token/searchTransfers
    method: GET
    description: Query for intent CROSS_CHAIN_STATE_VERIFY via Xchain Axelar Transfers.
    intents: [CROSS_CHAIN_STATE_VERIFY]
    params:
      query:
        required:
          - name: size
            type: string
            intents: ["*"]
            description: size

input_schema:
  type: object
  required: [size]
  properties:
    size: {type: string, description: "size", default: "5"}

semantics:
  signal_mapping:
    label_field: status
  supported_intents:
    - CROSS_CHAIN_STATE_VERIFY

on_chain:
  description: Stores signal for CROSS_CHAIN_STATE_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190171
slug: gas-drpc-rpc
protocol: generic
name: "Gas Drpc Rpc"
description: "Semantic V2 miner for GAS_PRICE. Estimates dynamic base fee, tip priority, and gas limits across standard transaction speed tiers. Capture pin answers: Must return the current Ethereum gas price / fee estimate."

base_url: https://eth.drpc.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://eth.drpc.org/
  website: https://eth.drpc.org

endpoints:
  - path: /query
    external_path: /
    method: GET
    description: Query for intent GAS_PRICE via Gas Drpc Rpc.
    intents: [GAS_PRICE]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - GAS_PRICE

on_chain:
  description: Stores signal for GAS_PRICE (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

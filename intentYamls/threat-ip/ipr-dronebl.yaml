version: "1"
kind: miner
id: 170011
slug: ipr-dronebl
protocol: generic
name: DroneBL DNSBL Listing
description: >
  DroneBL DNSBL Listing -> listed (1/0): is the pinned IPv4 flagged malicious by this registry.
  Intent THREAT_IP_REPUTATION - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 300
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://dronebl.org/docs/howtouse
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/ip-rep
    method: GET
    description: Query for intent THREAT_IP_REPUTATION via DroneBL DNSBL Listing.
    intents: [THREAT_IP_REPUTATION]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Threat registry id
          - name: ip
            type: string
            intents: ["*"]
            description: IPv4 address

input_schema:
  type: object
  required: [venue, ip]
  properties:
    venue: {type: string, description: "Threat registry id", default: "dronebl"}
    ip: {type: string, description: "IPv4 address", default: "128.14.239.38"}

semantics:
  signal_mapping:
    label_field: listed
  supported_intents:
    - THREAT_IP_REPUTATION

on_chain:
  description: Stores signal for THREAT_IP_REPUTATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

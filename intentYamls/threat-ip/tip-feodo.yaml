version: "1"
kind: miner
id: 190163
slug: tip-feodo
protocol: generic
name: "Tip Feodo"
description: "Semantic V2 miner for THREAT_IP_REPUTATION. Assesses malicious IP address risk scores, botnet associations, and brute-force history across threat registries. Capture pin answers: Must return a malicious-activity risk assessment / reputation for the IP asked."

base_url: https://feodotracker.abuse.ch

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://feodotracker.abuse.ch/
  website: https://feodotracker.abuse.ch

endpoints:
  - path: /query
    external_path: /downloads/ipblocklist.json
    method: GET
    description: Query for intent THREAT_IP_REPUTATION via Tip Feodo.
    intents: [THREAT_IP_REPUTATION]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - THREAT_IP_REPUTATION

on_chain:
  description: Stores signal for THREAT_IP_REPUTATION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

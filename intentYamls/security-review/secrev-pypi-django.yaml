version: "1"
kind: miner
id: 190051
slug: secrev-pypi-django
protocol: generic
name: "Secrev Pypi Django"
description: "Semantic V2 miner for SECURITY_REVIEW. Scans codebase dependencies, API endpoints, and configuration files for common CVEs, secrets leakage, and misconfigurations. Capture pin answers: Must list known security vulnerabilities for the package/version asked."

base_url: https://pypi.org

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://pypi.org/
  website: https://pypi.org

endpoints:
  - path: /query
    external_path: /pypi/{pkg}/{ver}/json
    method: GET
    description: Query for intent SECURITY_REVIEW via Secrev Pypi Django.
    intents: [SECURITY_REVIEW]
    params:
      path:
        required:
          - name: pkg
            type: string
            intents: ["*"]
            description: pkg
          - name: ver
            type: string
            intents: ["*"]
            description: ver

input_schema:
  type: object
  required: [pkg, ver]
  properties:
    pkg: {type: string, description: "pkg", default: "django"}
    ver: {type: string, description: "ver", default: "3.0"}

semantics:
  signal_mapping:
    label_field: vulnerabilities
  supported_intents:
    - SECURITY_REVIEW

on_chain:
  description: Stores signal for SECURITY_REVIEW (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190082
slug: grammar-datamuse
protocol: generic
name: "Grammar Datamuse"
description: "Semantic V2 miner for GRAMMAR_SPELL_CHECK. PACK READY - only 5 candidates; 3 keyless. Keyless ceiling is ~2; the rest are free-key. Distinct publishers: 5. Capture pin answers: Must satisfy catalog intent GRAMMAR_SPELL_CHECK via upstream Datamuse"

base_url: https://api.datamuse.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.datamuse.com/
  website: https://api.datamuse.com

endpoints:
  - path: /query
    external_path: /sug
    method: GET
    description: Query for intent GRAMMAR_SPELL_CHECK via Grammar Datamuse.
    intents: [GRAMMAR_SPELL_CHECK]
    params:
      query:
        required:
          - name: s
            type: string
            intents: ["*"]
            description: s

input_schema:
  type: object
  required: [s]
  properties:
    s: {type: string, description: "s", default: "teh"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - GRAMMAR_SPELL_CHECK

on_chain:
  description: Stores signal for GRAMMAR_SPELL_CHECK (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190167
slug: val-beacon-chainsafe
protocol: generic
name: "Val Beacon Chainsafe"
description: "Semantic V2 miner for VALIDATOR_PERFORMANCE_VERIFY. Tracks consensus voting uptime, proposed block rates, slashing penalties, and staking APR for network validators. Capture pin answers: Must return the validator's status/balance/slashing/attestation performance for the validator asked."

base_url: https://lodestar-mainnet.chainsafe.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://lodestar-mainnet.chainsafe.io/
  website: https://lodestar-mainnet.chainsafe.io

endpoints:
  - path: /query
    external_path: /eth/v1/beacon/states/head/validators/1
    method: GET
    description: Query for intent VALIDATOR_PERFORMANCE_VERIFY via Val Beacon Chainsafe.
    intents: [VALIDATOR_PERFORMANCE_VERIFY]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - VALIDATOR_PERFORMANCE_VERIFY

on_chain:
  description: Stores signal for VALIDATOR_PERFORMANCE_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 170049
slug: vlp-publicnode
protocol: generic
name: PublicNode Beacon API
description: >
  PublicNode Beacon API -> effective_balance_gwei (Validator effective balance in gwei).
  Intent VALIDATOR_PERFORMANCE_VERIFY - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://ethereum-beacon-api.publicnode.com
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/validator-eb
    method: GET
    description: Query for intent VALIDATOR_PERFORMANCE_VERIFY via PublicNode Beacon API.
    intents: [VALIDATOR_PERFORMANCE_VERIFY]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Beacon node id
          - name: index
            type: string
            intents: ["*"]
            description: Validator index
          - name: state
            type: string
            intents: ["*"]
            description: State id (head, finalized, slot)

input_schema:
  type: object
  required: [venue, index, state]
  properties:
    venue: {type: string, description: "Beacon node id", default: "publicnode"}
    index: {type: string, description: "Validator index", default: "1"}
    state: {type: string, description: "State id (head, finalized, slot)", default: "head"}

semantics:
  signal_mapping:
    label_field: effective_balance_gwei
  supported_intents:
    - VALIDATOR_PERFORMANCE_VERIFY

on_chain:
  description: Stores signal for VALIDATOR_PERFORMANCE_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

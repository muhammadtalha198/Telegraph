version: "1"
kind: miner
id: 190196
slug: corp-sk-rpo
protocol: generic
name: "Corp Sk Rpo"
description: "Semantic V2 miner for CORPORATE_REGISTRY_LOOKUP. Queries national business registers for incorporation status, registered agent details, and beneficial ownership filings. Capture pin answers: Must return the company's registry record (legal name, status/validity, identifiers) for the pinned company."

base_url: https://api.statistics.sk

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.statistics.sk/
  website: https://api.statistics.sk

endpoints:
  - path: /query
    external_path: /rpo/v1/search
    method: GET
    description: Query for intent CORPORATE_REGISTRY_LOOKUP via Corp Sk Rpo.
    intents: [CORPORATE_REGISTRY_LOOKUP]
    params:
      query:
        required:
          - name: identifier
            type: string
            intents: ["*"]
            description: identifier

input_schema:
  type: object
  required: ["identifier"]
  properties:
    "identifier": {type: string, description: "identifier", default: "31322832"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - CORPORATE_REGISTRY_LOOKUP

on_chain:
  description: Stores signal for CORPORATE_REGISTRY_LOOKUP (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

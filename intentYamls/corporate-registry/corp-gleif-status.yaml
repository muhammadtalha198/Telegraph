version: "1"
kind: miner
id: 79011
slug: corp-gleif-status
protocol: generic
name: GLEIF LEI Status Active
description: >
  GLEIF LEI records by legal name → status_active (1 if ACTIVE).
  Intent CORPORATE_REGISTRY_LOOKUP — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.gleif.org/en/lei-data/gleif-api
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/corp-gleif
    method: GET
    description: Query for intent CORPORATE_REGISTRY_LOOKUP via GLEIF.
    intents: [CORPORATE_REGISTRY_LOOKUP]
    params:
      query:
        required:
          - name: name
            type: string
            intents: ["*"]
            description: Legal entity name

input_schema:
  type: object
  required: [name]
  properties:
    name: {type: string, description: "Legal entity name", default: "Microsoft"}

semantics:
  signal_mapping:
    label_field: status_active
  supported_intents:
    - CORPORATE_REGISTRY_LOOKUP

on_chain:
  description: Stores signal for CORPORATE_REGISTRY_LOOKUP.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

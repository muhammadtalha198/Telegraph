version: "1"
kind: miner
id: 190105
slug: corp-krs-pl
protocol: generic
name: "Corp Krs Pl"
description: "Semantic V2 miner for CORPORATE_REGISTRY_LOOKUP. Queries national business registers for incorporation status, registered agent details, and beneficial ownership filings. Capture pin answers: Must return the company's registry record (legal name, status, identifiers) for the company asked."

base_url: https://api-krs.ms.gov.pl

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api-krs.ms.gov.pl/
  website: https://api-krs.ms.gov.pl

endpoints:
  - path: /query
    external_path: /api/krs/OdpisAktualny/0000028860
    method: GET
    description: Query for intent CORPORATE_REGISTRY_LOOKUP via Corp Krs Pl.
    intents: [CORPORATE_REGISTRY_LOOKUP]
    params:
      query:
        required:
          - name: rejestr
            type: string
            intents: ["*"]
            description: rejestr
          - name: format
            type: string
            intents: ["*"]
            description: format

input_schema:
  type: object
  required: [rejestr, format]
  properties:
    rejestr: {type: string, description: "rejestr", default: "P"}
    format: {type: string, description: "format", default: "json"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - CORPORATE_REGISTRY_LOOKUP

on_chain:
  description: Stores signal for CORPORATE_REGISTRY_LOOKUP (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 170068
slug: ves-digitraffic
protocol: generic
name: Fintraffic Digitraffic AIS
description: >
  Fintraffic Digitraffic AIS -> sog_milliknots (speed over ground, knots x1000).
  Default pin MMSI 230981000 (Finnish waters). Proxy falls back to other live
  Finnish MMSIs if the pin has no recent AIS (moored / out of coverage).
  Intent VESSEL_TELEMETRY_VERIFY - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://www.digitraffic.fi/en/marine-traffic/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/vessel-sog
    method: GET
    description: Query for intent VESSEL_TELEMETRY_VERIFY via Fintraffic Digitraffic AIS.
    intents: [VESSEL_TELEMETRY_VERIFY]
    params:
      query:
        required:
          - name: mmsi
            type: string
            intents: ["*"]
            description: Vessel MMSI (Finnish AIS coverage)

input_schema:
  type: object
  required: [mmsi]
  properties:
    mmsi: {type: string, description: "Vessel MMSI (Finnish AIS coverage)", default: "230981000"}

semantics:
  signal_mapping:
    label_field: sog_milliknots
  supported_intents:
    - VESSEL_TELEMETRY_VERIFY

on_chain:
  description: Stores signal for VESSEL_TELEMETRY_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

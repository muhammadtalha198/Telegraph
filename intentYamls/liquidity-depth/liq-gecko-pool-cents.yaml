version: "1"
kind: miner
id: 72021
slug: liq-gecko-pool-cents
protocol: generic
name: GeckoTerminal Pool Cents
description: >
  GeckoTerminal pool reserve_in_usd → liquidity_usd_cents.
  Intent LIQUIDITY_DEPTH_VERIFY — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/liquidity-gecko
    method: GET
    description: Query for intent LIQUIDITY_DEPTH_VERIFY via GeckoTerminal Pool Cents.
    intents: [LIQUIDITY_DEPTH_VERIFY]
    params:
      query:
        required:
          - name: network
            type: string
            intents: ["*"]
            description: Network slug
          - name: address
            type: string
            intents: ["*"]
            description: Pool address

input_schema:
  type: object
  required: [network, address]
  properties:
    network: {type: string, description: "Network slug", default: "eth"}
    address: {type: string, description: "Pool address", default: "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"}

semantics:
  signal_mapping:
    label_field: liquidity_usd_cents
  supported_intents:
    - LIQUIDITY_DEPTH_VERIFY

on_chain:
  description: Stores signal for LIQUIDITY_DEPTH_VERIFY.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 170027
slug: ssl-certspotter
protocol: generic
name: SSLMate Cert Spotter
description: >
  SSLMate Cert Spotter -> not_after_epoch (notAfter (unix seconds) of the newest unexpired certificate covering host).
  Intent SSL_VERIFICATION - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://sslmate.com/help/reference/ct_search_api_v1
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/ssl-notafter
    method: GET
    description: Query for intent SSL_VERIFICATION via SSLMate Cert Spotter.
    intents: [SSL_VERIFICATION]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Certificate log id
          - name: host
            type: string
            intents: ["*"]
            description: Hostname

input_schema:
  type: object
  required: [venue, host]
  properties:
    venue: {type: string, description: "Certificate log id", default: "certspotter"}
    host: {type: string, description: "Hostname", default: "badssl.com"}

semantics:
  signal_mapping:
    label_field: not_after_epoch
  supported_intents:
    - SSL_VERIFICATION

on_chain:
  description: Stores signal for SSL_VERIFICATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

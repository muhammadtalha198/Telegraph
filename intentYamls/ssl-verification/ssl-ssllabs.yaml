version: "1"
kind: miner
id: 190093
slug: ssl-ssllabs
protocol: generic
name: "Ssl Ssllabs"
description: "Semantic V2 miner for SSL_VERIFICATION. PACK READY - only 4 candidates; 4 keyless. Few keyless TLS-inspection APIs exist; ~4 is the realistic keyless ceiling (Censys/SecurityTrails need keys). Distinct publishers: 4. Capture pin answers: Must satisfy catalog intent SSL_VERIFICATION via upstream Qualys SSL Labs"

base_url: https://api.ssllabs.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.ssllabs.com/
  website: https://api.ssllabs.com

endpoints:
  - path: /query
    external_path: /api/v3/analyze
    method: GET
    description: Query for intent SSL_VERIFICATION via Ssl Ssllabs.
    intents: [SSL_VERIFICATION]
    params:
      query:
        required:
          - name: host
            type: string
            intents: ["*"]
            description: host
          - name: fromCache
            type: string
            intents: ["*"]
            description: fromCache
          - name: maxAge
            type: string
            intents: ["*"]
            description: maxAge

input_schema:
  type: object
  required: [host, fromCache, maxAge]
  properties:
    host: {type: string, description: "host", default: "example.com"}
    fromCache: {type: string, description: "fromCache", default: "on"}
    maxAge: {type: string, description: "maxAge", default: "48"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - SSL_VERIFICATION

on_chain:
  description: Stores signal for SSL_VERIFICATION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

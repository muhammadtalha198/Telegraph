version: "1"
kind: miner
id: 190084
slug: tr-popcat
protocol: generic
name: "Tr Popcat"
description: "Semantic V2 miner for LANGUAGE_TRANSLATION. PACK READY - only 7 candidates; 5 keyless.  Distinct publishers: 7. Capture pin answers: Must satisfy catalog intent LANGUAGE_TRANSLATION via upstream Popcat API"

base_url: https://api.popcat.xyz

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.popcat.xyz/
  website: https://api.popcat.xyz

endpoints:
  - path: /query
    external_path: /translate
    method: GET
    description: Query for intent LANGUAGE_TRANSLATION via Tr Popcat.
    intents: [LANGUAGE_TRANSLATION]
    params:
      query:
        required:
          - name: to
            type: string
            intents: ["*"]
            description: to
          - name: text
            type: string
            intents: ["*"]
            description: text

input_schema:
  type: object
  required: [to, text]
  properties:
    to: {type: string, description: "to", default: "en"}
    text: {type: string, description: "text", default: "EUR"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - LANGUAGE_TRANSLATION

on_chain:
  description: Stores signal for LANGUAGE_TRANSLATION (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

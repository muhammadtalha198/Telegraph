version: "1"
kind: miner
id: 180103
slug: tr-hf-opus
protocol: generic
name: HF Helsinki opus-mt-en-es
description: >
  HF Helsinki opus-mt-en-es -> translated_text for pinned (q,source,target). Intent LANGUAGE_TRANSLATION (NON-DETERMINISTIC / adapter). Venue `hf-opus` is this miner\'s distinct MT engine. Shared pin must match peers.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/translate
    method: GET
    description: Query for intent LANGUAGE_TRANSLATION via HF Helsinki opus-mt-en-es.
    intents: [LANGUAGE_TRANSLATION]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Bound MT engine id
          - name: q
            type: string
            intents: ["*"]
            description: Source text to translate
          - name: source
            type: string
            intents: ["*"]
            description: Source language code
          - name: target
            type: string
            intents: ["*"]
            description: Target language code

input_schema:
  type: object
  required: [q, source, target]
  properties:
    venue: {type: string, description: "Bound MT engine", default: "hf-opus"}
    q: {type: string, description: "Source text", default: "The quick brown fox jumps over the lazy dog."}
    source: {type: string, description: "Source lang", default: "en"}
    target: {type: string, description: "Target lang", default: "es"}

semantics:
  signal_mapping:
    label_field: translated_text
  supported_intents:
    - LANGUAGE_TRANSLATION

on_chain:
  description: Stores signal for LANGUAGE_TRANSLATION.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

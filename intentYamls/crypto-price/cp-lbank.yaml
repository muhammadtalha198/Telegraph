version: "1"
kind: miner
id: 190180
slug: cp-lbank
protocol: generic
name: "Cp Lbank"
description: "Semantic V2 miner for CRYPTO_PRICE. Fetches real-time spot and volume-weighted average prices for crypto assets across major exchanges. Capture pin answers: Must return the current price of the token asked (any quote currency is fine)."

base_url: https://api.lbank.info

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.lbank.info/
  website: https://api.lbank.info

endpoints:
  - path: /query
    external_path: /v2/ticker/24hr.do
    method: GET
    description: Query for intent CRYPTO_PRICE via Cp Lbank.
    intents: [CRYPTO_PRICE]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: symbol

input_schema:
  type: object
  required: ["symbol"]
  properties:
    "symbol": {type: string, description: "symbol", default: "btc_usdt"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - CRYPTO_PRICE

on_chain:
  description: Stores signal for CRYPTO_PRICE (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190079
slug: cp-redstone
protocol: generic
name: "Cp Redstone"
description: "Semantic V2 miner for CRYPTO_PRICE. PACK READY - meets 10 candidates; 22 keyless. Distinct operators. Quote asset differs (USD vs USDT) by ~0.1%, inside the 1.5% tolerance. Capture pin answers: Must satisfy catalog intent CRYPTO_PRICE via upstream RedStone"

base_url: https://api.redstone.finance

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.redstone.finance/
  website: https://api.redstone.finance

endpoints:
  - path: /query
    external_path: /prices
    method: GET
    description: Query for intent CRYPTO_PRICE via Cp Redstone.
    intents: [CRYPTO_PRICE]
    params:
      query:
        required:
          - name: symbol
            type: string
            intents: ["*"]
            description: symbol
          - name: provider
            type: string
            intents: ["*"]
            description: provider
          - name: limit
            type: string
            intents: ["*"]
            description: limit

input_schema:
  type: object
  required: [symbol, provider, limit]
  properties:
    symbol: {type: string, description: "symbol", default: "BTC"}
    provider: {type: string, description: "provider", default: "redstone"}
    limit: {type: string, description: "limit", default: "1"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - CRYPTO_PRICE

on_chain:
  description: Stores signal for CRYPTO_PRICE (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

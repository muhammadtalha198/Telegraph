version: "1"
kind: miner
id: 170029
slug: prt-internetdb
protocol: generic
name: Shodan InternetDB
description: >
  Shodan InternetDB -> port_open (1 if the TCP port is observed open, else 0).
  Intent PORT_SCAN_AUDIT - one publisher per miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://internetdb.shodan.io/docs
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/port-open
    method: GET
    description: Query for intent PORT_SCAN_AUDIT via Shodan InternetDB.
    intents: [PORT_SCAN_AUDIT]
    params:
      query:
        required:
          - name: venue
            type: string
            intents: ["*"]
            description: Scanner id
          - name: host
            type: string
            intents: ["*"]
            description: IPv4 address
          - name: port
            type: string
            intents: ["*"]
            description: TCP port

input_schema:
  type: object
  required: [venue, host, port]
  properties:
    venue: {type: string, description: "Scanner id", default: "internetdb"}
    host: {type: string, description: "IPv4 address", default: "45.33.32.156"}
    port: {type: string, description: "TCP port", default: "22"}

semantics:
  signal_mapping:
    label_field: port_open
  supported_intents:
    - PORT_SCAN_AUDIT

on_chain:
  description: Stores signal for PORT_SCAN_AUDIT.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

version: "1"
kind: miner
id: 190090
slug: port-hackertarget-nmap
protocol: generic
name: "Port Hackertarget Nmap"
description: "Semantic V2 miner for PORT_SCAN_AUDIT. PACK READY - only 4 candidates; 2 keyless. Realistic keyless ceiling is 2. Others need free keys. Distinct publishers: 4. Capture pin answers: Must satisfy catalog intent PORT_SCAN_AUDIT via upstream HackerTarget (nmap)"

base_url: https://api.hackertarget.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://api.hackertarget.com/
  website: https://api.hackertarget.com

endpoints:
  - path: /query
    external_path: /nmap/
    method: GET
    description: Query for intent PORT_SCAN_AUDIT via Port Hackertarget Nmap.
    intents: [PORT_SCAN_AUDIT]
    params:
      query:
        required:
          - name: q
            type: string
            intents: ["*"]
            description: q

input_schema:
  type: object
  required: [q]
  properties:
    q: {type: string, description: "q", default: "example.com"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - PORT_SCAN_AUDIT

on_chain:
  description: Stores signal for PORT_SCAN_AUDIT (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

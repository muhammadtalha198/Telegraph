version: "1"
kind: miner
id: 29401
slug: route-paraswap-destamount
protocol: generic
name: ParaSwap Dest Amount
description: >
  ParaSwap quote destAmount as amount_out for pinned sell. Intent OPTIMAL_EXECUTION_ROUTE.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 30
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://developers.paraswap.network/
  website: https://paraswap.io/

endpoints:
  - path: /query
    external_path: /truth/route-paraswap
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      query:
        required:
          - name: srcToken
            type: string
            intents: ["*"]
            description: srcToken
          - name: destToken
            type: string
            intents: ["*"]
            description: destToken
          - name: amount
            type: string
            intents: ["*"]
            description: amount
          - name: network
            type: string
            intents: ["*"]
            description: network
          - name: srcDecimals
            type: string
            intents: ["*"]
            description: srcDecimals
          - name: destDecimals
            type: string
            intents: ["*"]
            description: destDecimals
          - name: side
            type: string
            intents: ["*"]
            description: side

input_schema:
  type: object
  required: [srcToken, destToken, amount, network]
  properties:
    srcToken: {type: string, description: "srcToken", default: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"}
    destToken: {type: string, description: "destToken", default: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"}
    amount: {type: string, description: "amount", default: "1000000000000000000"}
    network: {type: string, description: "network", default: "1"}
    srcDecimals: {type: string, description: "srcDecimals", default: "18"}
    destDecimals: {type: string, description: "destDecimals", default: "6"}
    side: {type: string, description: "side", default: "SELL"}

semantics:
  signal_mapping:
    label_field: amount_out
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores amount_out for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

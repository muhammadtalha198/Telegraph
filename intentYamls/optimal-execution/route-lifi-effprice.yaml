version: "1"
kind: miner
id: 61021
slug: route-lifi-effprice
protocol: generic
name: LI.FI Effective Price
description: >
  LI.FI quote → effective_price (toUSD/fromUSD).
  Intent OPTIMAL_EXECUTION_ROUTE — Usman truth-spec miner.

base_url: https://omni-chat.13.237.89.59.sslip.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://docs.telegraphprotocol.com/
  website: https://omni-chat.13.237.89.59.sslip.io

endpoints:
  - path: /query
    external_path: /truth/lifi-price
    method: GET
    description: Query for intent OPTIMAL_EXECUTION_ROUTE via LI.FI Effective Price.
    intents: [OPTIMAL_EXECUTION_ROUTE]
    params:
      query:
        required:
          - name: fromChain
            type: string
            intents: ["*"]
            description: From chain
          - name: toChain
            type: string
            intents: ["*"]
            description: To chain
          - name: fromToken
            type: string
            intents: ["*"]
            description: From token
          - name: toToken
            type: string
            intents: ["*"]
            description: To token
          - name: fromAmount
            type: string
            intents: ["*"]
            description: From amount
          - name: fromAddress
            type: string
            intents: ["*"]
            description: From address

input_schema:
  type: object
  required: [fromChain, toChain, fromToken, toToken, fromAmount, fromAddress]
  properties:
    fromChain: {type: string, description: "From chain", default: "1"}
    toChain: {type: string, description: "To chain", default: "1"}
    fromToken: {type: string, description: "From token", default: "0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE"}
    toToken: {type: string, description: "To token", default: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"}
    fromAmount: {type: string, description: "From amount", default: "1000000000000000000"}
    fromAddress: {type: string, description: "From address", default: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"}

semantics:
  signal_mapping:
    label_field: effective_price
  supported_intents:
    - OPTIMAL_EXECUTION_ROUTE

on_chain:
  description: Stores signal for OPTIMAL_EXECUTION_ROUTE.
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

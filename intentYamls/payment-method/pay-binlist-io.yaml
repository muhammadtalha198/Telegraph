version: "1"
kind: miner
id: 190156
slug: pay-binlist-io
protocol: generic
name: "Pay Binlist Io"
description: "Semantic V2 miner for PAYMENT_METHOD_VERIFY. Verifies card BIN validity, tokenization credentials, bank account routing, and active account standing. Capture pin answers: Must return the validity/details of the card BIN, bank account (IBAN) or routing number asked."

base_url: https://binlist.io

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://binlist.io/
  website: https://binlist.io

endpoints:
  - path: /query
    external_path: /lookup/45717360/
    method: GET
    description: Query for intent PAYMENT_METHOD_VERIFY via Pay Binlist Io.
    intents: [PAYMENT_METHOD_VERIFY]
    params:
      query:
        optional:
          - name: _
            type: string
            intents: ["*"]
            description: unused placeholder

input_schema:
  type: object
  required: []
  properties: {}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - PAYMENT_METHOD_VERIFY

on_chain:
  description: Stores signal for PAYMENT_METHOD_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok

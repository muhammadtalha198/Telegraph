version: "1"
kind: miner
id: 190158
slug: pay-openiban
protocol: generic
name: "Pay Openiban"
description: "Semantic V2 miner for PAYMENT_METHOD_VERIFY. Verifies card BIN validity, tokenization credentials, bank account routing, and active account standing. Capture pin answers: Must return the validity/details of the card BIN, bank account (IBAN) or routing number asked."

base_url: https://openiban.com

auth:
  type: none

rate_limit_per_sec: 1
cache_ttl_sec: 60
circuit_threshold: 5
circuit_cooldown_seconds: 30

docs:
  documentation: https://openiban.com/
  website: https://openiban.com

endpoints:
  - path: /query
    external_path: /validate/DE89370400440532013000
    method: GET
    description: Query for intent PAYMENT_METHOD_VERIFY via Pay Openiban.
    intents: [PAYMENT_METHOD_VERIFY]
    params:
      query:
        required:
          - name: getBIC
            type: string
            intents: ["*"]
            description: getBIC
          - name: validateBankCode
            type: string
            intents: ["*"]
            description: validateBankCode

input_schema:
  type: object
  required: [getBIC, validateBankCode]
  properties:
    getBIC: {type: string, description: "getBIC", default: "true"}
    validateBankCode: {type: string, description: "validateBankCode", default: "true"}

semantics:
  signal_mapping:
    label_field: answer
  supported_intents:
    - PAYMENT_METHOD_VERIFY

on_chain:
  description: Stores signal for PAYMENT_METHOD_VERIFY (Semantic V2 format-agnostic).
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: result
        description: Primary result
        source_path: result
      - index: 1
        name: intent
        description: Intent name
        source_path: intent
    integers:
      - index: 0
        name: ok
        description: Success flag
        source_path: ok
